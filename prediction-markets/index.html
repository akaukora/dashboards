<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prediction Markets</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --plane:          #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --venue-poly:     #2a78d6;
    --venue-kalshi:   #eb6834;
    --gain:           #2a78d6;
    --loss:           #e34948;
    --gain-text:      #184f95;
    --loss-text:      #b32e2d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --plane:          #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --grid:           #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --venue-poly:     #3987e5;
      --venue-kalshi:   #d95926;
      --gain:           #3987e5;
      --loss:           #e66767;
      --gain-text:      #86b6ef;
      --loss-text:      #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --plane:          #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --venue-poly:     #3987e5;
    --venue-kalshi:   #d95926;
    --gain:           #3987e5;
    --loss:           #e66767;
    --gain-text:      #86b6ef;
    --loss-text:      #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 24px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .stamp { color: var(--text-muted); font-size: 13px; }
  .theme-btn {
    margin-left: auto; background: none; border: 1px solid var(--border);
    color: var(--text-secondary); border-radius: 7px; padding: 5px 11px;
    font: inherit; font-size: 13px; cursor: pointer;
  }
  .theme-btn:hover { border-color: var(--baseline); }

  .notice {
    margin: 16px 0 0; padding: 10px 13px; border: 1px solid var(--border);
    border-left: 3px solid var(--venue-kalshi); border-radius: 7px;
    background: var(--surface-1); color: var(--text-secondary); font-size: 13.5px;
  }

  .filters { display: flex; gap: 6px; margin: 22px 0 18px; flex-wrap: wrap; align-items: center; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); border-radius: 999px; padding: 6px 14px;
    font: inherit; font-size: 13.5px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 7px;
  }
  .chip:hover { border-color: var(--baseline); }
  .chip[aria-pressed="true"] {
    background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary);
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .chip[aria-pressed="true"] .dot { outline: 1.5px solid var(--surface-1); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 11px; padding: 15px 16px;
  }
  .tile .label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 7px; }
  .tile .value { font-size: 27px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
  .tile .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 5px; }
  .pos { color: var(--gain-text); }
  .neg { color: var(--loss-text); }

  h2 { font-size: 15.5px; font-weight: 600; margin: 36px 0 3px; }
  .hint { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 11px; overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; font-weight: 500; color: var(--text-muted);
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 11px 14px; border-bottom: 1px solid var(--grid); white-space: nowrap;
  }
  td { padding: 11px 14px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--plane); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .market { display: flex; align-items: center; gap: 9px; }
  .market .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .market a { color: inherit; text-decoration: none; }
  .market a:hover { text-decoration: underline; }
  .side {
    font-size: 11.5px; color: var(--text-secondary); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px; white-space: nowrap;
  }
  .venue-label { font-size: 11.5px; color: var(--text-muted); }

  .bar-cell { width: 128px; }
  .bar-track { height: 9px; background: var(--grid); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 0 4px 4px 0; }

  .pnl-row { display: grid; grid-template-columns: minmax(0,1fr) 320px 92px; gap: 14px; align-items: center; padding: 7px 14px; }
  .pnl-row:hover { background: var(--plane); }
  .pnl-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pnl-plot { position: relative; height: 15px; }
  .pnl-axis { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--baseline); }
  .pnl-bar { position: absolute; top: 3px; height: 9px; }
  .pnl-bar.p { border-radius: 0 4px 4px 0; background: var(--gain); }
  .pnl-bar.n { border-radius: 4px 0 0 4px; background: var(--loss); }
  .pnl-val { font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }

  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-secondary); margin: 0 0 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  .empty { padding: 26px 16px; color: var(--text-muted); font-size: 13.5px; text-align: center; }
  footer { margin-top: 40px; font-size: 12.5px; color: var(--text-muted); }
  footer a { color: inherit; }

  #tip {
    position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
    background: var(--text-primary); color: var(--surface-1); font-size: 12.5px;
    padding: 7px 10px; border-radius: 7px; max-width: 280px; z-index: 50; line-height: 1.4;
  }
  @media (max-width: 640px) {
    .bar-cell, .col-opt { display: none; }
    .tile .value { font-size: 23px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Prediction Markets</h1>
    <span class="stamp" id="stamp"></span>
    <button class="theme-btn" id="theme">Dark</button>
  </header>

  <div id="notices"></div>

  <div class="filters" id="filters" role="group" aria-label="Filter by venue"></div>

  <div class="tiles" id="tiles"></div>

  <h2>Open positions</h2>
  <p class="hint" id="open-hint"></p>
  <div class="card" id="open-card"></div>

  <h2>Settled markets</h2>
  <p class="hint">Realized profit and loss per resolved market.</p>
  <div class="legend">
    <span><i style="background:var(--gain)"></i>Profit</span>
    <span><i style="background:var(--loss)"></i>Loss</span>
  </div>
  <div class="card" id="closed-card"></div>

  <footer id="footer"></footer>
</div>

<div id="tip" role="tooltip"></div>

<script>
const VENUES = {
  polymarket: { name: 'Polymarket', color: 'var(--venue-poly)' },
  kalshi:     { name: 'Kalshi',     color: 'var(--venue-kalshi)' }
};

let DATA = null;
let filter = 'all';

const usd = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = n => (n >= 0 ? '+' : '-') + '$' + Math.abs(n).toLocaleString('en-US',
  { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = n => (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const cls = n => n >= 0 ? 'pos' : 'neg';
// A missing price is shown as unknown, never as zero — a zero here would read
// as a total loss when it actually means the venue returned no quote.
const price3 = p => (p == null ? '—' : p.toFixed(3));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const rows = key => (DATA[key] || []).filter(r => filter === 'all' || r.venue === filter);

/* ---------- tooltip ---------- */
const tip = document.getElementById('tip');
function bindTip(el, html) {
  el.addEventListener('mouseenter', () => { tip.innerHTML = html; tip.style.opacity = 1; });
  el.addEventListener('mousemove', e => {
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + tip.offsetWidth > innerWidth - 8) x = e.clientX - tip.offsetWidth - pad;
    if (y + tip.offsetHeight > innerHeight - 8) y = e.clientY - tip.offsetHeight - pad;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  el.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
}

/* ---------- render ---------- */
function renderNotices() {
  const box = document.getElementById('notices');
  const out = [];
  if (DATA.preview) {
    out.push('Preview data, transcribed by hand from the Polymarket API. ' +
             'The first workflow run replaces this file with fetched values.');
  }
  for (const [id, v] of Object.entries(DATA.venues || {})) {
    if (!v.ok) out.push(`${VENUES[id]?.name || id} not loaded — ${esc(v.error || 'unknown reason')}.`);
  }
  box.innerHTML = out.map(t => `<p class="notice">${t}</p>`).join('');
}

function renderFilters() {
  const active = Object.entries(DATA.venues || {}).filter(([, v]) => v.ok).map(([k]) => k);
  const opts = [['all', 'All venues', null], ...active.map(k => [k, VENUES[k].name, VENUES[k].color])];
  document.getElementById('filters').innerHTML = opts.map(([k, label, color]) =>
    `<button class="chip" data-v="${k}" aria-pressed="${filter === k}">` +
    (color ? `<span class="dot" style="background:${color}"></span>` : '') +
    `${label}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b =>
    b.onclick = () => { filter = b.dataset.v; renderAll(); });
}

function scope() {
  if (filter === 'all') return DATA.totals;
  return DATA.venues[filter];
}

function renderTiles() {
  const t = scope();
  const cards = [
    ['Position value', usd(t.open_value), `${t.open_positions} open`, ''],
    ['Unrealized P&L', signed(t.unrealized_pnl), 'on open positions', cls(t.unrealized_pnl)],
    ['Realized P&L', signed(t.realized_pnl), `${t.settled_markets} settled`, cls(t.realized_pnl)],
    ['Total P&L', signed(t.total_pnl), 'realized + unrealized', cls(t.total_pnl)],
    ['Win rate', t.win_rate == null ? '—' : t.win_rate.toFixed(0) + '%',
     t.settled_markets ? `best ${signed(t.best_win)}` : 'no settled markets', '']
  ];
  document.getElementById('tiles').innerHTML = cards.map(([l, v, s, c]) =>
    `<div class="tile"><div class="label">${l}</div>` +
    `<div class="value ${c}">${v}</div><div class="sub">${s}</div></div>`).join('');
}

function renderOpen() {
  const list = rows('positions');
  const card = document.getElementById('open-card');
  const hint = document.getElementById('open-hint');
  if (!list.length) {
    hint.textContent = '';
    card.innerHTML = '<div class="empty">No open positions.</div>';
    return;
  }
  hint.textContent = 'Bar length is position value relative to the largest holding.';
  const max = Math.max(...list.map(p => p.current_value), 0.01);
  const body = list.map(p => {
    const v = VENUES[p.venue] || { name: p.venue, color: 'var(--text-muted)' };
    const w = Math.max(2, p.current_value / max * 100);
    const title = p.url
      ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`
      : esc(p.title);
    return `<tr data-tip="${esc(v.name)} · ${esc(p.outcome)}<br>` +
      `${p.size.toFixed(2)} contracts @ ${p.avg_price.toFixed(3)} → ${price3(p.cur_price)}` +
      (p.price_basis && p.price_basis !== 'last' ? ` (${esc(p.price_basis)})` : '') + `<br>` +
      `Cost ${esc(usd(p.cost_basis))} · Now ${esc(usd(p.current_value))}` +
      (p.end_date ? `<br>Resolves ${esc(p.end_date)}` : '') + `">
      <td><div class="market"><span class="dot" style="background:${v.color}"></span>
        <div>${title}<div class="venue-label">${esc(v.name)}${p.redeemable ? ' · redeemable' : ''}</div></div>
      </div></td>
      <td><span class="side">${esc(p.outcome)}</span></td>
      <td class="num col-opt">${price3(p.cur_price)}</td>
      <td class="num">${usd(p.current_value)}</td>
      <td class="num ${cls(p.unrealized_pnl)}">${signed(p.unrealized_pnl)}<br>
        <span style="font-size:11.5px;opacity:.75">${pct(p.pct_pnl)}</span></td>
      <td class="bar-cell"><div class="bar-track">
        <div class="bar-fill" style="width:${w}%;background:${v.color}"></div></div></td>
    </tr>`;
  }).join('');

  card.innerHTML = `<table><thead><tr>
    <th>Market</th><th>Side</th><th class="num col-opt">Price</th>
    <th class="num">Value</th><th class="num">Unrealized</th><th></th>
  </tr></thead><tbody>${body}</tbody></table>`;

  card.querySelectorAll('tbody tr').forEach(tr => bindTip(tr, tr.dataset.tip));
}

function renderClosed() {
  const list = rows('closed').slice().sort((a, b) => b.realized_pnl - a.realized_pnl);
  const card = document.getElementById('closed-card');
  if (!list.length) { card.innerHTML = '<div class="empty">No settled markets.</div>'; return; }

  // Place the zero axis so each arm gets room in proportion to its own extreme,
  // rather than splitting the plot down the middle regardless of the data.
  const up = Math.max(...list.map(c => c.realized_pnl), 0);
  const down = Math.abs(Math.min(...list.map(c => c.realized_pnl), 0));
  const span = (up + down) || 1;
  const ZERO = Math.min(85, Math.max(15, down / span * 100));
  card.innerHTML = '<div style="padding:8px 0">' + list.map(c => {
    const v = VENUES[c.venue] || { name: c.venue };
    const p = c.realized_pnl >= 0;
    const w = Math.abs(c.realized_pnl) / span * 100;   // one scale, both arms
    return `<div class="pnl-row" data-tip="${esc(v.name)} · ${esc(c.outcome)}<br>` +
      `${c.size.toFixed(2)} contracts @ ${c.avg_price.toFixed(3)}<br>` +
      `Cost ${esc(usd(c.cost_basis))} · ${esc(signed(c.realized_pnl))} (${esc(pct(c.pct_pnl))})` +
      (c.closed_at ? `<br>Settled ${esc(c.closed_at)}` : '') + `">
      <div class="pnl-name">${c.url
        ? `<a href="${esc(c.url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${esc(c.title)}</a>`
        : esc(c.title)}</div>
      <div class="pnl-plot">
        <div class="pnl-axis" style="left:${ZERO}%"></div>
        <div class="pnl-bar ${p ? 'p' : 'n'}" style="${p ? `left:${ZERO}%` : `right:${100 - ZERO}%`};width:${w}%"></div>
      </div>
      <div class="pnl-val ${cls(c.realized_pnl)}">${signed(c.realized_pnl)}</div>
    </div>`;
  }).join('') + '</div>';

  card.querySelectorAll('.pnl-row').forEach(r => bindTip(r, r.dataset.tip));
}

function renderAll() {
  renderFilters(); renderTiles(); renderOpen(); renderClosed();
}

/* ---------- theme ---------- */
const themeBtn = document.getElementById('theme');
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t;
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme &&
      matchMedia('(prefers-color-scheme: dark)').matches);
  themeBtn.textContent = dark ? 'Light' : 'Dark';
}
themeBtn.onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme &&
      matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('pm-theme', next); } catch (e) {}
};
try { applyTheme(localStorage.getItem('pm-theme')); } catch (e) { applyTheme(); }

/* ---------- boot ---------- */
fetch('data.json?' + Date.now())
  .then(r => { if (!r.ok) throw new Error('data.json ' + r.status); return r.json(); })
  .then(d => {
    DATA = d;
    const when = new Date(d.generated_at);
    document.getElementById('stamp').textContent = 'updated ' +
      when.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
    document.getElementById('footer').innerHTML =
      'Polymarket figures from the public Data API; Kalshi from the authenticated ' +
      'portfolio API. Kalshi P&amp;L is reconstructed from cost basis, settlements and fees, ' +
      'so it is computed differently from Polymarket\'s own reported numbers.';
    renderNotices(); renderAll();
  })
  .catch(e => {
    document.getElementById('tiles').innerHTML =
      `<div class="empty">Could not load data.json — ${esc(e.message)}</div>`;
  });
</script>
</body>
</html>
