*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);line-height:1.5;font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:1.15rem 1rem 4rem}

.sub{font-size:12.5px;color:var(--t2);margin:0 0 .9rem}

.tab{padding:8px 13px;border:0;background:none;color:var(--t2);font-size:13.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.9rem}
.st{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:6px 12px;font-size:11.5px;color:var(--t2)}

input[type=text],select,textarea{padding:7px 10px;border-radius:var(--r);border:1px solid var(--bs);background:var(--card);color:var(--tx);font-size:13.5px;font-family:inherit}
input[type=text]{flex:1;min-width:150px}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--bs);background:var(--card);color:var(--tx);font-size:12.5px;cursor:pointer}
.pill.active{background:var(--acb);color:var(--act);border-color:var(--ac)}

.row.tg{border-color:var(--wn);background:var(--wnb)}
.row.dd{opacity:.42}

.inf{flex:1;min-width:0}
.tt{font-size:13.5px;font-weight:600;margin:0}
.mt{font-size:11.5px;color:var(--t2);margin:1px 0 0}
.fl{font-size:11px;font-weight:600;margin-top:2px;display:block}
.fl.c{color:var(--dg)}.fl.t{color:var(--wn)}.fl.d{color:var(--t3)}
.sbtn{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--bs);background:var(--card);color:var(--t3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

.fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bn.info b{font-weight:600}

.fs{font-size:11px;font-weight:600;white-space:nowrap}
.fs.done{color:var(--sbt)}.fs.urgent{color:var(--dg)}.fs.soon{color:var(--wn)}.fs.ok{color:var(--t2)}

.ob{padding:2px 7px;border-radius:999px;border:1px solid var(--bs);background:var(--card);color:var(--tx);font-size:10.5px;cursor:pointer;flex-shrink:0}

.bn.warn{background:var(--wnb);border-color:var(--wn);color:var(--wn)}

.gcol:last-child{border-right:0}

.gtrack{position:relative}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--border);pointer-events:none}
.tlab{position:absolute;right:5px;font-size:10px;color:var(--t3);font-variant-numeric:tabular-nums;transform:translateY(-1px)}
.blk{position:absolute;left:3px;right:3px;border-radius:6px;border:1px solid var(--bs);background:var(--card2);padding:3px 5px;overflow:hidden;cursor:pointer;font-size:10.5px;line-height:1.25}

.cb{width:26px;height:26px}
a{color:var(--ac)}

.blk.so{border-style:dashed}
.okmsg{color:var(--t3)}
.warnmsg{color:var(--wn);font-weight:500}

.tabs{display:flex;gap:6px;margin-bottom:.8rem;border-bottom:0;overflow-x:auto;padding-bottom:2px}
.tb{font-weight:500;font-size:13px;padding:7px 13px}

.issnames{color:var(--t2);display:flex;gap:5px;flex-wrap:wrap}
.fbtn{background:none;border:0;border-bottom:1px dotted var(--bs);color:var(--tx);font-size:12.5px;font-family:inherit;padding:0;cursor:pointer;text-align:left}
.fbtn:hover{border-bottom-color:var(--ac);color:var(--ac)}
.issclean{font-size:12.5px;color:var(--t2)}

 .gcol{flex:0 0 112px}

 .wrap{padding:1rem .7rem 3rem}

const S = DATA.s, PRESET = DATA.preset || [], META = DATA.meta;
const PRESET_NAME = DATA.presetName || '';
const SKEY = 'hiff2026-' + (DATA.build || 'shared');
const SEED_SOLDOUT = DATA.soldout || [];
const BY_FILM = {};
S.forEach(f => { (BY_FILM[f.film] = BY_FILM[f.film] || []).push(f); });
Object.values(BY_FILM).forEach(a => a.sort((x,y) => x.dateKey-y.dateKey || tm(x.start)-tm(y.start)));
const ALL_FILMS = Object.keys(BY_FILM).sort((a,b)=>a.localeCompare(b,'fi'));
const DAYS = [...new Map(S.map(f=>[f.dateKey,f.dateLabel])).entries()].sort((a,b)=>a[0]-b[0]);
const THEMES = [...new Set(Object.values(META).map(m=>m.t).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
const KWS = [...new Set(Object.values(META).flatMap(m=>m.k))].sort((a,b)=>a.localeCompare(b));

const AV = ['unknown','available','limited','sold out'];
const AVC = ['var(--t3)','var(--ok)','var(--wn)','var(--dg)'];

let shortlist = new Set(), picks = new Set(), avail = {};
let view='film', query='', theme='', kw='', gridScope='short';
let gridDay = DAYS[1] ? DAYS[1][0] : DAYS[0][0];
let catOnlyIn=false, ready=false;

function tm(t){ const p=t.split(':'); return +p[0]*60 + +p[1]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const byId = id => S.find(f=>f.id===id);
const IDX = {}; S.forEach(f => IDX[f.id]=f);
const get = id => IDX[id];
const meta = n => META[n] || {g:'',t:'',d:'',x:'',k:[]};

const mem={};
const store={
  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k,false); return r&&r.value; } }catch(e){}
    try{ const v=window.localStorage.getItem(k); if(v!==null) return v; }catch(e){}
    return mem[k];
  },
  async set(k,v){
    mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k,v,false); return; } }catch(e){}
    try{ window.localStorage.setItem(k,v); }catch(e){}
  }
};
let storeOk = null;
async function probeStore(){
  try{
    await store.set(SKEY+'-probe','1');
    const v = await store.get(SKEY+'-probe');
    return v === '1';
  }catch(e){ return false; }
}
async function load(){
  const raw = await store.get(SKEY+'-state');
  let st=null; try{ st = raw?JSON.parse(raw):null; }catch(e){}
  if(st && st.shortlist){
    shortlist = new Set(st.shortlist.filter(n=>BY_FILM[n]));
    picks = new Set((st.picks||[]).filter(i=>get(i)));
    avail = st.avail || {};
  } else {
    shortlist = new Set(PRESET);
    SEED_SOLDOUT.forEach(i => { if(get(i)) avail[i] = 3; });
  }
  storeOk = await probeStore();
  ready=true;
  setView(shortlist.size ? 'film' : 'cat');
  render();
}
function persist(){ store.set(SKEY+'-state', JSON.stringify({shortlist:[...shortlist],picks:[...picks],avail})); }

const av = id => avail[id] || 0;
function cycleAv(id){ avail[id] = (av(id)+1)%4; if(avail[id]===0) delete avail[id]; persist(); render(); }
const soldOut = id => av(id)===3;

function overlaps(a,b){ return a.dateKey===b.dateKey && tm(a.start)<tm(b.end) && tm(b.start)<tm(a.end); }
function gapMin(a,b){
  if(a.dateKey!==b.dateKey) return null;
  const ae=tm(a.end),bs=tm(b.start),as=tm(a.start),be=tm(b.end);
  if(bs>=ae) return bs-ae; if(as>=be) return as-be; return null;
}
function pickFlags(){
  const it=[...picks].map(get).filter(Boolean), fl={};
  it.forEach(f=>fl[f.id]={cf:false,tg:0,dup:false});
  for(let i=0;i<it.length;i++) for(let j=i+1;j<it.length;j++){
    const a=it[i],b=it[j];
    if(a.film===b.film){ fl[a.id].dup=true; fl[b.id].dup=true; }
    if(overlaps(a,b)){ fl[a.id].cf=true; fl[b.id].cf=true; continue; }
    if(a.venue!==b.venue){
      const g=gapMin(a,b);
      if(g!==null&&g<20){
        fl[a.id].tg=fl[a.id].tg?Math.min(fl[a.id].tg,g):g;
        fl[b.id].tg=fl[b.id].tg?Math.min(fl[b.id].tg,g):g;
      }
    }
  }
  return fl;
}
function blockedBy(s){
  for(const pid of picks){
    const p=get(pid);
    if(!p||p.id===s.id||p.film===s.film) continue;
    if(overlaps(p,s)) return p;
  }
  return null;
}
function filmState(n){
  const opts=BY_FILM[n];
  const picked=opts.filter(o=>picks.has(o.id));
  const free=opts.filter(o=>!blockedBy(o) && !soldOut(o.id));
  const out=opts.filter(o=>soldOut(o.id)).length;
  if(picked.length) return {k:'done',picked,free,opts,out};
  if(!free.length) return {k:'urgent',picked,free,opts,out,msg: out===opts.length?'all sold out':'no free slot'};
  if(free.length===1) return {k:'soon',picked,free,opts,out,msg:'1 slot left'};
  return {k:'ok',picked,free,opts,out,msg:free.length+' slots free'};
}
function gridPick(id){
  const f=get(id); if(!f) return;
  if(picks.has(id)){
    picks.delete(id);                       // picked -> shortlisted only
  } else if(shortlist.has(f.film) && !BY_FILM[f.film].some(o=>picks.has(o.id))){
    shortlist.delete(f.film);               // shortlisted, no pick -> off the list
  } else {
    shortlist.add(f.film); picks.add(id);   // off the list -> shortlisted + picked
  }
  persist(); render();
}
function gridHint(f){
  if(picks.has(f.id)) return 'click to unpick';
  if(shortlist.has(f.film) && !BY_FILM[f.film].some(o=>picks.has(o.id))) return 'click to remove from shortlist';
  return 'click to shortlist and pick';
}
function togglePick(id){ picks.has(id)?picks.delete(id):picks.add(id); persist(); render(); }
function toggleShort(n){
  if(shortlist.has(n)){ shortlist.delete(n); BY_FILM[n].forEach(o=>picks.delete(o.id)); }
  else shortlist.add(n);
  persist(); render();
}

function infoBox(){
  if(view==='cat') return `<div class="bn info"><b>Step 1 \u2014 what do you want to see?</b> All ${ALL_FILMS.length} titles with the festival's own descriptions. Tick a film to shortlist it; you don't choose times here. ${shortlist.size} shortlisted so far.</div>`;
  if(view==='film') return `<div class="bn info"><b>Step 2 \u2014 when will you see them?</b> Your ${shortlist.size} shortlisted film${shortlist.size===1?'':'s'}, each with every screening it has. Pick one time per film. Films with the fewest slots left come first. Use the \u25cb dot to mark a screening sold out.</div>`;
  if(view==='grid') return `<div class="bn info"><b>The day laid out.</b> Venues across the top, clock down the side; scroll sideways for more venues. Clicking a film cycles it: shortlist and pick \u2192 unpick \u2192 off the shortlist.</div>`;
  return `<div class="bn info"><b>Your festival.</b> Every pick in order, with the gap and any venue change between them.</div>`;
}

function renderStats(){
  const names=[...shortlist], sts=names.map(filmState);
  const done=sts.filter(s=>s.k==='done').length;
  let h=`<div class="st"><b>${names.length}</b>on shortlist</div>`;
  h+=`<div class="st"><b>${done}/${names.length}</b>times chosen</div>`;
  const pd=[...picks].map(get).filter(Boolean);
  const dayCount=new Set(pd.map(f=>f.dateKey)).size;
  if(pd.length) h+=`<div class="st"><b>${pd.length}</b>screenings over ${dayCount} day${dayCount===1?'':'s'}</div>`;
  document.getElementById('stats').innerHTML=h;
  renderIssues();
}

function fb(n){ return `<button class="fbtn" data-focus="${esc(n)}">${esc(n)}</button>`; }

function renderIssues(){
  const el=document.getElementById('issues');
  if(!shortlist.size){ el.innerHTML=''; return; }
  const fl=pickFlags(), it=[...picks].map(get).filter(Boolean);
  const names=[...shortlist];
  const urgent=[], soon=[];
  names.forEach(n=>{
    const s=filmState(n);
    if(s.k==='urgent') urgent.push([n, s.out===s.opts.length?'all sold out':'blocked by your picks']);
    else if(s.k==='soon') soon.push(n);
  });
  const clashes=[], tights=[];
  for(let i=0;i<it.length;i++) for(let j=i+1;j<it.length;j++){
    const a=it[i],b=it[j];
    if(overlaps(a,b)) clashes.push([a,b]);
    else if(a.venue!==b.venue){
      const g=gapMin(a,b);
      if(g!==null&&g<20) tights.push([a,b,g]);
    }
  }
  const dups=[...new Set(it.filter(f=>fl[f.id].dup).map(f=>f.film))];
  const so=it.filter(f=>soldOut(f.id));
  const rows=[];
  if(urgent.length) rows.push(`<div class="issrow"><span class="isslab bad">No slot left</span>
    <span class="issnames">${urgent.map(([n,w])=>fb(n)+`<span style="color:var(--t3)">(${w})</span>`).join(' ')}</span></div>`);
  if(soon.length) rows.push(`<div class="issrow"><span class="isslab wn">Down to 1 slot</span>
    <span class="issnames">${soon.map(fb).join(' ')}</span></div>`);
  if(clashes.length) rows.push(`<div class="issrow"><span class="isslab bad">Overlapping picks</span>
    <span class="issnames">${clashes.map(([a,b])=>`<span>${fb(a.film)} ${a.start}\u2013${a.end} vs ${fb(b.film)} ${b.start}\u2013${b.end}, ${a.dateLabel}</span>`).join('; ')}</span></div>`);
  if(tights.length) rows.push(`<div class="issrow"><span class="isslab wn">Tight changeover</span>
    <span class="issnames">${tights.map(([a,b,g])=>`<span>${g} min: ${fb(a.film)} (${esc(a.venue)}) \u2192 ${fb(b.film)} (${esc(b.venue)}), ${a.dateLabel}</span>`).join('; ')}</span></div>`);
  if(dups.length) rows.push(`<div class="issrow"><span class="isslab wn">Picked twice</span>
    <span class="issnames">${dups.map(fb).join(' ')}</span></div>`);
  if(so.length) rows.push(`<div class="issrow"><span class="isslab bad">Picked but sold out</span>
    <span class="issnames">${so.map(f=>`<span>${fb(f.film)} ${f.dateLabel} ${f.start}</span>`).join('; ')}</span></div>`);
  el.innerHTML = rows.length
    ? `<div class="iss">${rows.join('')}</div>`
    : `<div class="iss"><span class="issclean">No conflicts. ${names.length-[...shortlist].filter(n=>filmState(n).k==='done').length} film${names.length-[...shortlist].filter(n=>filmState(n).k==='done').length===1?'':'s'} still without a time.</span></div>`;
}

function avBtn(id){
  const a=av(id);
  return `<button class="avb" data-av="${id}" title="Ticket availability: ${AV[a]} \u2014 click to change"
    aria-label="Availability ${AV[a]}" style="color:${AVC[a]}">${a===0?'\u25cb':'\u25cf'}</button>`;
}
function kwPills(n){
  const m=meta(n);
  const bits=[];
  if(m.g) bits.push(m.g);
  if(m.t) bits.push(m.t);
  return bits.join(' \u00b7 ');
}

function rowHtml(f, fl){
  const on=picks.has(f.id), g=on?fl[f.id]:null;
  const inS=shortlist.has(f.film);
  const bl=!on&&inS?blockedBy(f):null;
  let c='row', flag='';
  if(on&&g.cf){ c+=' cf'; flag='<span class="fl c">overlaps another pick</span>'; }
  else if(on&&g.dup){ c+=' tg'; flag='<span class="fl t">this film is already picked elsewhere</span>'; }
  else if(on&&g.tg){ c+=' tg'; flag=`<span class="fl t">${g.tg} min to change venue</span>`; }
  else if(on){ c+=' pk'; }
  else if(bl){ c+=' dd'; flag=`<span class="fl d">clashes with ${esc(bl.film)}</span>`; }
  if(soldOut(f.id)) c += ' so';
  const soBadge = soldOut(f.id) ? '<span class="sold">sold out</span>' : '';
  const d=f.duration?` \u00b7 ${f.duration} min`:'';
  const n=f.screening_num?` \u00b7 ${f.screening_num}/${f.screening_total}`:'';
  return `<div class="${c}"><div class="tmc">${f.start}</div><div class="inf">
    <p class="tt">${esc(f.title)}${soBadge}</p>
    <p class="mt">${f.start}\u2013${f.end}${d} \u00b7 ${esc(f.venue)}${n}</p>${flag}</div>
    ${avBtn(f.id)}
    <button class="sbtn${on?' on':''}" data-pick="${f.id}" aria-label="Toggle pick">${on?'\u2605':'\u2606'}</button></div>`;
}

function filterNames(names){
  if(theme) names=names.filter(n=>meta(n).t===theme);
  if(kw) names=names.filter(n=>meta(n).k.includes(kw));
  if(query) names=names.filter(n => n.toLowerCase().includes(query)
    || (meta(n).d||'').toLowerCase().includes(query)
    || (meta(n).x||'').toLowerCase().includes(query));
  return names;
}
function filterBar(ph){
  return `<div class="ctrl"><input type="text" id="q" placeholder="${ph}" value="${esc(query)}">
    <select id="theme"><option value="">All themes</option>${THEMES.map(t=>`<option value="${esc(t)}"${t===theme?' selected':''}>${esc(t)}</option>`).join('')}</select>
    <select id="kw"><option value="">All keywords</option>${KWS.map(k=>`<option value="${esc(k)}"${k===kw?' selected':''}>${esc(k)}</option>`).join('')}</select></div>`;
}

function vCat(){
  let names=ALL_FILMS;
  if(catOnlyIn) names=names.filter(n=>shortlist.has(n));
  names=filterNames(names);
  let h=filterBar('Search title, director or description\u2026');
  h+=`<div class="ctrl" style="margin-top:-4px">
    <button class="pill${catOnlyIn?' active':''}" id="onlyIn">Shortlist only</button>
    <button class="pill" id="clearAll">Clear shortlist</button>
    <span class="cc" style="margin-left:4px">${names.length} shown</span></div>`;
  if(!names.length) return h+'<p class="empty">Nothing matches.</p>';
  h+=names.map(n=>{
    const o=BY_FILM[n], m=meta(n), on=shortlist.has(n);
    const dur=o[0].duration?o[0].duration+' min':'event';
    return `<div class="fc${on?' insl':''}">
      <div class="fh"><p class="fn">${esc(n)}</p>
        <button class="cb${on?' on':''}" data-short="${esc(n)}" aria-label="Toggle shortlist">${on?'\u2713':'+'}</button></div>
      <p class="cc" style="margin:1px 0 0">${esc(kwPills(n))}${m.d?' \u00b7 dir. '+esc(m.d):''} \u00b7 ${dur} \u00b7 ${o.length} screening${o.length>1?'s':''}</p>
      ${m.x?`<p class="dsc">${esc(m.x)}</p>`:''}
      ${m.k.length?`<p class="kws">${m.k.map(k=>esc(k)).join(' \u00b7 ')}</p>`:''}
    </div>`;
  }).join('');
  return h;
}

function vFilm(){
  if(!shortlist.size) return `<p class="empty">Nothing shortlisted yet. Go to "1. Choose films" and tick the ones you want to consider${PRESET.length?', or load a shortlist from the bar above':''}.</p>`;
  const names=filterNames([...shortlist]);
  const ord={urgent:0,soon:1,ok:2,done:3};
  const rows=names.map(n=>({n,s:filmState(n)}))
    .sort((a,b)=>ord[a.s.k]-ord[b.s.k]||a.n.localeCompare(b.n,'fi'));
  let h=filterBar('Filter shortlist\u2026');
  h+=rows.map(({n,s})=>{
    const m=meta(n);
    const cls=s.k==='done'?'done':s.k==='urgent'?'urgent':s.k==='soon'?'soon':'';
    const lab=s.k==='done'?`\u2605 ${s.picked[0].dateLabel} ${s.picked[0].start}`:s.msg;
    const opts=s.opts.map(o=>{
      const on=picks.has(o.id), bl=blockedBy(o), so=soldOut(o.id);
      const gone=(bl||so)&&!on;
      const d=o.duration?` \u00b7 ${o.duration} min`:'';
      const why=bl&&!so?' \u2014 clashes with '+esc(bl.film):'';
      return `<div class="opt${gone?' gone':''}${so?' soopt':''}">${avBtn(o.id)}
        <button class="ob${on?' on':''}" data-pick="${o.id}">${on?'\u2605 picked':'pick'}</button>
        <span>${o.dateLabel} ${o.start}\u2013${o.end}${d} \u00b7 ${esc(o.venue)}${why}</span>
        ${so?'<span class="sold">sold out</span>':''}</div>`;
    }).join('');
    return `<div class="fc ${cls}"><div class="fh"><p class="fn">${esc(n)}</p>
      <span class="fs ${s.k}">${lab}</span></div>
      <p class="cc" style="margin:1px 0 0">${esc(kwPills(n))}${m.d?' \u00b7 dir. '+esc(m.d):''}</p>
      ${m.x?`<p class="dsc">${esc(m.x)}</p>`:''}
      <div class="opts">${opts}</div></div>`;
  }).join('');
  return h;
}

const PXM=1.15;
function vGrid(){
  const fl=pickFlags();
  let pool=S.filter(f=>f.dateKey===gridDay);
  if(gridScope==='short') pool=pool.filter(f=>shortlist.has(f.film));
  else if(gridScope==='picks') pool=pool.filter(f=>picks.has(f.id));
  let h=`<div class="ctrl">
    <select id="gday">${DAYS.map(([k,l])=>`<option value="${k}"${k===gridDay?' selected':''}>${l}</option>`).join('')}</select>
    <button class="pill${gridScope==='short'?' active':''}" data-scope="short">Shortlist</button>
    <button class="pill${gridScope==='picks'?' active':''}" data-scope="picks">My picks</button>
    <button class="pill${gridScope==='all'?' active':''}" data-scope="all">Whole programme</button></div>`;
  h+=`<div class="leg"><span><i style="background:var(--acb);border-color:var(--ac)"></i>shortlist</span>
    <span><i style="background:var(--sb);border-color:var(--sbr)"></i>picked</span>
    <span><i style="background:var(--dgb);border-color:var(--dg)"></i>overlapping</span>
    <span><i style="background:var(--card2);opacity:.4"></i>blocked or sold out</span></div>`;
  if(!pool.length) return h+'<p class="empty">Nothing to show for this day at this scope.</p>';
  const venues=[...new Set(pool.map(f=>f.venue))].sort((a,b)=>a.localeCompare(b,'fi'));
  const t0=Math.floor(Math.min(...pool.map(f=>tm(f.start)))/60)*60;
  const t1=Math.ceil(Math.max(...pool.map(f=>tm(f.end)))/60)*60;
  const H=(t1-t0)*PXM;
  let lines='',labs='';
  for(let t=t0;t<=t1;t+=60){
    const y=(t-t0)*PXM;
    lines+=`<div class="hline" style="top:${y}px"></div>`;
    labs+=`<div class="tlab" style="top:${y}px">${String(Math.floor(t/60)).padStart(2,'0')}</div>`;
  }
  const cols=venues.map(v=>{
    const items=pool.filter(f=>f.venue===v);
    const blks=items.map(f=>{
      const on=picks.has(f.id), g=on?fl[f.id]:null;
      const bl=!on&&shortlist.has(f.film)?blockedBy(f):null;
      let c='blk';
      if(on&&g.cf) c+=' cf'; else if(on) c+=' pk'; else if(shortlist.has(f.film)) c+=' ll';
      if(bl&&!on) c+=' dd';
      if(soldOut(f.id)) c+=' so';
      const top=(tm(f.start)-t0)*PXM;
      const hh=Math.max((f.duration?tm(f.end)-tm(f.start):30)*PXM,30);
      const t=`${f.title} \u00b7 ${f.start}\u2013${f.end} \u00b7 ${f.venue}${soldOut(f.id)?' \u00b7 sold out':''}${bl?' \u00b7 clashes with '+bl.film:''} \u2014 ${gridHint(f)}`;
      return `<div class="${c}" style="top:${top}px;height:${hh-2}px" data-gpick="${f.id}" title="${esc(t)}">
        <b>${esc(f.film)}</b><span>${f.start}\u2013${f.end}${soldOut(f.id)?' \u00b7 SOLD OUT':''}</span></div>`;
    }).join('');
    return `<div class="gcol"><div class="ghead">${esc(v)}</div>
      <div class="gtrack" style="height:${H}px">${lines}${blks}</div></div>`;
  }).join('');
  h+=`<div class="gwrap"><div class="ginner">
    <div class="gutter"><div class="ghead"></div><div class="gtrack" style="height:${H}px">${labs}</div></div>
    ${cols}</div></div>`;
  h+=`<p class="mt">${pool.length} screening${pool.length>1?'s':''} across ${venues.length} venue${venues.length>1?'s':''}. Tap a block to pick or unpick.</p>`;
  return h;
}

function vMine(){
  const fl=pickFlags();
  const it=[...picks].map(get).filter(Boolean).sort((a,b)=>a.dateKey-b.dateKey||tm(a.start)-tm(b.start));
  if(!it.length) return '<p class="empty">No picks yet.</p>';
  const days=[...new Set(it.map(f=>f.dateKey))].sort((a,b)=>a-b);
  let h='';
  days.forEach(dk=>{
    const d=it.filter(f=>f.dateKey===dk);
    h+=`<p class="dayh">${d[0].dateLabel} \u2014 ${d.length} film${d.length>1?'s':''}</p>`;
    d.forEach((f,i)=>{
      h+=rowHtml(f,fl);
      const m=meta(f.film);
      if(m.x) h+=`<p class="dsc" style="margin:-3px 0 7px 52px">${esc(m.x)}</p>`;
      if(i<d.length-1&&!overlaps(f,d[i+1])){
        const g=gapMin(f,d[i+1]);
        if(g!==null) h+=`<p class="mt" style="margin:-2px 0 6px 52px">${g} min gap${f.venue!==d[i+1].venue?' \u00b7 venue change':''}</p>`;
      }
    });
  });
  return h;
}

function shareBox(){
  const code=btoa(unescape(encodeURIComponent(JSON.stringify({s:[...shortlist],p:[...picks],a:avail}))));
  return `<div class="bn"><p class="mt" style="margin:0 0 5px">Copy this code to move your shortlist, picks and availability notes to another device, or paste a friend's code to view theirs.</p>
    <textarea id="shareTa">${esc(code)}</textarea>
    <div class="ctrl" style="margin:6px 0 0"><button class="pill" id="loadShare">Load pasted code</button>
    <button class="pill" id="closeShare">Close</button></div></div>`;
}

function render(){
  if(!ready) return;
  document.getElementById('sub').innerHTML =
    `${ALL_FILMS.length} films \u00b7 ${S.length} screenings \u00b7 17.\u201327.9.2026 plus afters 3.10. \u00b7 <a href="https://hiff.fi/en/love-anarchy/timetable/">check live availability on hiff.fi</a>`;
  document.getElementById('foot').textContent =
    'Screenings and descriptions from hiff.fi, fetched 7.9.2026 \u2014 a few late-festival slots were still unannounced. Ticket availability is not included: it changes hour to hour, so mark it yourself with the dot next to each screening. Brunssin\u00e4yt\u00f6s and R&A-partner screenings are grouped with their main film. Your shortlist, picks and notes are saved in your own browser only.';
  const sel=document.getElementById('preset');
  if(sel && !sel.options.length) sel.innerHTML=`<option value="antti">${PRESET_NAME} \u2014 shortlist ${PRESET.length} films</option>
    <option value="blank">Empty \u2014 shortlist nothing, add as you browse</option>`;
  const ss=document.getElementById('storeMsg');
  if(ss) ss.innerHTML = storeOk===false
    ? '<span class="warnmsg">This browser is not saving your choices \u2014 copy the share code before you close the tab.</span>'
    : '<span class="okmsg">Saved in this browser</span>';
  document.getElementById('info').innerHTML=infoBox();
  renderStats();
  const b=document.getElementById('body');
  b.innerHTML = view==='cat'?vCat():view==='film'?vFilm():view==='grid'?vGrid():vMine();

  b.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>togglePick(+el.dataset.pick)));
  b.querySelectorAll('[data-gpick]').forEach(el=>el.addEventListener('click',()=>gridPick(+el.dataset.gpick)));
  document.querySelectorAll('[data-focus]').forEach(el=>el.addEventListener('click',()=>{
    const n=el.dataset.focus;
    setView('film'); query=n.toLowerCase(); theme=''; kw=''; render();
  }));
  b.querySelectorAll('[data-short]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();toggleShort(el.dataset.short);}));
  b.querySelectorAll('[data-av]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();cycleAv(+el.dataset.av);}));
  b.querySelectorAll('[data-scope]').forEach(el=>el.addEventListener('click',()=>{gridScope=el.dataset.scope;render();}));
  const gd=document.getElementById('gday');
  if(gd) gd.addEventListener('change',e=>{gridDay=+e.target.value;render();});
  const th=document.getElementById('theme');
  if(th) th.addEventListener('change',e=>{theme=e.target.value;render();});
  const kwe=document.getElementById('kw');
  if(kwe) kwe.addEventListener('change',e=>{kw=e.target.value;render();});
  const oi=document.getElementById('onlyIn');
  if(oi) oi.addEventListener('click',()=>{catOnlyIn=!catOnlyIn;render();});
  const ca=document.getElementById('clearAll');
  if(ca) ca.addEventListener('click',()=>{shortlist.clear();picks.clear();persist();render();});
  const q=document.getElementById('q');
  if(q) q.addEventListener('input',e=>{
    query=e.target.value.trim().toLowerCase(); render();
    const n=document.getElementById('q');
    if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); }
  });
}

function setView(v){
  view=v;
  document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('active', x.dataset.v===v));
}
document.querySelectorAll('.tb').forEach(t=>t.addEventListener('click',()=>{
  setView(t.dataset.v); query=''; theme=''; kw=''; render();
}));
const apBtn=document.getElementById('applyPreset');
if(apBtn) apBtn.addEventListener('click',()=>{
  const v=document.getElementById('preset').value;
  const next = v==='antti'?new Set(PRESET):new Set();
  const lose=[...picks].filter(id=>{const f=get(id); return !f||!next.has(f.film);}).length;
  if(lose && !confirm(`Loading this shortlist drops ${lose} time${lose>1?'s':''} you have already picked. Continue?`)) return;
  shortlist = next;
  [...picks].forEach(id=>{const f=get(id); if(!f||!shortlist.has(f.film)) picks.delete(id);});
  persist(); render();
});
const sbx=document.getElementById('shareBox');
document.getElementById('shareBtn').addEventListener('click',()=>{
  if(sbx.style.display==='none'){
    sbx.style.display='block'; sbx.innerHTML=shareBox();
    document.getElementById('closeShare').addEventListener('click',()=>{sbx.style.display='none';sbx.innerHTML='';});
    document.getElementById('loadShare').addEventListener('click',()=>{
      try{
        const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('shareTa').value.trim()))));
        shortlist=new Set((o.s||[]).filter(n=>BY_FILM[n]));
        picks=new Set((o.p||[]).filter(i=>get(i)));
        avail=o.a||{};
        persist(); sbx.style.display='none'; sbx.innerHTML=''; render();
      }catch(e){ alert('That code could not be read. Paste the whole thing, with no line breaks.'); }
    });
  } else { sbx.style.display='none'; sbx.innerHTML=''; }
});
load();

</script>
</body>
</html>
