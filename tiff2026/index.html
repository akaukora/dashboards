<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIFF 2026 planner</title>
<style>
:root{
 --bg:#f6f5f2;--card:#fff;--card2:#faf9f6;--border:#dedad2;--bs:#c7c1b5;
 --tx:#1c1c1a;--t2:#6b665c;--t3:#9a9488;
 --ac:#185fa5;--acb:#e6f1fb;--act:#0c447c;
 --dg:#a32d2d;--dgb:#fcebeb;
 --wn:#854f0b;--wnb:#faeeda;
 --sb:#ffe9b8;--sbr:#c98a12;--sbt:#7a5000;
 --wn2:#b4501a;--tkbg:#3b6d11;--tktx:#ffffff;
 --r:8px;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{
 --bg:#161512;--card:#201f1c;--card2:#26251f;--border:#3a382f;--bs:#4c4a3e;
 --tx:#eeece5;--t2:#b0aa9c;--t3:#847e70;
 --ac:#7fb0e8;--acb:#0c2a44;--act:#b5d4f4;
 --dg:#e07a7a;--dgb:#3a1414;
 --wn:#e0b25f;--wnb:#3a2a06;
 --sb:#4a3505;--sbr:#c98a12;--sbt:#ffd98a;
 --wn2:#f0995c;--tkbg:#9bc95f;--tktx:#122006}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);line-height:1.5;font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:1.15rem 1rem 4rem}
h1{font-size:19px;font-weight:600;margin:0 0 3px}
.sub{font-size:12.5px;color:var(--t2);margin:0 0 .9rem}
.presetbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;margin-bottom:.9rem}
.presetbar label{font-size:12.5px;color:var(--t2);font-weight:500}
.tabs{display:flex;gap:4px;margin-bottom:.9rem;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:8px 13px;border:0;background:none;color:var(--t2);font-size:13.5px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:var(--tx);border-bottom-color:var(--ac)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.9rem}
.st{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:6px 12px;font-size:11.5px;color:var(--t2)}
.st b{font-size:16px;display:block;color:var(--tx);font-weight:600}
.st.bad{border-color:var(--dg)}.st.bad b{color:var(--dg)}
.st.wn{border-color:var(--wn)}.st.wn b{color:var(--wn)}
.ctrl{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
input[type=text],select,textarea{padding:7px 10px;border-radius:var(--r);border:1px solid var(--bs);background:var(--card);color:var(--tx);font-size:13.5px;font-family:inherit}
input[type=text]{flex:1;min-width:150px}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--bs);background:var(--card);color:var(--tx);font-size:12.5px;cursor:pointer}
.pill.active{background:var(--acb);color:var(--act);border-color:var(--ac)}
.dayh{font-size:12.5px;font-weight:600;color:var(--t2);margin:1rem 0 5px;text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;align-items:flex-start;gap:9px;padding:7px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);margin-bottom:5px}
.row.pk{border-color:var(--sbr);background:var(--card2)}
.row.cf{border-color:var(--dg);background:var(--dgb)}
.row.tg{border-color:var(--wn);background:var(--wnb)}
.row.dd{opacity:.42}
.tmc{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;min-width:42px;padding-top:1px}
.inf{flex:1;min-width:0}
.tt{font-size:13.5px;font-weight:600;margin:0}
.mt{font-size:11.5px;color:var(--t2);margin:1px 0 0}
.fl{font-size:11px;font-weight:600;margin-top:2px;display:block}
.fl.c{color:var(--dg)}.fl.t{color:var(--wn)}.fl.d{color:var(--t3)}
.sbtn{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:1px solid var(--bs);background:var(--card);color:var(--t3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.sbtn.on{background:var(--sb);border-color:var(--sbr);color:var(--sbt)}
.fc{border:1px solid var(--border);border-radius:var(--r);background:var(--card);padding:8px 11px;margin-bottom:6px}
.fc.done{border-color:var(--sbr)}.fc.urgent{border-color:var(--dg)}.fc.soon{border-color:var(--wn)}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bn.info b{font-weight:600}
  .fn{font-size:13.5px;font-weight:600;margin:0}
.fs{font-size:11px;font-weight:600;white-space:nowrap}
.fs.done{color:var(--sbt)}.fs.urgent{color:var(--dg)}.fs.soon{color:var(--wn)}.fs.ok{color:var(--t2)}
.opts{margin-top:4px;display:flex;flex-direction:column;gap:3px}
.opt{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--t2)}
.opt.gone{text-decoration:line-through;color:var(--t3)}
.ob{padding:2px 7px;border-radius:999px;border:1px solid var(--bs);background:var(--card);color:var(--tx);font-size:10.5px;cursor:pointer;flex-shrink:0}
.ob.on{background:var(--sb);border-color:var(--sbr);color:var(--sbt)}
.cat{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);margin-bottom:4px}
.cat.in{border-color:var(--ac);background:var(--acb)}
.cat .cn{flex:1;min-width:0;font-size:13.5px;font-weight:500}
.cat .cc{font-size:11px;color:var(--t2);white-space:nowrap}
.cat.in .cn,.cat.in .cc{color:var(--act)}
.cb{width:26px;height:26px;flex-shrink:0;border-radius:6px;border:1px solid var(--bs);background:var(--card);color:var(--t3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.empty{color:var(--t3);font-size:13.5px;padding:1rem 0}
.note{font-size:11.5px;color:var(--t3);margin-top:2rem;border-top:1px solid var(--border);padding-top:11px}
.bn{font-size:12.5px;padding:8px 11px;border-radius:var(--r);margin-bottom:.9rem;border:1px solid var(--border);background:var(--card)}
.bn.info{background:var(--acb);border-color:var(--ac);color:var(--act)}
.bn.warn{background:var(--wnb);border-color:var(--wn);color:var(--wn)}

.gwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--card);margin-bottom:1.1rem}
.ginner{display:flex;min-width:min-content}
.gutter{flex:0 0 44px;position:sticky;left:0;z-index:3;background:var(--card);border-right:1px solid var(--border)}
.gcol{flex:0 0 128px;border-right:1px solid var(--border);min-width:0}
.gcol:last-child{border-right:0}
.ghead{height:34px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--t2);border-bottom:1px solid var(--border);padding:0 4px;text-align:center;line-height:1.15;background:var(--card);position:sticky;top:0;z-index:2}
.gtrack{position:relative}
.hline{position:absolute;left:0;right:0;border-top:1px solid var(--border);pointer-events:none}
.tlab{position:absolute;right:5px;font-size:10px;color:var(--t3);font-variant-numeric:tabular-nums;transform:translateY(-1px)}
.blk{position:absolute;left:3px;right:3px;border-radius:6px;border:1px solid var(--bs);background:var(--card2);padding:3px 5px;overflow:hidden;cursor:pointer;font-size:10.5px;line-height:1.25}
.blk.ll{border-color:var(--ac);background:var(--acb);color:var(--act)}
.blk.pk{border-color:var(--sbr);background:var(--sb);color:var(--sbt)}
.blk.cf{border-color:var(--dg);background:var(--dgb);color:var(--dg)}
.blk.dd{opacity:.35}
.blk b{font-weight:600;display:block;overflow:hidden}
.blk span{font-variant-numeric:tabular-nums;opacity:.8}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--t2);margin-bottom:.7rem}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--bs);vertical-align:-1px;margin-right:4px}

.fc.insl{border-color:var(--ac)}
.dsc{font-size:12.5px;color:var(--tx);margin:5px 0 0;line-height:1.45}
.kws{font-size:11px;color:var(--t3);margin:4px 0 0}
.avb{flex-shrink:0;width:24px;height:24px;border:1px solid var(--bs);border-radius:50%;background:var(--card);font-size:11px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.blk.so b{text-decoration:line-through}
.cb{width:26px;height:26px}
a{color:var(--ac)}

.sold{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--dgb);color:var(--dg);border:1px solid var(--dg);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.row.so{border-color:var(--dg)}
.opt.soopt span:first-of-type{text-decoration:line-through}
.opt.soopt{color:var(--t3)}
.blk.so{border-style:dashed}
.okmsg{color:var(--t3)}
.warnmsg{color:var(--wn);font-weight:500}

.tabs{display:flex;gap:6px;margin-bottom:.8rem;border-bottom:0;overflow-x:auto;padding-bottom:2px}
.tb{font-weight:500;font-size:13px;padding:7px 13px}
.iss{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;margin-bottom:.9rem}
.issrow{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:12.5px;flex-wrap:wrap}
.issrow+.issrow{border-top:1px solid var(--border);padding-top:5px;margin-top:2px}
.isslab{font-weight:600;white-space:nowrap;flex-shrink:0}
.isslab.bad{color:var(--dg)}.isslab.wn{color:var(--wn)}.isslab.ok{color:var(--t2)}
.issnames{color:var(--t2);display:flex;gap:5px;flex-wrap:wrap}
.fbtn{background:none;border:0;border-bottom:1px dotted var(--bs);color:var(--tx);font-size:12.5px;font-family:inherit;padding:0;cursor:pointer;text-align:left}
.fbtn:hover{border-bottom-color:var(--ac);color:var(--ac)}
.issclean{font-size:12.5px;color:var(--t2)}

@media (max-width:600px){
 .gcol{flex:0 0 112px}
 .ghead{font-size:10px}
 .wrap{padding:1rem .7rem 3rem}
 .tb{padding:7px 11px;font-size:12.5px}
}

.blk.gh{border-style:dotted;opacity:.6}
.fc.gh{opacity:.55;border-style:dashed}

.daynav{flex-wrap:nowrap;margin-bottom:6px}
.daynav select{flex:1;min-width:0}
.pill.nav{flex:0 0 auto;width:38px;padding:6px 0;text-align:center;font-size:16px;line-height:1}
.pill.nav:disabled{opacity:.35;cursor:default}
.scopes{margin-bottom:.9rem}
@media (max-width:600px){ .scopes .pill{flex:1;min-width:0;text-align:center} }

#shareLink{font-size:11.5px;font-family:ui-monospace,Menlo,monospace}

#planbar{gap:6px}
#planbar select{flex:1;min-width:120px}
#planbar .pill{padding:6px 10px;font-size:12px}
.planwho{font-size:11.5px;color:var(--t2);width:100%}
.planwho b{color:var(--tx)}

#tip{position:fixed;z-index:50;max-width:320px;background:var(--card);color:var(--tx);
 border:1px solid var(--bs);border-radius:var(--r);padding:9px 11px;font-size:12.5px;line-height:1.45;
 box-shadow:0 6px 20px rgba(0,0,0,.28);pointer-events:none}
#tip[hidden]{display:none}
#tip .tn{font-weight:600;font-size:13px;display:block}
#tip .tm2{color:var(--t2);font-size:11.5px;display:block;margin-top:1px}
#tip .td{margin-top:6px;display:block}
#tip .tw{display:block;margin-top:5px;font-weight:600;font-size:11.5px}
#tip .tw.bad{color:var(--dg)}#tip .tw.wn{color:var(--wn)}#tip .tw.ok{color:var(--t2)}

.filters{margin-top:-4px}
.filters select{flex:1;min-width:130px}
@media (max-width:600px){ .filters select{min-width:0;flex:1 1 44%} }

.tick{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.row.bt{border-color:var(--ok)}
.sbtn.tk,.ob.tk{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.blk.bt{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.blk.bt b{text-decoration:none}
#tip .tw.okg{color:var(--ok)}

.ordn{display:inline-block;min-width:26px;font-size:10.5px;font-weight:600;color:var(--t2);
 background:var(--card2);border:1px solid var(--border);border-radius:4px;padding:0 4px;text-align:center;margin-right:2px}

.fc.soon{border-color:var(--wn2)}
.fs.soon{color:var(--wn2)}
.sbtn.tk,.ob.tk{background:var(--tkbg);border-color:var(--tkbg);color:var(--tktx);font-weight:600}
.tick{background:var(--tkbg);border-color:var(--tkbg);color:var(--tktx)}

.cc{font-size:11.5px;color:var(--t2);line-height:1.4}
.fn{font-size:15.5px;font-weight:650;letter-spacing:-.01em;color:var(--tx)}
.fc .fn{margin:0 0 1px}
.isslab{margin-right:2px}

.buy{font-size:10.5px;font-weight:600;color:var(--ac);text-decoration:none;border-bottom:1px solid var(--ac);margin-left:4px}

.avl{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
 border-radius:4px;padding:0 5px;margin-left:7px;vertical-align:2px;white-space:nowrap}
.avl.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.avl.bad{background:var(--dgb);color:var(--dg);border:1px solid var(--dg)}
textarea{width:100%;min-height:70px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="wrap">
 <h1 id="fest"></h1>
 <p class="sub" id="sub"></p>

 <div class="presetbar" id="planbar"></div>
 <div class="presetbar">
  <button class="pill" id="shareBtn">Share / import a plan</button>
  <span id="storeMsg" style="font-size:11.5px;width:100%"></span>
 </div>
 <div id="shareBox" style="display:none"></div>

 <div class="tabs">
  <button class="pill tb" data-v="cat">1. Choose films</button>
  <button class="pill tb active" data-v="film">2. Choose times</button>
  <button class="pill tb" data-v="grid">Timetable grid</button>
  <button class="pill tb" data-v="mine">My schedule</button>
 </div>

 <div id="info"></div>
 <div id="stats" class="stats"></div>
 <div id="issues"></div>
 <div id="body"></div>
 <p class="note" id="foot"></p>
</div>
<div id="tip" hidden></div>

 to her moral limits when she is recruited to rebrand a company’s image, compromising people for profit to serve her corporate supervisors.","d":"Stéphane Brizé","g":"Drama","t":"Special Presentations","k":["Drama"],"c":["France"],"l":["French","Italian"]},"A Long Winter":{"x":"After his mother disappears during the first blizzard of the season, a young man refuses to give up hope as one long Colorado winter reshapes his relationship with his father and his understanding of the man he is becoming. From Andrew Haigh, the acclaimed director of All of Us Strangers .","d":"Andrew Haigh","g":"2SLGBTQ+, Adaptation, Drama","t":"Special Presentations","k":["2SLGBTQ+","Adaptation","Coming of Age","Drama"],"c":["Canada","United Kingdom"],"l":["English"]},"A Talent for Murder":{"x":"This smouldering chamber thriller from Anton Corbijn ( Control ) stars Oscar winner Helen Mirren and Alden Ehrenreich ( Fair Play ) as opponents in a strange confrontation between a youthful literary agent and The Talented Mr. Ripley author Patricia Highsmith.","d":"Anton Corbijn","g":"Adaptation, Biography + History, Crime","t":"Gala Presentations","k":["Adaptation","Biography + History","Crime","Drama","Mystery + Thriller"],"c":["United Kingdom","Italy"],"l":["English"]},"After Elena":{"x":"When a family's matriarch dies, four relatives are forced to confront decades of silence, resentment, and buried affection. Led by Alfredo Castro, this sharp ensemble balances humour and melancholy in a moving portrait of grief and reconciliation.","d":"Shawn Garry","g":"Drama, Comedy, Latin American Cultures","t":"Centrepiece","k":["Comedy","Drama","Latin American Cultures"],"c":["Chile","Colombia","Italy"],"l":["Spanish"]},"Ah Girl":{"x":"Winner of the Youth Jury Award at the 55th International Film Festival Rotterdam, Ang Geck Geck Priscilla’s feature debut is a bittersweet yet heartwarming story of a young girl as she tries to figure out what it means to become an adult.","d":"Ang Geck Geck Priscilla","g":"Drama, Directed by Women, First Feature","t":"Centrepiece","k":["Coming of Age","Directed by Women","Drama","Family Friendly","First Feature"],"c":["Singapore"],"l":["Chinese","English"],"t2":["TIFF Next Wave Selects"]},"Alice: Pioneer of Cinema":{"x":"Amidst the advent of modern cinema, trailblazing artist Alice Guy becomes the first woman film director in this lush historical series starring Academy Award–nominee Bérénice Bejo ( The Artist ).","d":"Virginie Verrier, Guillaume Lonergan","g":"Films About Film, Biography + History, Drama","t":"Primetime","k":["Biography + History","Canadian","Drama","Films About Film"],"c":["France","Canada"],"l":["French","English"]},"All About Corinne":{"x":"Paris Follies writer-director Marc Fitoussi re-teams with the inimitable, Oscar-nominated Isabelle Huppert (TIFF ’16’s Elle ) for this delectable comedy about a veteran background actor who spies a belated chance to break into the fickle family of le cinéma français .","d":"Marc Fitoussi","g":"Comedy, Drama","t":"Gala Presentations","k":["Comedy","Drama"],"c":["France"],"l":["French"]},"All That She Wants":{"x":"Annie Murphy ( Schitt’s Creek ) stars in this effervescent, tender-hearted, refreshingly modern rom-com that chronicles a casual encounter between a millennial and a Gen Zer — and the life-altering consequences that result.","d":"Scarlett Bermingham, Andrew Rhymer","g":"Comedy, Romance, Canadian","t":"Special Presentations","k":["Canadian","Comedy","Romance"],"c":["United States of America","Canada"],"l":["English"]},"All of a Sudden":{"x":"Ryûsuke Hamaguchi brings Virginie Efira and Tao Okamoto together in a poignant drama about friendship, illness, art, and the responsibilities of care, creating a film that makes the world seem gentler, more open, and more humane.","d":"Ryûsuke Hamaguchi","g":"Asian Cultures, Drama","t":"Special Presentations","k":["Asian Cultures","Drama"],"c":["France","Japan","Germany","Belgium"],"l":["French","Japanese"]},"Alpha Gang":{"x":"Léa Seydoux, Dave Bautista, Lily-Rose Depp, and Cate Blanchett star in the Zellner brothers’ look at an alien gang coming to Earth to conquer, but finding the human world has a plague they weren’t ready for.","d":"David Zellner, Nathan Zellner","g":"Cult, Science Fiction + Fantasy, Comedy","t":"Special Presentations","k":["Comedy","Cult","Music","Science Fiction + Fantasy","War"],"c":["United States of America"],"l":["English"]},"Always Lalisa":{"x":"K-pop idol–turned–global superstar Lisa stars in this intimate and transformative documentary tracing her journey from childhood ambition through BLACKPINK stardom into the artist she is today.","d":"Sue Kim","g":"Asian Cultures, Documentary, Music","t":"Gala Presentations","k":["Asian Cultures","Directed by Women","Documentary","Family Friendly","Music"],"c":["United States of America"],"l":["English","Thai","Korean"]},"American Hostage":{"x":"Jon Hamm stars in this adaptation of the hit podcast, which tells the true story of an Indianapolis radio reporter thrust into a high-stakes situation when a local man takes a bank employee hostage and demands to be interviewed live on air.","d":"Adam Arkin","g":"Biography + History, Crime, Drama","t":"Primetime","k":["Adaptation","Biography + History","Crime","Drama"],"c":["United States of America"],"l":["English"]},"Ancestors":{"x":"A haunting journey set in 1980s London, David Turpin’s mesmerizing debut transforms one young man’s search for a missing friend into an unforgettable story of love, loss, and gay legacy.","d":"David Turpin","g":"2SLGBTQ+, Drama, First Feature","t":"Discovery","k":["2SLGBTQ+","Drama","First Feature","Mystery + Thriller"],"c":["Ireland","United Kingdom"],"l":["English"]},"Anchors Aweigh":{"x":"After a thwarted marriage proposal, alt-comedian Matt Barats spirals into an existential crisis in this semi-autobiographical blend of deadpan absurdism and unexpected poignancy told in a first-person, confessional style à la Ross McElwee or John Wilson.","d":"Matt Barats","g":"Comedy, Cult, Romance","t":"Midnight Madness","k":["Comedy","Cult","Documentary","Films About Film","Romance"],"c":["United States of America"],"l":["English"]},"Angh":{"x":"In a deserted Nagaland village in the early 1960s, a chief must choose between his family and a transforming world embodied by an incoming American missionary in filmmaker Theja Rio’s gripping feature-length adaptation of his award-winning 2021 short.","d":"Theja Rio","g":"Aboriginal + Indigenous, Biography + History, Drama","t":"Platform","k":["Aboriginal + Indigenous","Biography + History","Drama","First Feature"],"c":["India"],"l":["Konyak"]},"Arne Goes to Space":{"x":"An extraterrestrial visitor upends the lives of two elderly brothers in northern Sweden in Lars Vega’s disarming blend of sci-fi fable and small-town comedy.","d":"Lars Vega","g":"Comedy, Science Fiction + Fantasy, First Feature","t":"Discovery","k":["Comedy","Cult","First Feature","Science Fiction + Fantasy"],"c":["Sweden"],"l":["Swedish"],"t2":["Unhidden Gems presented by Redbreast"]},"Arrested Memory":{"x":"A seasoned detective (Ethan Juan) recently diagnosed with dementia is doggedly pursued by both cops and crooks after he unwittingly wanders off with a multimillion-dollar ransom in a new absurdist crime caper from cult auteur SABU.","d":"SABU","g":"Crime, Comedy, Action + Adventure","t":"Midnight Madness","k":["Action + Adventure","Comedy","Crime","Romance"],"c":["Taiwan","Japan"],"l":["Mandarin","Taiwanese","Japanese"]},"Ashes":{"x":"Diego Luna crafts a powerful and deeply humane portrait of the immigrant experience through the eyes of a young woman forced to rebuild her life in a new country, delivering a nuanced exploration of family, identity, belonging, and displacement.","d":"Diego Luna","g":"Drama, Latin American Cultures, Adaptation","t":"Centrepiece","k":["Adaptation","Drama","Latin American Cultures"],"c":["Mexico","Spain"],"l":["Catalan","English","Spanish"]},"At Night":{"x":"Mesmerizing and melancholic, the much-anticipated debut feature by British filmmaker and artist Beatrice Gibson is a work of choral autofiction that shifts from narrative to documentary to dream over a single night in Paris, reflecting on the nature of womanhood, privilege, and solidarity.","d":"Beatrice Gibson","g":"First Feature, Experimental + Avant-Garde, Directed by Women","t":"Wavelengths","k":["2SLGBTQ+","Directed by Women","Experimental + Avant-Garde","First Feature"],"c":["United Kingdom","France"],"l":["English","French","Bambara","Tibetan"]},"Atonement":{"x":"Boyd Holbrook ( The Bikeriders ), Hiam Abbass (TIFF ’25’s Palestine 36 ), and Oscar winner Kenneth Branagh star in Oscar-nominated writer-director Reed Van Dyk’s searing story of trauma and forgiveness following a horrifying event during the Iraq War.","d":"Reed Van Dyk","g":"Drama, War, Middle Eastern Cultures","t":"Gala Presentations","k":["Biography + History","Drama","Middle Eastern Cultures","War"],"c":["United States of America"],"l":["English","Arabic"]},"Ba's Book":{"x":"In a hybrid documentary retelling, documentary filmmaker Ashley Duong takes her father’s memoir and stages a recreation of it in Vietnam alongside her family.","d":"Ashley Duong","g":"Asian Cultures, Biography + History, Directed by Women","t":"TIFF Docs","k":["Asian Cultures","Biography + History","Canadian","Directed by Women","Documentary","Films About Film"],"c":["Canada"],"l":["Vietnamese","English"]},"Babies":{"x":"Seth Rogen and Oscar nominee Anna Kendrick (TIFF ’09’s Up in the Air ) star in Lauren Miller Rogen’s big-hearted comedy about the dilemma that eventually infiltrates every long-term relationship: to parent or not to parent?","d":"Lauren Miller Rogen","g":"Comedy, Drama, Directed by Women","t":"Gala Presentations","k":["Comedy","Directed by Women","Drama","Romance"],"c":["United States of America"],"l":["English"]},"Back in Black":{"x":"Christopher Walken leads a terrific cast in director Ron Murphy’s hilarious satire about a failing family funeral home that experiences a reversal of fortune thanks to their town’s suspicious spike in fatality rates.","d":"Ron Murphy","g":"Comedy, Crime, Canadian","t":"Centrepiece","k":["Canadian","Comedy","Crime"],"c":["Canada"],"l":["English"]},"Bad Lieutenant: Tokyo":{"x":"The latest from prolific maestro Takashi Miike, like Abel Ferrara’s Bad Lieutenant (TIFF ’92) and Werner Herzog’s Bad Lieutenant: Port of Call — New Orleans (TIFF ’09), is a sensational ride through the darkest crevasses of the criminal underworld.","d":"Takashi Miike","g":"Action + Adventure, Mystery + Thriller","t":"Special Presentations","k":["Action + Adventure","Mystery + Thriller"],"c":["United States of America","Japan"],"l":["English","Japanese"]},"Bedford Park":{"x":"Writer-director Stephanie Ahn’s feature debut explores the complexities of diasporic experience through a chance encounter between two thirtysomething, second-generation Korean Americans, tracking their relationship as it moves from circumstantial to friendly to romantic.","d":"Stephanie Ahn","g":"Drama, Directed by Women, First Feature","t":"Discovery","k":["Asian Cultures","Directed by Women","Drama","First Feature","Romance"],"c":["United States of America"],"l":["English","Korean"]},"Being Heumann":{"x":"Featuring a breakout performance by Ruth Madeley and Oscar nominee Mark Ruffalo (TIFF ’15’s Spotlight ), this inspiring historical drama from Oscar-winning filmmaker Siân Heder ( CODA ) celebrates the paradigm-shifting activist Judy Heumann, “Mother of the Disability Rights Movement.”","d":"Siân Heder","g":"Biography + History, Drama, Directed by Women","t":"Gala Presentations","k":["Biography + History","Directed by Women","Drama"],"c":["United States of America"],"l":["English"]},"Below":{"x":"Something monstrous lurks off the coast in this suspenseful, Newfoundland-set limited series, starring Josh Hartnett ( Trap ) and Mackenzie Davis ( Station Eleven ).","d":"Jamie Childs","g":"Horror, Mystery + Thriller, Canadian","t":"Primetime","k":["Canadian","Horror","Mystery + Thriller"],"c":["Canada"],"l":["English"]},"Ben'Imana":{"x":"In this powerful, feminist debut feature, which won the Caméra d’Or at the 2026 Cannes Film Festival, Marie-Clémentine Dusabejambo brilliantly explores the issue of forgiveness in the wake of the Tutsi genocide in Rwanda.","d":"Marie-Clémentine Dusabejambo","g":"Directed by Women, Black + African Diaspora, First Feature","t":"Centrepiece","k":["Black + African Diaspora","Directed by Women","Drama","First Feature"],"c":["Rwanda","Gabon","France","Norway"],"l":["Kinyarwanda"]},"Bitter Christmas":{"x":"With noirish hues and telenovela twists, the latest from Oscar-winning maestro Pedro Almodóvar (TIFF ’24’s The Room Next Door ) follows a pair of self-centred film directors exploring grief, love, and the perils of unchecked artistic license.","d":"Pedro Almodóvar","g":"Drama, Comedy, Films About Film","t":"Special Presentations","k":["2SLGBTQ+","Comedy","Drama","Films About Film"],"c":["Spain"],"l":["Spanish"]},"Black Sunflowers":{"x":"Black Sunflowers is a mosaic of Ukrainian youth, shuttling between the frontlines and civilian life, captured by the gifted American filmmaker James Marcus Haney ( No Cameras Allowed ) collaborating with an esteemed Ukrainian crew.","d":"James Marcus Haney","g":"Documentary, War, Music","t":"TIFF Docs","k":["Documentary","Music","War"],"c":["Ukraine","United States of America"],"l":["Ukrainian","Russian","English"]},"Bleeding Hearts":{"x":"This real-life love story follows the charismatic musicians Zella Day and Jesse Woods as they team to create the alt-country band Chaparelle with collaborator Beau Bedford, in a documentary with as much drama as a season of Nashville .","d":"Andrew Morgan","g":"Documentary, Music, Romance","t":"TIFF Docs","k":["Documentary","Music","Romance"],"c":["United States of America"],"l":["English"]},"Blindspot Berlin":{"x":"This gripping thriller depicts the investigation — and its shortfalls arless cowgirls who compete at riding wild broncos on the rodeo circuit after nearly a century of being excluded because of their gender.","d":"Taimi Arvidson","g":"Documentary, Directed by Women, Sports","t":"TIFF Docs","k":["Directed by Women","Documentary","Sports","Western"],"c":["United States of America"],"l":["English"],"t2":["Unhidden Gems presented by Redbreast"]},"Children Untold":{"x":"Acclaimed filmmaker and author Miwa Nishikawa adapts her forthcoming novel into a compassionate and clear-eyed postwar drama about a 12-year-old orphan who disguises herself as a boy, featuring a striking performance by newcomer Ami Koyae and a memorable supporting turn by Koji Yakusho.","d":"Miwa Nishikawa","g":"War, Directed by Women, Drama","t":"Platform","k":["Coming of Age","Directed by Women","Drama","War"],"c":["Japan"],"l":["Japanese"]},"City Lights":{"x":"","d":"Charlie Chaplin","g":"Romance, Comedy, Drama","t":"Festival Street","k":["Comedy","Drama","Romance"],"c":["United States of America"],"l":["Silent"]},"Clarissa":{"x":"Led by a stellar cast including Sophie Okonedo and David Oyelowo, filmmaking brothers Arie and Chuko Esiri’s second feature is a beguiling adaptation of Virginia Woolf’s Mrs. Dalloway set in contemporary Lagos.","d":"Arie Esiri, Chuko Esiri","g":"Black + African Diaspora, Adaptation, Romance","t":"Special Presentations","k":["Adaptation","Black + African Diaspora","Drama","Romance"],"c":["Nigeria","United States of America"],"l":["English","Nigerian Pidgin"]},"Closing Night":{"x":"Naomi Watts, Sarah Paulson, and Odessa A’zion deliver powerhouse performances in Cody Fern’s sensational feature debut, where a hardened movie star reunites with the deliciously messy family she left behind decades earlier.","d":"Cody Fern","g":"Drama, First Feature, Comedy","t":"Special Presentations","k":["Canadian","Comedy","Drama","First Feature"],"c":["Australia","Canada"],"l":["English"]},"Club Kid":{"x":"In his exuberant debut feature, writer-director Jordan F ":["Iran","Germany"],"l":["Persian"]},"Hombre al agua":{"x":"The latest directorial feature from Gael García Bernal (TIFF ’19’s Chicuarotes ) is a psychologically astute comedy of manners for the modern age, following an ensemble of eclectic characters seeking to become something more than who they are.","d":"Gael García Bernal","g":"Drama, Films About Film, Latin American Cultures","t":"Special Presentations","k":["Drama","Films About Film","Latin American Cultures"],"c":["Mexico"],"l":["Spanish","Portuguese"]},"Hoosiers":{"x":"","d":"David Anspaugh","g":"Sports, Drama","t":"Festival Street","k":["Drama","Sports"],"c":["United States of America"],"l":["English"]},"Hope":{"x":"In this madcap marvel from Na Hong-jin ( The Chaser , The Wailing ), a police chief (Hwang Jung-min) and deputy (Hoyeon) investigate a monstrous incursion upon their remote village, as a headstrong local (Zo In-sung) musters a hunting party to root out the threat.","d":"Na Hong-jin","g":"Mystery + Thriller, Science Fiction + Fantasy, Action + Adventure","t":"Special Events","k":["Action + Adventure","Horror","Mystery + Thriller","Science Fiction + Fantasy"],"c":["South Korea"],"l":["Korean"]},"How We Stand":{"x":"How We Stand combines magical realism, a story of sisters separated by tragedy, and a cast of rising Indigenous talent. Starring Amber Midthunder, Alyssa Wapanatâhk, Isabel DeRoy-Olson, and Cara Jade Myers.","d":"Marie Clements","g":"Drama, Aboriginal + Indigenous, Directed by Women","t":"Centrepiece","k":["Aboriginal + Indigenous","Adaptation","Biography + History","Directed by Women","Drama"],"c":["Canada"],"l":["English"]},"I Am Mario":{"x":"A transgender taxi driver’s dream of fatherhood becomes a reality when he gets pregnant, forcing him to confront his own notions of masculinity while navigating unexpected social, moral, and emotional consequences.","d":"Sharon Kleinberg","g":"2SLGBTQ+, Drama, Directed by Women","t":"Discovery","k":["2SLGBTQ+","Directed by Women","Drama","First  eight projects here. Press & Market Pass Holders: First-come, first-served access. Open Thursday, Sept. 10 – Monday, Sept. 14, 9:00 AM – 6:00 PM. Public Access: Public Tickets available to be purchased for Tuesday, Sept. 15 - Wednesday, Sept. 16.","d":"","g":"","t":"Summit","k":[],"c":[],"l":[]},"Intermission":{"x":"Yonfan transforms excerpts from his 15 films into a brilliant, genre-defying meditation on cinema, memory, beauty, desire, and his own singular body of work, featuring Maggie Cheung, Chow Yun-fat, Sylvia Chang, Shu Qi, Daniel Wu, and many, many more.","d":"Yonfan","g":"Experimental + Avant-Garde, Biography + History, Films About Film","t":"Centrepiece","k":["2SLGBTQ+","Biography + History","Experimental + Avant-Garde","Films About Film"],"c":["Hong Kong"],"l":["Chinese","English","Japanese"]},"Iron Boy":{"x":"Winner of the Special Jury Prize at Cannes last spring, Pixar animator Louis Clichy’s gorgeous hand-painted animation tells the story of a boy in need of a back brace who seeks the courage to stand alone.","d":"Louis Clichy","g":"Animation, Coming of Age, Drama","t":"Centrepiece","k":["Animation","Coming of Age","Drama","Family Friendly"],"c":["France","Belgium"],"l":["French"]},"It Will Happen Tonight":{"x":"Louis Garrel (TIFF ’25’s Couture ) leads a charming ensemble in this decades-spanning divine dramady from Nanni Moretti (TIFF ’01’s The Son’s Room ) that will restore your faith in destiny and the wild logic of the heart.","d":"Nanni Moretti","g":"Drama, Romance, Comedy","t":"Special Presentations","k":["Comedy","Drama","Romance"],"c":["Italy","France","Spain"],"l":["Italian","English","Spanish"]},"It's My Time":{"x":"Led by Oscar winner Michelle Yeoh ( Everything Everywhere All at Once ), this inspired comedy about a woman on the road to magic-cube mastery is a story of galvanizing gamesmanship and ageless defiance.","d":"Bai Xue","g":"Asian Cultures, Comedy, Drama","t":"Gala Presentations","k":["Asian Cultures","Comedy","Drama","Sports"],"c":["China"],"l":["Mandarin","Cantonese"]},"Josephine":{"x":"After witnessing an event, a young girl is haunted by the trauma of the disturbing incident, opening her eyes to the violence that surrounds her.","d":"Beth de Araújo","g":"Crime, Drama, Mystery + Thriller","t":"Special Presentations","k":["Crime","Drama","Mystery + Thriller"],"c":["United States of America"],"l":["English"]},"Julián":{"x":"From the acclaimed studio behind Wolfwalkers and Song of the Sea comes a joyful adaptation of Jessica Love’s beloved children’s book about a young boy whose dream of becoming a mermaid transforms both his summer and his relationship with his grandmother.","d":"Louise Bagnall","g":"Animation, Adaptation, Family Friendly","t":"Centrepiece","k":["Adaptation","Animation","Canadian","Family Friendly","First Feature","Latin American Cultures"],"c":["Luxembourg","Ireland","Canada","Denmark"],"l":["English","Spanish"]},"Ken Russell's The Devils":{"x":"North American Premiere of 4K restoration!","d":"Ken Russell","g":"Drama, Horror","t":"TIFF Classics","k":["Drama","Horror"],"c":["United Kingdom"],"l":["English"]},"Kick On":{"x":"Looking to prolong their night of partying, four youths are plunged into paranoid pandemonium after crossing a mobster’s volatile son in Nick Kozakis’ bloody ripper of a siege thriller.","d":"Nick Kozakis","g":"Action + Adventure, Horror, Crime","t":"Midnight Madness","k":["Action + Adventure","Crime","Horror"],"c":["Australia"],"l":["English"]},"Kissed":{"x":"World Premiere of 4K restoration! Initially a controversial outlier, Lynne Stopkewich’s singular debut Kissed (TIFF ’96) is a subversive, tender drama about sexual awakening that shares the same ethereal atmosphere as erotic Canadian classics David Cronenberg’s Crash (1996) and Atom Egoyan’s Exotica (1994).","d":"Lynne Stopkewich","g":"Drama, Directed by Women, Romance","t":"TIFF Classics","k":["Canadian","Directed by Women","Drama","Romance"],"c":["Canada"],"l":["English"]},"Krux":{"x":"The feature ":"Midnight Madness","k":["Biography + History","Canadian","Comedy","Documentary","Experimental + Avant-Garde"],"c":["Canada"],"l":["English","French"]},"Le Faux Soir":{"x":"Inspired by a fact-based act of subversive irreverence in Nazi-occupied Brussels, Michaël R. Roskam’s thriller delivers a historical drama that feels more like a heist movie.","d":"Michaël R. Roskam","g":"Drama, Mystery + Thriller, War","t":"Special Presentations","k":["Biography + History","Drama","Mystery + Thriller","War"],"c":["Belgium","France"],"l":["French"]},"Lemonade":{"x":"Lewis Brophy delivers a breakout performance in Kim Bartley’s compassionate debut drama about Irish teen, forced to leave foster care on his 18th birthday, who must find his way in a world that suddenly expects him to be a man.","d":"Kim Bartley","g":"Coming of Age, Directed by Women, Drama","t":"Centrepiece","k":["Coming of Age","Directed by Women","Drama"],"c":["Ireland","United Kingdom"],"l":["English"]},"Life of Jorge Luis Borges":{"x":"With the erudition and insight of a literary scholar and the gumption of an amateur detective, Argentinian auteur (and raconteur) Mariano Llinás ( La Flor , TIFF ’18) explores the life and fiction of the legendary writer Jorge Luis Borges through objects and places.","d":"Mariano Llinás","g":"Documentary, Latin American Cultures, Experimental + Avant-Garde","t":"Wavelengths","k":["Biography + History","Documentary","Experimental + Avant-Garde","Latin American Cultures"],"c":["Argentina"],"l":["Spanish"]},"Light Pillar":{"x":"A lonely caretaker, a dying film studio, and a seductive virtual world collide in Xu Zao’s formally daring animated debut feature: a melancholic, visionary parable about cinema, technology, alienation, and the fragile promise of renewal.","d":"Xu Zao","g":"Animation, Experimental + Avant-Garde, Science Fiction + Fantasy","t":"Centrepiece","k":["Animation","Experimental + Avant-Garde","Science Fiction + Fantasy"],"c":["China"],"l":["Chinese"]},"Like Magic":{"x":"Blending archival footage, personal testimony, and a decades-long search for answers, Melissa Saavedra Gil transforms a childhood tragedy into a powerful exploration of memory, truth, and healing. An intimate and deeply resonant debut that illuminates both a personal story and a generation shaped by violence.","d":"Melissa Saavedra Gil","g":"Documentary, Directed by Women, First Feature","t":"TIFF Docs","k":["Directed by Women","Documentary","First Feature","Latin American Cultures"],"c":["Colombia","Argentina","Uruguay"],"l":["Spanish"]},"London":{"x":"An experimental yet tender road movie about an enigmatic man’s shared commutes across Austria’s scenic West Autobahn — shot in-studio with vintage rear-projection techniques — Sebastian Brameshuber’s award-winning London is a rare work of technical prowess that never belies its emotional core.","d":"Sebastian Brameshuber","g":"Drama, Experimental + Avant-Garde, First Feature","t":"Wavelengths","k":["Drama","Experimental + Avant-Garde","First Feature"],"c":["Austria"],"l":["German","English","Romanian"],"t2":["Unhidden Gems presented by Redbreast"]},"Long Long Night":{"x":"This deeply moving debut from Kyu Bock Youm is a radiantly detailed animation chronicling the peripatetic lives of a rhino and a penguin as they traverse a vast, ever-changing wilderness brimming with natural beauty and human-generated danger.","d":"Kyu Bock Youm","g":"Animation, Adaptation","t":"Centrepiece","k":["Adaptation","Animation"],"c":["South Korea"],"l":["Korean"]},"Look Back":{"x":"Visionary auteur Hirokazu Kore-eda helms this tender and slow-burning adaptation of manga creator Tatsuki Fujimoto’s acclaimed story, following two young artists whose friendship and bond become the engine of their art.","d":"Hirokazu Kore-eda","g":"Adaptation, Asian Cultures, Coming of Age","t":"Special Presentations","k":["Adaptation","Animation","Asian Cultures","Coming of Age","Drama"],"c":["Japan"],"l":["Japanese"]},"Love is the monster":{"x":"In a chilling dystopian thriller shaped by fear and inequality, Neto Villalobos Brenes follows a grandmother, powerfully portrayed by Paulina García, whose granddaughter becomes the centre of a devastating turn of events that forces her into impossible moral choices.","d":"Neto Villalobos Brenes","g":"Mystery + Thriller, Drama, Latin American Cultures","t":"Centrepiece","k":["Drama","Latin American Cultures","Mystery + Thriller"],"c":["Costa Rica","Peru","Panama","Chile","Mexico"],"l":["Spanish"]},"Love of Your Life":{"x":"Featuring a beautifully understated performance from Margaret Qualley (TIFF ’24’s The Substance ), this sweeping romantic character study from director Rachel Morrison (TIFF ’24’s The Fire Inside ) is an exhilarating testament to loving fully, making amends, and moving on.","d":"Rachel Morrison","g":"Coming of Age, Drama, Romance","t":"Special Presentations","k":["Coming of Age","Directed by Women","Drama","Romance"],"c":["United States of America"],"l":["English"]},"Low Lies The Land":{"x":"Set in the breathtaking landscapes of Piemonte in Northern Italy, Low Lies the Land immerses us in the lives of three winemaking families facing an uncertain future.","d":"Emanuele Gerosa","g":"Documentary, Environment + Sustainability","t":"TIFF Docs","k":["Documentary","Environment + Sustainability"],"c":["Denmark","Italy"],"l":["Italian"]},"Madagascar":{"x":"","d":"Eric Darnell, Tom McGrath","g":"Animation, Comedy, Family Friendly","t":"Festival Street","k":["Animation","Comedy","Family Friendly"],"c":["United States of America"],"l":["English"]},"Magazine":{"x":"Set in New York’s cliquish literary scene, writer-director Alexandra Pechman’s feature debut chronicles the sentimental education of an aspiring poet (Lily McInerny, TIFF ’24’s Bonjour Tristesse ) who becomes tangled in a web of eros, cultural gatekeeping, and office intrigue.","d":"Alexandra Pechman","g":"Drama, Comedy, Romance","t":"Discovery","k":["Comedy","Coming of Age","Directed by Women","Drama","First Feature","Romance"],"c":["United States of America"],"l":["English"]},"Making Waves With... Hudson Williams":{"x":"","d":"","g":"","t":"In Conversation With...","k":[],"c":[],"l":[],"t2":["TIFF Next Wave Selects"]},"Man in Motion: The Rick Hansen Story":{"x":"This galvanizing portrait celebrates Rick Hansen, the great Canadian athlete and activist. It chronicles his 26-month Man In Motion World Tour: a 40,000-kilometre wheelchair journey that raised millions to eliminate accessibility barriers and transform public perception of people with disabilities.","d":"Adrian Buitenhuis","g":"Documentary, Biography + History, Sports","t":"Gala Presentations","k":["Biography + History","Canadian","Documentary","Sports"],"c":["Canada"],"l":["English"]},"Marie Madeleine":{"x":"Géssica Généus directs and stars in this vibrant reimagining of the biblical tale of Mary Magdalene, following a free-spirited Haitian sex worker whose serendipitous involvement with a repressed preacher’s son opens each to possibilities.","d":"Géssica Généus","g":"Directed by Women, Drama, Black + African Diaspora","t":"Centrepiece","k":["Black + African Diaspora","Directed by Women","Drama"],"c":["France","Haiti","Belgium","Canada","Luxembourg"],"l":["Haitian","French"]},"Masc":{"x":"This debut feature from London-based artist Bertil Nilsson is a tender, unflinching portrait of self-performance, identity, and the quiet but persistent work of learning to exist as oneself in an often prescriptive world.","d":"Bertil Nilsson","g":"2SLGBTQ+, Drama, First Feature","t":"Platform","k":["2SLGBTQ+","Drama","First Feature"],"c":["United Kingdom"],"l":["English"],"t2":["TIFF Next Wave Selects"]},"Memories of a Forest":{"x":"Katharina Rabl’s stunning debut feature toggles between loyalty and longing for independence, centring a doctoral student who must choose between carrying on her family’s legacy or forging her own path.","d":"Katharina Rabl","g":"Drama, Directed by Women, First Feature","t":"Discovery","k":["Coming of Age","Directed by Women","Drama","Environment + Sustainability","First Feature"],"c":["Germany","Austria"],"l":["German"]},"Minotaur":{"x":"After a nine-year hiatus, during which he fled his native Russia into exile, Andrey Zvyagintsev ( The Return , TIFF ’03, Leviathan , TIFF ’14) returns with a reworking of Claude Chabrol's La femme infidèle , adapted to his homeland's current rhetoric of patriarchy and warmongering.","d":"Andrey Zvyagintsev","g":"Drama, Crime, Adaptation","t":"Special Presentations","k":["Adaptation","Crime","Drama","War"],"c":["France","Germany","Latvia"],"l":["Russian"]},"Misty Green":{"x":"Featuring a career-making performance from Slow Horses ’ Rosalind Eleazar and supporting turns from Daniel Kaluuya, Adam Driver, and Anna Kendrick, Chris Rock’s latest as writer-director brilliantly satirizes the bigotry and hustle at the heart of Hollywood.","d":"Chris Rock","g":"Drama, Films About Film, Romance","t":"Gala Presentations","k":["Black + African Diaspora","Comedy","Drama","Films About Film","Romance"],"c":["United States of America"],"l":["English"]},"Mr. Nelson, Did You Kill People?":{"x":"Cult Japanese filmmaker Shinya Tsukamoto directs acclaimed Broadway actor Rodney Hicks and Oscar winner Geoffrey Rush in a harrowing, visceral, and morally urgent portrait of Vietnam veteran Allen Nelson.","d":"Shinya Tsukamoto","g":"War, Drama, Adaptation","t":"Special Presentations","k":["Adaptation","Drama","War"],"c":["Japan"],"l":["English","Vietnamese"]},"Musk":{"x":"The Oscar-winning documentarian Alex Gibney delivers his most ambitious and epic work in exploring the history of the world’s richest man, Elon Musk.","d":"Alex Gibney","g":"Documentary, Biography + History","t":"TIFF Docs","k":["Biography + History","Documentary"],"c":["United States of America"],"l":["English"]},"Muyi":{"x":"A teenager undertakes a fantastic journey in order to save her mountaintop village where men are forbidden, in Julien Chheng’s charming and magical animated feature.","d":"Julien Chheng","g":"Animation, Science Fiction + Fantasy, Asian Cultures","t":"Centrepiece","k":["Animation","Asian Cultures","First Feature","Science Fiction + Fantasy"],"c":["France"],"l":["French"]},"My Wife Cries":{"x":"With My Wife Cries — a startling, minimalist study in romantic misalignment — German auteur and Festival favourite Angela Schanelec employs her singular style to portray the crushing anguish and vertiginous confusion brought forth by marital crisis.","d":"Angela Schanelec","g":"Drama, Directed by Women, Experimental + Avant-Garde","t":"Wavelengths","k":["Directed by Women","Drama","Experimental + Avant-Garde","Romance"],"c":["Germany","France"],"l":["German"]},"Neil Peart: No One's Disciple":{"x":"Geddy Lee and Alex Lifeson team up with four revered drummers — Stewart Copeland, Danny Carey, Chad Smith, and Gavin Harrison — for an exhilarating and poignant tribute to late Rush legend Neil Peart.","d":"Sam Dunn, Scot McFadyen","g":"Documentary, Music, Canadian","t":"Special Presentations","k":["Canadian","Documentary","Music"],"c":["Canada"],"l":["English"]},"Neverman":{"x":"Broadway and cabaret icon Justin Vivian Bond stars as a transgender gay rights activist with worsening Alzheimer disease suffering from the treatment in her nursing home, in Rodrigo Barriuso’s poignant second feature.","d":"Rodrigo Barriuso","g":"2SLGBTQ+, Drama, Canadian","t":"Centrepiece","k":["2SLGBTQ+","Canadian","Drama"],"c":["Canada"],"l":["English"]},"Nobody's Violence":{"x":"Larissa Corriveau delivers a striking performance as an enigmatic death-dealer in this bold, bracing, and Buñuelian feature by Denis Côté.","d":"Denis Côté","g":"Drama, Experimental + Avant-Garde, Mystery + Thriller","t":"Wavelengths","k":["Canadian","Drama","Experimental + Avant-Garde","Mystery + Thriller"],"c":["Canada"],"l":["French"]},"Nosotros":{"x":"After leaving his Indigenous family for work in Guatemala City, a lonely security guard falls for a business owner at the mall he patrols, discovering an unexpected refuge and a new sense of self in a world not yet ready to make space for them.","d":"Joaquín Ruano","g":"2SLGBTQ+, Aboriginal + Indigenous, First Feature","t":"Discovery","k":["2SLGBTQ+","Aboriginal + Indigenous","First Feature"],"c":["Guatemala","Mexico"],"l":["Spanish","Maya K'iche'"]},"Now You See Me":{"x":"","d":"Louis Leterrier","g":"Mystery + Thriller, Crime","t":"Festival Street","k":["Crime","Mystery + Thriller"],"c":["United States of America"],"l":["English"]},"Obsession":{"x":"When a hopeless romantic makes a wish that his long-time crush falls in love with him, a sinister enchantment ensues in writer-director Curry Barker’s freaky and frightening feature debut.","d":"Curry Barker","g":"Horror, First Feature, Cult","t":"Special Events","k":["Cult","First Feature","Horror"],"c":["United States of America"],"l":["English"]},"On Behalf of My Son":{"x":"Anchored by a deeply affecting performance from Rejane Faria, Gabriel Martins’ moving drama follows a grieving mother seeking forgiveness from the families of a tragic bus accident. What unfolds is a profound meditation on guilt and whether forgiveness is possible.","d":"Gabriel Martins","g":"Drama, Black + African Diaspora, Latin American Cultures","t":"Platform","k":["Black + African Diaspora","Drama","Latin American Cultures"],"c":["Brazil"],"l":["Portuguese"]},"Once Upon a Time in Harlem":{"x":"Conceived in 1972 by legendary filmmaker William Greaves and completed 50 years later by his son David, Once Upon a Time in Harlem is an essential work of living archive, documenting a lively gathering of luminaries from the Harlem Renaissance during a cocktail party at Duke Ellington’s home.","d":"William Greaves, David Greaves","g":"Documentary, Black + African Diaspora, Films About Film","t":"Wavelengths","k":["Black + African Diaspora","Documentary","Films About Film"],"c":["United States of America"],"l":["English"],"t2":["Luminaries"]},"Onwards and Sideways":{"x":"The latest from Oscar-nominated director John Madden ( Shakespeare in Love ) stars Oscar nominee Laura Linney (TIFF ’08’s The Savages ) and Rhys Ifans (TIFF ’23’s Mother Couch ) as strangers whose lives become entwined when both are diagnosed with Parkinson disease.","d":"John Madden","g":"Drama, Romance","t":"Gala Presentations","k":["Drama","Romance"],"c":["United Kingdom"],"l":["English"],"t2":["Unhidden Gems presented by Redbreast"]},"Our Loves":{"x":"The latest from Avi Nesher (TIFF '16's Past Life ) is a gracefully woven drama about the ways that love intensifies and second chances are possible in the face of adversity and mayhem.","d":"Avi Nesher","g":"Drama, War, Jewish Cultures","t":"Centrepiece","k":["Drama","First Feature","Jewish Cultures","War"],"c":["Israel"],"l":["Hebrew","Arabic"]},"Oxygen Masks Will (Not) Drop Automatically":{"x":"The first-ever series from renowned Brazilian filmmaker Marcelo Gomes tells the true story of a group of young flight attendants who smuggle treatment drugs from America into the hands of patients with AIDS in 1980s Brazil.","d":"Marcelo Gomes, Carol Minêm","g":"2SLGBTQ+, Biography + History, Latin American Cultures","t":"Primetime","k":["2SLGBTQ+","Biography + History","Latin American Cultures"],"c":["Brazil"],"l":["Portuguese"]},"Paradise Lost":{"x":"A bus full of children mysteriously vanishes. When an altered version of a grieving mother’s son returns years later, she must grapple with the technologically revised reality she has created in this sharp thriller from Yeon Sang-ho.","d":"Yeon Sang-ho","g":"Asian Cultures, Crime, Mystery + Thriller","t":"Special Presentations","k":["Asian Cultures","Crime","Mystery + Thriller","Science Fiction + Fantasy"],"c":["South Korea"],"l":["Korean"]},"Pelechian Project":{"x":"North American premiere of 4K restorations! One of the year’s greatest cinematic gifts, this programme brings together five newly restored films by the pioneering Armenian filmmaker Artavazd Pelechian, each a harrowing ode to humanity, and its natural cycles of existence.","d":"","g":"Experimental + Avant-Garde, Documentary, Biography + History","t":"TIFF Classics","k":["Asian Cultures","Biography + History","Documentary","Experimental + Avant-Garde","Films About Film"],"c":[],"l":[]},"Phoolan":{"x":"In the heartland of India, a young Phoolan Devi becomes one of the most famous outlaws in Indian history and the target of 2,000 heavily armed men sent to kill her over a gruelling 48-hour siege.","d":"Richie Mehta","g":"Biography + History, Drama","t":"Special Presentations","k":["Biography + History","Drama"],"c":["India"],"l":["Hindi"]},"Possible Love":{"x":"Lee Chang-dong’s eagerly anticipated new film brings stories of relationships, generational and class divides, in this gripping tale of two couples playing games with themselves and one another.","d":"Lee Chang-dong","g":"Drama, Asian Cultures, Romance","t":"Special Presentations","k":["Asian Cultures","Drama","Romance"],"c":["South Korea"],"l":["Korean"]},"Pretenders":{"x":"Tough, stylish, and effortlessly cool, the Pretenders founder Chrissie Hynde is the real thing. Grounded in extensive interviews with Hynde and archival materials, Pretenders chronicles the evolution of one of rock’s most singular icons.","d":"Joss Crowley","g":"Documentary, Music, Biography + History","t":"Gala Presentations","k":["Biography + History","Documentary","Music"],"c":["United Kingdom"],"l":["English"]},"Prima Facie":{"x":"Oscar nominee Cynthia Erivo ( Wicked ) stars in this adaptation of Suzie Miller’s globally acclaimed play that examines what happens when an ambitious barrister who primarily defends those accused of sex crimes unexpectedly becomes the accuser in a sexual assault case.","d":"Susanna White","g":"Adaptation, Drama, Directed by Women","t":"Gala Presentations","k":["Adaptation","Black + African Diaspora","Directed by Women","Drama"],"c":["Australia","United Kingdom"],"l":["English"]},"Purgatory":{"x":"This coming-of-age dramedy, set in the 1980s, follows Beatrice as she tries to reunite her recently separated parents, and stars J.K. Simmons, Abby Elliott, John Reynolds, and Jack Innanen.","d":"Lindsay Lanzillotta","g":"First Feature, Coming of Age, Comedy","t":"Discovery","k":["Canadian","Comedy","Coming of Age","First Feature"],"c":["Canada","United States of America"],"l":["English"]},"REDEFINED | Short Film Showcase":{"x":"Catch the premiere of REDEFINED at the Toronto International Film Festival and streaming worldwide on the NFB. Following the screening, join us for a Q&A with the filmmakers.","d":"","g":"","t":"TIFF Next Wave Selects","k":[],"c":[],"l":[],"t2":["Special Events"]},"Rapinoe":{"x":"Soccer star Megan Rapinoe explores what it means to win and lose in this intimate portrait by Rebeca Huntt ( Beba ).","d":"Rebeca Huntt","g":"Documentary, Directed by Women, Sports","t":"TIFF Docs","k":["Biography + History","Directed by Women","Documentary","Sports"],"c":["United Kingdom","United States of America"],"l":["English"]},"Re/Pair":{"x":"Lacey Schwartz Delgado ( Little White Lie ) explores the bonds and tensions between American Black and Jewish communities in a series of dialogues with prominent figures.","d":"Lacey Schwartz Delgado","g":"Documentary, Directed by Women, Jewish Cultures","t":"TIFF Docs","k":["Black + African Diaspora","Directed by Women","Documentary","Jewish Cultures"],"c":["United States of America"],"l":["English"]},"Rehearsals for a Revolution":{"x":"Acclaimed actor-turned-documentarian Pegah Ahangarani draws on a trove of archival material to skillfully weave her personal narrative with Iranian politics over the past four decades.","d":"Pegah Ahangarani","g":"Documentary, Directed by Women, Middle Eastern Cultures","t":"Centrepiece","k":["Directed by Women","Documentary","Middle Eastern Cultures"],"c":["Czech Republic","Spain"],"l":["Persian"]},"Report to Mother":{"x":"North American Premiere of 4K restoration! A daring clarion call and one of the most significant works of Indian political cinema, John Abraham’s extraordinary final film Amma Ariyan ( Report to Mother ) follows a young man in 1970s Kerala as he journeys — with a progressive swell of companions — to inform a mother of her son’s death, amid widespread unrest.","d":"John Abraham","g":"Asian Cultures, Biography + History, Drama","t":"TIFF Classics","k":["Asian Cultures","Biography + History","Drama","Experimental + Avant-Garde"],"c":["India"],"l":["Malayalam"]},"Rescue":{"x":"Director Sine Plambech ( Heartbound , TIFF ’18) documents the kidnapping of a mother and her long quest to be reunited with her husband, illuminating a mass crisis experienced by migrants in the Mediterranean.","d":"Sine Plambech","g":"Documentary, Directed by Women","t":"TIFF Docs","k":["Directed by Women","Documentary"],"c":["Denmark","Italy","Germany","Sweden","Iceland"],"l":["Arabic","English","Italian","German"]},"River":{"x":"Joshua Giuliano makes an audacious debut with a suspenseful slasher that sets three embittered siblings adrift along a rural waterway, and in the sights of a masked killer.","d":"Joshua Giuliano","g":"Horror, Drama, Cult","t":"Midnight Madness","k":["Cult","Drama","First Feature","Horror"],"c":["United States of America"],"l":["English"]},"Rogue Trooper":{"x":"Directed by Duncan Jones ( Moon , Warcraft ), this outlandish animated adaptation of the influential British comic book follows a clone soldier bred for an interstellar forever-war and his fallen comrades whose personalities live on within his gun, helmet, and backpack.","d":"Duncan Jones","g":"Animation, Science Fiction + Fantasy, Action + Adventure","t":"Midnight Madness","k":["Action + Adventure","Adaptation","Animation","Science Fiction + Fantasy","War"],"c":["United Kingdom"],"l":["English"]},"Run Terry Run":{"x":"This intimate and inspiring portrait from filmmaker Sean Menard (TIFF ’17’s The Carter Effect ) draws upon never-before-seen footage to reveal the arduous process and profound commitment beh dy","Crime"],"c":["United Kingdom","United States of America"],"l":["English"]},"Smudge the Blades":{"x":"A fresh take on the underdog sports film, centring on an Indigenous hockey team in Northern Alberta, from actor and director Cody Lightning ( Hey, Viktor! , TIFF ’23) and starring Ed Helms, Jana Schmieding, and Paulina Alexis.","d":"Cody Lightning","g":"Comedy, Coming of Age, First Nations Métis + Inuit","t":"Centrepiece","k":["Canadian","Comedy","Coming of Age","First Nations Métis + Inuit","Sports"],"c":["Canada"],"l":["English"]},"Soumsoum, The Night of the Stars":{"x":"Five years after Lingui, the Sacred Bonds , Chadian director Mahamat-Saleh Haroun returns to TIFF with his latest feature, winner of the FIPRESCI Award at the 2026 Berlinale.","d":"Mahamat-Saleh Haroun","g":"Drama, Black + African Diaspora, Romance","t":"Centrepiece","k":["Black + African Diaspora","Drama","Romance"],"c":["Chad","France"],"l":["Arabic","French"]},"Spirit Guardians: The Last Secret of the First Emperor":{"x":"The largest production in Vietnamese history, this sweeping epic from Nguyễn Phan Quang Binh ( The Floating Lives ) transports us to the Đinh dynasty, when a band of fearless warriors set out on a secret mission to safeguard a sacred mystery.","d":"Nguyễn Phan Quang Binh","g":"Action + Adventure, Asian Cultures, Drama","t":"Gala Presentations","k":["Action + Adventure","Asian Cultures","Biography + History","Drama"],"c":["Vietnam"],"l":["Vietnamese"]},"Spring in a Small Town":{"x":"World Premiere of 4K restoration! Crowned the greatest Chinese film ever made by the Hong Kong Film Critics Society, director Fei Mu’s poetic, romantic 1948 masterpiece observes a bored wife enlivened by a surprise visit from an old flame, whose presence threatens to upend the matrimonial home.","d":"Fei Mu","g":"Asian Cultures, Drama, Romance","t":"TIFF Classics","k":["Asian Cultures","Drama","Romance"],"c":["China"],"l":["Mandarin"]},"Spy Kids":{"x":"","d":"Robert Rodriguez","g":"Action + Adventure, Comedy, Family Friendly","t":"Festival Street","k":["Action + Adventure","Comedy","Family Friendly"],"c":["United States of America"],"l":["English","Spanish"]},"Still Night, Burning House":{"x":"A once-close family comes together to say goodbye to an uncle who struggled with mental health issues, in award-winning short filmmaker Carol Nguyen’s tender and emotional feature-length documentary debut.","d":"Carol Nguyen","g":"Directed by Women, Documentary, Asian Cultures","t":"TIFF Docs","k":["Asian Cultures","Biography + History","Canadian","Directed by Women","Documentary","First Feature"],"c":["Canada"],"l":["English","Vietnamese"]},"Strangers on a Train":{"x":"","d":"Alfred Hitchcock","g":"Mystery + Thriller","t":"Festival Street","k":["Mystery + Thriller"],"c":["United States of America"],"l":["English"]},"Strong Son":{"x":"A bodybuilder struggles to keep it together as he cares for his elderly father in this perceptive and deeply felt drama by Winnipeg’s Ian Bawa.","d":"Ian Bawa","g":"Drama, Sports, First Feature","t":"Discovery","k":["Asian Cultures","Canadian","Drama","First Feature","Sports"],"c":["Canada"],"l":["English","Punjabi"]},"Stuffed":{"x":"Love, death, and taxidermy collide in this gloriously twisted musical, one of the year’s funniest, most original, and unexpectedly heartfelt romances.","d":"Theo Rhys","g":"Musical, Drama, Comedy","t":"Discovery","k":["Comedy","Cult","Drama","First Feature","Musical","Romance"],"c":["United Kingdom"],"l":["English"]},"Sunburn":{"x":"Over one hot summer day in Toronto, a group of young people try to survive the heatwave and a blackout by making jokes, roaming the city, and forming tangible connections that feel like they can disappear at any moment.","d":"Serville Poblete","g":"Black + African Diaspora, Coming of Age, Comedy","t":"Centrepiece","k":["Asian Cultures","Black + African Diaspora","Canadian","Comedy","Coming of Age"],"c":["Canada"],"l":["English"],"t2":["TIFF Next Wave Selects"]},"Tangles":{"x":"A aine"],"l":["English"]},"The Black Box is Orange":{"x":"The debut feature by Toronto artist and filmmaker Yuula Benivolski, The Black Box is Orange is a multimodal, autobiographical essay film that deploys both personal memory and incomplete archives to reflect on a childhood in a militarized border town.","d":"Yuula Benivolski","g":"Experimental + Avant-Garde, Directed by Women, First Feature","t":"Wavelengths","k":["Canadian","Directed by Women","Experimental + Avant-Garde","First Feature"],"c":["Canada"],"l":["Arabic","English","Hebrew"]},"The City of the Living":{"x":"The City of the Living is Edoardo Gabbriellini’s ( Holiday , TIFF ’23) gripping yet respectful anti-true crime film based on Nicola Lagioia’s bestselling literary chronicle about the senseless 2016 murder of a young man that rocked Rome.","d":"Edoardo Gabbriellini","g":"Drama, Adaptation, Crime","t":"Centrepiece","k":["Adaptation","Crime","Drama"],"c":["Italy"],"l":["Italian"]},"The Daughters of Abraham":{"x":"A young Muslim woman raised in Marseille reunites with a young Jewish woman after a period of estrangement, reconnecting as friends over summer break. When a sudden tragedy disrupts their carefree holiday, the pair face the similarities and differences that strengthen and threaten their relationship together.","d":"Hanaël El Yousfi","g":"Directed by Women, Drama, Middle Eastern Cultures","t":"Discovery","k":["Directed by Women","Drama","Jewish Cultures","Middle Eastern Cultures"],"c":["France"],"l":["French","Arabic"]},"The Debut":{"x":"Jesse Eisenberg directs Academy Award winner Julianne Moore and Paul Giamatti in a dark comedy about a bored suburban housewife who finds purpose acting in community theatre.","d":"Jesse Eisenberg","g":"Drama, Comedy, Musical","t":"Special Presentations","k":["Comedy","Drama","Musical"],"c":["United States of America"],"l":["English"]},"The Diary of a Chambermaid":{"x":"Offering his most provocative work yet, the latest from Romanian provocateur Radu Jude is a surprisingly tender socioeconomic satire.","d":"Radu Jude","g":"Drama, Adaptation","t":"Wavelengths","k":["Adaptation","Drama"],"c":["France","Romania"],"l":["French","Romanian"]},"The Difficult Bride":{"x":"Following the strange visions afflicting a woman on the cusp of marriage, the latest from Rubaiyat Hossain (TIFF ’19’s Made in Bangladesh ) examines the pressures applied to brides in a milieu where weddings demand an asphyxiating feminine ideal.","d":"Rubaiyat Hossain","g":"Directed by Women, Drama, Mystery + Thriller","t":"Centrepiece","k":["Directed by Women","Drama","Mystery + Thriller"],"c":["France","Bangladesh","Germany","Norway","Portugal"],"l":["Bengali","English"]},"The Dreamed Adventure":{"x":"Winner of the Jury Prize in the competition section of the Cannes Film Festival, The Dreamed Adventure is German auteur Valeska Grisebach's highly anticipated and exceptional follow up to Western (TIFF ’17).","d":"Valeska Grisebach","g":"Drama, Directed by Women, Crime","t":"Centrepiece","k":["Crime","Directed by Women","Drama"],"c":["Germany","France","Bulgaria","Austria"],"l":["Bulgarian"]},"The F Word":{"x":"","d":"Michael Dowse","g":"Romance, Comedy","t":"Festival Street","k":["Comedy","Romance"],"c":["Canada","Ireland"],"l":["English"]},"The Face of Horror":{"x":"The Love Witch ’s Anna Biller stunningly adapts the famous Japanese ghost story Yotsuya Kaidan for 14th-century England in this gory tribute to classic Technicolor shockers.","d":"Anna Biller","g":"Horror, Adaptation, Romance","t":"Midnight Madness","k":["Adaptation","Cult","Directed by Women","Horror","Romance"],"c":["United Kingdom"],"l":["English"]},"The Final Act":{"x":"Quebec’s Sophie Deraspe returns to the Festival with a philosophical and intimate look at the many profound issues surrounding both death and medically assisted dying in an extraordinary documentary.","d":"Sophie Deraspe","g":"Documentary, Directed by Women, Canadian","t":"TIFF Docs","k":["Canadian","Directed by Women","Documentary"],"c":["Canada"],"l":["English","French"]},"The Fortunate Isles":{"x":"In the 16th century, on the newly conquered Canary Islands, colonial misgivings intersect with personal desperation. Fátima, an enslaved and pregnant woman, must struggle to survive both the landscape, and the other inhabitants.","d":"Helena Girón, Samuel Delgado","g":"Drama, Directed by Women, Black + African Diaspora","t":"Discovery","k":["Black + African Diaspora","Directed by Women","Drama"],"c":["Spain","Greece"],"l":["Spanish","French","Arabic"]},"The Great Muppet Caper":{"x":"","d":"Jim Henson","g":"Crime, Comedy, Family Friendly","t":"Festival Street","k":["Comedy","Crime","Family Friendly"],"c":["United States of America"],"l":["English"]},"The Housewife":{"x":"Grounded in artful performances from Oscar nominee Naomi Watts (TIFF ’01’s Mulholland Drive ) and Tye Sheridan (TIFF ’13’s Joe ), this salient historical drama depicts the complexities of seeking justice in the long shadow of Nazism.","d":"Ben Shirinian","g":"Drama, Biography + History, War","t":"Special Presentations","k":["Biography + History","Drama","War"],"c":["United States of America"],"l":["English"]},"The Hummingbird Paints Fragrant Songs":{"x":"The Indigenous painter Sara Flores gets discovered by the international art world in her 70s, setting her off on an adventure as she travels from her home in the Peruvian Amazon to be fȇted in galleries from New York to Paris.","d":"Èlia Gasull Balada, Matteo Norzi","g":"Documentary, Directed by Women, Aboriginal + Indigenous","t":"TIFF Docs","k":["Aboriginal + Indigenous","Directed by Women","Documentary","Latin American Cultures"],"c":["Peru","United States of America","Qatar"],"l":["Spanish"]},"The Idiot(s)":{"x":"Aimee Lou Wood and Johnny Flynn bring to life the story of Anna and Fyodor Dostoevsky, showcasing the troubled author and the woman who pushed him to write one of his greatest works.","d":"Michał Englert, Małgorzata Szumowska","g":"Drama, Adaptation","t":"Special Presentations","k":["Adaptation","Drama"],"c":["Poland","Germany"],"l":["English","German","French"]},"The Julia Set":{"x":"Chase Infiniti stars as a gifted university student who becomes romantically involved with a teaching assistant as they both prepare for the Putnam Exam, the most challenging math competition in North America. Gillian Anderson and Jason Isaacs co-star.","d":"Niki Byrne","g":"Drama, Coming of Age, Romance","t":"Special Presentations","k":["Coming of Age","Directed by Women","Drama","Romance"],"c":["United States of America"],"l":["English"]},"The Last Photograph":{"x":"Starring Stuart Martin, Fra Fee, and Costanza Andrade, the latest from Zack Snyder ( 300 ) follows an ex-DEA agent seeking revenge in a South American jungle where dangerous terrain and inner demons intermingle.","d":"Zack Snyder","g":"","t":"Special Events","k":[],"c":["United States of America"],"l":["English","Spanish"]},"The Liberation":{"x":"Carrie Coon soars in the riveting story inspired by filmmaker Guy Nattiv’s grandmother, whose humdrum day-to-day life is upended by a mysterious and entrancing young woman (Lily James) offering the promise of escape to something better.","d":"Guy Nattiv","g":"Biography + History, Cult, Crime","t":"Special Presentations","k":["Biography + History","Crime","Cult","Drama"],"c":["United States of America"],"l":["English"]},"The Life and Deaths of Wilson Shedd":{"x":"Starring Oscar nominee Amanda Seyfried ( The Testament of Ann Lee , TIFF ’25) and Scoot McNairy ( Nightbitch , TIFF ’24), the latest from Tim Blake Nelson is a psychologically rich prison story about crime, punishment, and love.","d":"Tim Blake Nelson","g":"Crime, Drama, Romance","t":"Gala Presentations","k":["Crime","Drama","Mystery + Thriller","Romance"],"c":["United States of America"],"l":["English"]},"The Lost Children Of Tuam":{"x":"A quietly powerful true story of an amateur historian’s quest to uncover a long-buried injustice. By exposing what rightly became a national scandal, Catherine Corless changed Ireland forever.","d":"Frank Berry","g":"Biography + History, Drama","t":"Centrepiece","k":["Biography + History","Drama"],"c":["Ireland"],"l":["English"]},"The Man I Love":{"x":"Ira Sachs’ vision of New York artists living under the spectre of AIDS in the ’80s focuses on the joy and salvation of creativity.","d":"Ira Sachs","g":"2SLGBTQ+, Drama","t":"Special Presentations","k":["2SLGBTQ+","Drama"],"c":["United States of America"],"l":["English"]},"The Only Living Pickpocket in New York":{"x":"Anchored by John Turturro’s charismatic performance, this low-key crime drama from Noah Segan ( Blood Relatives ) harkens back to the character-driven films of 1970s New Hollywood.","d":"Noah Segan","g":"Crime, Drama, Mystery + Thriller","t":"Gala Presentations","k":["Crime","Drama","Mystery + Thriller"],"c":["United States of America"],"l":["English"]},"The Pervert's Guide to Utopias":{"x":"Twenty years after The Pervert’s Guide to Cinema , the renowned intellectual Slavoj Žižek reunites with director Sophie Fiennes for a fresh meditation on movies and ideas that crackles with energy.","d":"Sophie Fiennes","g":"Documentary, Directed by Women, Films About Film","t":"TIFF Docs","k":["Directed by Women","Documentary","Films About Film"],"c":["Ireland","United Kingdom","Slovenia","Netherlands","Norway"],"l":["English"]},"The Remotes":{"x":"This ambitious, beguiling narrative debut from acclaimed Filipino filmmaker and experimentalist John Torres follows a grieving detective who finds himself increasingly ensnared while investigating a case involving a sinister navigation app causing physical and psychological debris.","d":"John Torres","g":"Experimental + Avant-Garde, Asian Cultures, Mystery + Thriller","t":"Wavelengths","k":["Asian Cultures","Experimental + Avant-Garde","Mystery + Thriller","Science Fiction + Fantasy"],"c":["Philippines"],"l":["Tagalog","English"]},"The Road Not Taken":{"x":"Peter Ho-Sun Chan directs Zhou Xun, Wen Qi, Tian Zhuangzhuang and Wang Xiao in a drama about early-onset Alzheimer disease. Combining expert storytelling with commercial appeal, The Road Not Taken reflects on what remains when our understanding of the world begins to disappear.","d":"Peter Ho-Sun Chan","g":"Drama, Asian Cultures","t":"Special Presentations","k":["Asian Cultures","Drama"],"c":["China"],"l":["Chinese"]},"The Secret Lives of Baba Segi's Wives":{"x":"A wealthy patriarch’s fragile household unravels when the youngest of his four wives fails to conceive. Blending sharp Nollywood wit with tenderness, this deeply satisfying drama explores topics of infertility, gendered inheritance, and shifting family power.","d":"Daniel Oriahi","g":"Black + African Diaspora, Comedy, Adaptation","t":"Centrepiece","k":["Adaptation","Black + African Diaspora","Comedy","Drama"],"c":["Nigeria"],"l":["Yoruba","English"]},"The Smell of Apples":{"x":"In John Trengove’s relentless third feature, a sheltered 11-year-old white South African boy gradually comes to realize the horrors of the apartheid system.","d":"John Trengove","g":"Drama, Environment + Sustainability, Biography + History","t":"Platform","k":["Adaptation","Biography + History","Drama","Environment + Sustainability"],"c":["South Africa","Netherlands","Chile"],"l":["Afrikaans","English"]},"The Spiral":{"x":"Director Paolo Strippoli turns the screws on a desperate mother (Jasmine Trinca) as she confesses a series of Faustian bargains to her estranged daughter (Romana Maggiora Vergano) in this riveting morality chiller.","d":"Paolo Strippoli","g":"Horror, Drama","t":"Midnight Madness","k":["Drama","Horror"],"c":["Italy","France","Belgium"],"l":["Italian"]},"The Stunt Driver":{"x":"Jay Baruchel and director Michael Dowse re-team for a raucous yet heartfelt comedy about a Canadian stuntman who dared to dream big and fly (very) high.","d":"Michael Dowse","g":"Comedy, Adaptation, Biography + History","t":"Special Presentations","k":["Adaptation","Biography + History","Canadian","Comedy","Cult"],"c":["Canada"],"l":["English"]},"The Surgeon":{"x":"Oscar winner Michelle Yeoh ( Everything Everywhere All at Once ) is back in action as a kidnapped surgeon forced to perform one last operation in this fun, pulse-pounding thriller.","d":"Roshan Sethi","g":"Action + Adventure, Mystery + Thriller, Drama","t":"Centrepiece","k":["Action + Adventure","Drama","Mystery + Thriller"],"c":["Ireland"],"l":["English"]},"The Ultra Runner":{"x":"Punishing tests of human endurance become a means of escaping past demons for the unforgettable subject of Mila Aung-Thwin’s superb new film.","d":"Mila Aung-Thwin","g":"Documentary, Sports, War","t":"TIFF Docs","k":["Biography + History","Canadian","Documentary","Sports","War"],"c":["Canada"],"l":["English","Romanian","Italian","German"]},"The Unknown":{"x":"A highlight of this year’s Cannes Competition, the third feature by acclaimed French filmmaker, actor, and screenwriter Arthur Harari (co-writer of Anatomy of a Fall ) is a moody, existential body-swap puzzler starring an extraordinary Léa Seydoux and a near-unrecognizable Niels Schneider.","d":"Arthur Harari","g":"Mystery + Thriller, Drama, Cult","t":"Special Presentations","k":["Cult","Drama","Mystery + Thriller"],"c":["France"],"l":["French"]},"The Violinist":{"x":"Winner of this year’s Annecy Cristal award, this intimate animation about two violinists in Singapore circa WWII highlights the healing power of music while pulling heartstrings.","d":"Ervin Han, Raúl García","g":"Animation, War, Music","t":"Centrepiece","k":["Animation","Drama","Music","Romance","War"],"c":["Singapore","Spain","Italy"],"l":["English","Japanese"],"t2":["Unhidden Gems presented by Redbreast"]},"The World Before":{"x":"Yoon Dan-bi’s coming-of-age story follows two childhood best friends who reunite for a summer on a remote Korean island. This beautifully constructed slice of life captures the emotional intensity of adolescence through assured filmmaking and compelling performances.","d"
