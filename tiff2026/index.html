  seeded = [...new Set([...seeded, ...fresh])];
  return true;
}

async function load(){
  const raw = await store.get(SKEY+'-state');
  let st=null; try{ st = raw?JSON.parse(raw):null; }catch(e){}
  if(st && st.v===2 && st.plans && Object.keys(st.plans).length){
    plans = st.plans;
    seeded = Array.isArray(st.seeded) ? st.seeded : [];
    const changed = applyNewSeeds();
    adopt(plans[st.active] ? st.active : Object.keys(plans)[0]);
    if(changed) persist();
  } else if(st && st.shortlist){                       // migrate the single-plan format
    plans = {'My plan': {s:st.shortlist, p:st.picks||[], a:st.avail||{}}};
    applyNewSeeds();
    adopt('My plan'); persist();
  } else {
    const a={}; SEED_SOLDOUT.forEach(i => { if(get(i)) a[i]=3; });
    plans = {'My plan': {s:[...PRESET], p:[], a}};
    seeded = SEED_SOLDOUT.filter(i=>get(i));
    adopt('My plan'); persist();
  }
  storeOk = await probeStore();
  const m = location.hash.match(/[#&]p=([^&]+)/);
  if(m){
    try{
      const inc = decodeState(decodeURIComponent(m[1]));
      const only = Object.keys(plans).length===1 && !shortlist.size && !picks.size;
      if(only){                                        // nothing here yet: just take it
        plans={}; const k=uniqueName(inc.label||'Shared plan');
        plans[k]={s:inc.names,p:inc.picks,a:inc.avail,b:inc.bought||[]};
        seeded=[]; applyNewSeeds();
        adopt(k); persist();                           // <- must persist or a refresh loses it
      } else {
        importPlan(inc, inc.label || 'Shared plan');
      }
    }catch(e){}
    history.replaceState(null,'',location.href.split('#')[0]);
  }
  ready=true;
  setView(shortlist.size ? 'film' : 'cat');
  render();
}
function persist(){
  plans[active]=snapshot();
  store.set(SKEY+'-state', JSON.stringify({v:2, active, plans, seeded}));
}

const av = id => avail[id] || 0;
function cycleAv(id){ avail[id] = (av(id)+1)%4; if(avail[id]===0) delete avail[id]; persist(); render(); }
const soldOut = id => av(id)===3;
const hasTicket = id => bought.has(id);
function ord(f){
  const list=BY_FILM[f.film]||[];
  if(list.length<2) return '';
  return (list.findIndex(o=>o.id===f.id)+1)+'/'+list.length;
}

function overlaps(a,b){ return a.dateKey===b.dateKey && tm(a.start)<tm(b.end) && tm(b.start)<tm(a.end); }
function gapMin(a,b){
  if(a.dateKey!==b.dateKey) return null;
  const ae=tm(a.end),bs=tm(b.start),as=tm(a.start),be=tm(b.end);
  if(bs>=ae) return bs-ae; if(as>=be) return as-be; return null;
}
function pickFlags(){
  const it=[...picks].map(get).filter(Boolean), fl={};
  it.forEach(f=>fl[f.id]={cf:false,tg:0,dup:false});
  for(let i=0;i<it.length;i++) for(let j=i+1;j<it.length;j++){
    const a=it[i],b=it[j];
    if(a.film===b.film){ fl[a.id].dup=true; fl[b.id].dup=true; }
    if(overlaps(a,b)){ fl[a.id].cf=true; fl[b.id].cf=true; continue; }
    if(a.venue!==b.venue){
      const g=gapMin(a,b);
      if(g!==null&&g<20){
        fl[a.id].tg=fl[a.id].tg?Math.min(fl[a.id].tg,g):g;
        fl[b.id].tg=fl[b.id].tg?Math.min(fl[b.id].tg,g):g;
      }
    }
  }
  return fl;
}
function blockedBy(s){
  for(const pid of picks){
    const p=get(pid);
    if(!p||p.id===s.id||p.film===s.film) continue;
    if(overlaps(p,s)) return p;
  }
  return null;
}
function filmState(n){
  const opts=BY_FILM[n];
  const picked=opts.filter(o=>picks.has(o.id));
  const free=opts.filter(o=>!blockedBy(o) && !soldOut(o.id));
  const out=opts.filter(o=>soldOut(o.id)).length;
  const only=opts.length===1;
  if(picked.length) return {k:'done',picked,free,opts,out,only};
  if(!free.length) return {k:'urgent',picked,free,opts,out,only,msg: out===opts.length?'all sold out':'no free time slot'};
  if(free.length===1) return {k:'soon',picked,free,opts,out,only,
    msg: only?'screens once only':`1 of ${opts.length} time slots left`};
  return {k:'ok',picked,free,opts,out,only,msg:free.length+' time slots free'};
}
function gridPick(id){
  const f=get(id); if(!f) return;
  touchedS.add(id);
  if(picks.has(id) && !bought.has(id)){
    bought.add(id);                         // picked -> ticket bought
  } else if(bought.has(id)){
    picks.delete(id); bought.delete(id);    // ticket -> back to shortlist only
  } else if(shortlist.has(f.film) && !BY_FILM[f.film].some(o=>picks.has(o.id))){
    shortlist.delete(f.film);               // shortlisted, no pick -> off the list
  } else {
    shortlist.add(f.film); picks.add(id);   // off the list -> shortlisted + picked
  }
  persist(); render();
}
function gridHint(f){
  if(bought.has(f.id)) return 'ticket bought \u2014 click to unpick';
  if(picks.has(f.id)) return 'click to mark the ticket bought';
  if(shortlist.has(f.film) && !BY_FILM[f.film].some(o=>picks.has(o.id))) return 'click to remove from shortlist';
  return 'click to shortlist and pick';
}
function togglePick(id){
  if(!picks.has(id)){ picks.add(id); }
  else if(!bought.has(id)){ bought.add(id); }
  else { picks.delete(id); bought.delete(id); }
  persist(); render();
}
function pickHint(id){
  if(!picks.has(id)) return 'click to pick this time';
  if(!bought.has(id)) return 'click to mark the ticket bought';
  return 'ticket bought \u2014 click to clear';
}
function toggleShort(n){
  touchedF.add(n);
  if(shortlist.has(n)){ shortlist.delete(n); BY_FILM[n].forEach(o=>picks.delete(o.id)); }
  else shortlist.add(n);
  persist(); render();
}

const CAN_HOVER = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
const tipEl = document.getElementById('tip');

function tipHtml(f){
  const m=meta(f.film), bl=!picks.has(f.id)&&shortlist.has(f.film)?blockedBy(f):null;
  const d=f.duration?` \u00b7 ${f.duration} min`:'';
  const bits=[m.g,m.t,(m.c||[]).join('/'),m.y].filter(Boolean).join(' \u00b7 ');
  let warn='';
  if(hasTicket(f.id)) warn+='<span class="tw okg">\u{1F3AB} Ticket bought</span>';
  else if(soldOut(f.id)) warn+='<span class="tw bad">Sold out</span>';
  if(bl) warn+=`<span class="tw wn">Clashes with ${esc(bl.film)}</span>`;
  warn+=`<span class="tw ok">${gridHint(f)}</span>`;
  return `<span class="tn">${esc(f.film)}</span>
    <span class="tm2">${f.start}\u2013${f.end}${d} \u00b7 ${esc(f.venue)}${ord(f)?` \u00b7 screening ${ord(f)}`:''}</span>
    ${bits||m.d?`<span class="tm2">${esc(bits)}${m.d?(bits?' \u00b7 ':'')+'dir. '+esc(m.d):''}</span>`:''}
    ${langLine(f.film)?`<span class="tm2">${esc(langLine(f.film))}</span>`:''}
    ${m.x?`<span class="td">${esc(m.x)}</span>`:''}${warn}`;
}
function showTip(f, ev){
  if(!CAN_HOVER || !tipEl) return;
  tipEl.innerHTML=tipHtml(f);
  tipEl.hidden=false;
  const r=tipEl.getBoundingClientRect();
  let x=ev.clientX+14, y=ev.clientY+14;
  if(x+r.width>window.innerWidth-8) x=Math.max(8, ev.clientX-r.width-14);
  if(y+r.height>window.innerHeight-8) y=Math.max(8, ev.clientY-r.height-14);
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
}
function hideTip(){ if(tipEl) tipEl.hidden=true; }

function renderPlanBar(){

    <button class="pill" id="planDel"${names.length<2?' disabled':''}>Delete</button>
    <span class="planwho">Viewing <b>${esc(active)}</b> \u2014 ${(p.s||[]).length} films, ${(p.p||[]).length} times picked. ${names.length>1?'Edits apply to this plan only.':'Import a friend\'s link to keep theirs alongside yours.'}</span>`;
  document.getElementById('planSel').addEventListener('change',e=>switchPlan(e.target.value));

    const raw=prompt('Name for the new, empty plan:','My plan');
    if(raw===null) return;
    persist();
    const k=uniqueName(raw);
    const a={}; SEED_SOLDOUT.forEach(i=>{ if(get(i)) a[i]=3; });

    adopt(k); persist();
    setView('cat');                     // a brand-new plan starts at "choose films"
    render();
  });
  document.getElementById('planRen').addEventListener('click',()=>{
    const raw=prompt('Rename this plan:',active);
    if(raw===null) return;
    const k=(raw||'').trim(); if(!k||k===active) return;

function fb(n){ return `<button class="fbtn" data-focus="${esc(n)}">${esc(n)}</button>`; }

function renderIssues(){
  const el=document.getElementById('issues');
  if(!shortlist.size){ el.innerHTML=''; return; }
  const fl=pickFlags(), it=[...picks].map(get).filter(Boolean);
  const names=[...shortlist];
  const urgent=[];
  names.forEach(n=>{
    const s=filmState(n);
    if(s.k==='urgent') urgent.push([n, s.out===s.opts.length?'all sold out':'blocked by your picks']);
  });
  const clashes=[], tights=[];
  for(let i=0;i<it.length;i++) for(let j=i+1;j<it.length;j++){
    const a=it[i],b=it[j];
    if(overlaps(a,b)) clashes.push([a,b]);
    else if(a.venue!==b.venue){
      const g=gapMin(a,b);
      if(g!==null&&g<20) tights.push([a,b,g]);
    }
  }
  const dups=[...new Set(it.filter(f=>fl[f.id].dup).map(f=>f.film))];
  const so=it.filter(f=>soldOut(f.id)&&!hasTicket(f.id));
  const rows=[];
  if(urgent.length) rows.push(`<div class="issrow"><span class="isslab wn">No time slot left:</span>
    <span class="issnames">${urgent.map(([n,w])=>fb(n)+`<span style="color:var(--t3)">(${w})</span>`).join(' ')}</span></div>`);
  const tkClash=clashes.filter(([a,b])=>hasTicket(a.id)||hasTicket(b.id));
  if(tkClash.length) rows.push(`<div class="issrow"><span class="isslab bad">Ticket clashes:</span>
    <span class="issnames">${tkClash.map(([a,b])=>`<span>${fb(a.film)} ${hasTicket(a.id)?'\u{1F3AB}':''} vs ${fb(b.film)} ${hasTicket(b.id)?'\u{1F3AB}':''}, ${a.dateLabel}</span>`).join('; ')}</span></div>`);
  if(clashes.length) rows.push(`<div class="issrow"><span class="isslab bad">Overlapping picks:</span>
    <span class="issnames">${clashes.map(([a,b])=>`<span>${fb(a.film)} ${a.start}\u2013${a.end} vs ${fb(b.film)} ${b.start}\u2013${b.end}, ${a.dateLabel}</span>`).join('; ')}</span></div>`);
  if(tights.length) rows.push(`<div class="issrow"><span class="isslab wn">Tight changeover:</span>
    <span class="issnames">${tights.map(([a,b,g])=>`<span>${g} min: ${fb(a.film)} (${esc(a.venue)}) \u2192 ${fb(b.film)} (${esc(b.venue)}), ${a.dateLabel}</span>`).join('; ')}</span></div>`);
  if(dups.length) rows.push(`<div class="issrow"><span class="isslab wn">Picked twice:</span>
    <span class="issnames">${dups.map(fb).join(' ')}</span></div>`);
  if(so.length) rows.push(`<div class="issrow"><span class="isslab bad">Picked but sold out:</span>
    <span class="issnames">${so.map(f=>`<span>${fb(f.film)} ${f.dateLabel} ${f.start}</span>`).join('; ')}</span></div>`);
  el.innerHTML = rows.length
    ? `<div class="iss">${rows.join('')}</div>`
    : `<div class="iss"><span class="issclean">No conflicts. ${names.length-[...shortlist].filter(n=>filmState(n).k==='done').length} film${names.length-[...shortlist].filter(n=>filmState(n).k==='done').length===1?'':'s'} still without a time.</span></div>`;
}

function kwPills(n){

function rowHtml(f, fl){

function hasFreeSeat(n){ return (BY_FILM[n]||[]).some(o=>!soldOut(o.id)); }
function seatBadge(n){
  const all=BY_FILM[n]||[];
  const out=all.filter(o=>soldOut(o.id)).length;
  if(!out) return '';
  const free=all.length-out;
  return free
    ? `<span class="avl ok">${free} of ${all.length} on sale</span>`
    : `<span class="avl bad">all ${all.length===1?'sold out':all.length+' sold out'}</span>`;
}
function dropMatch(n){
  const m=meta(n);
  if(availOnly && !hasFreeSeat(n)) return false;
  if(theme && m.t!==theme) return false;
  if(kw && !m.k.includes(kw)) return false;
  if(country && !(m.c||[]).includes(country)) return false;
  if(lang && !(m.l||[]).includes(lang)) return false;
  return true;
}
function queryMatch(n, extra){
  if(!query) return true;
  const m=meta(n);
  return [n, m.d||'', m.x||'', (m.c||[]).join(' '), (m.l||[]).join(' '), extra||'']
    .join(' ').toLowerCase().includes(query);
}
function filterNames(names){ return names.filter(n=>dropMatch(n)&&queryMatch(n)); }
function cnt(n){ return `<option value="${esc(n)}"`; }
function filterBar(ph){

function vFilm(){
  if(!shortlist.size) return `<p class="empty">Nothing shortlisted yet. Go to "1. Choose films" and tick the ones you want to consider${PRESET.length?', or load a shortlist from the bar above':''}.</p>`;
  const names=filterNames([...shortlist]);
  const RANK={urgent:0,soon:1,ok:2,done:3};
  const rows=names.map(n=>({n,s:filmState(n)}))
    .sort((a,b)=>RANK[a.s.k]-RANK[b.s.k]||a.n.localeCompare(b.n,'fi'));
  let h=filterBar('Filter shortlist\u2026');
  h+=rows.map(({n,s})=>{
    const m=meta(n);
    const cls=s.k==='done'?'done':s.k==='urgent'?'urgent':s.k==='soon'?'soon':'';
    const lab=s.k==='done'?`${hasTicket(s.picked[0].id)?'\u{1F3AB}':'\u2605'} ${s.picked[0].dateLabel} ${s.picked[0].start}${ord(s.picked[0])?' ('+ord(s.picked[0])+')':''}`:s.msg;
    const opts=s.opts.map(o=>{
      const on=picks.has(o.id), bl=blockedBy(o), so=soldOut(o.id);
      const gone=(bl||so)&&!on;
      const d=o.duration?` \u00b7 ${o.duration} min`:'';
      const why=bl&&!so?' \u2014 clashes with '+esc(bl.film):'';
      const tk=hasTicket(o.id);
      return `<div class="opt${gone?' gone':''}${so&&!tk?' soopt':''}">${avBtn(o.id)}
        <button class="ob${tk?' tk':on?' on':''}" data-pick="${o.id}" title="${esc(pickHint(o.id))}">${tk?'\u{1F3AB} ticket':on?'\u2605 picked':'pick'}</button>
        <span>${ord(o)?`<b class="ordn">${ord(o)}</b> `:''}${o.dateLabel} ${o.start}\u2013${o.end}${d} \u00b7 ${esc(o.venue)}${why}${o.u&&!so?` <a class="buy" href="${esc(o.u)}" target="_blank" rel="noopener">tickets</a>`:''}</span>
        ${so&&!tk?'<span class="sold">sold out</span>':''}</div>`;
    }).join('');
    return `<div class="fc ${cls}"><div class="fh"><p class="fn">${esc(n)}${seatBadge(n)}</p>
      <span class="fs ${s.k}">${lab}</span></div>
      <p class="cc" style="margin:1px 0 0">${esc(kwPills(n))}${m.d?' \u00b7 dir. '+esc(m.d):''}</p>
      ${langLine(n)?`<p class="kws">${esc(langLine(n))}</p>`:''}
      ${m.x?`<p class="dsc">${esc(m.x)}</p>`:''}
      <div class="opts">${opts}</div></div>`;
  }).join('');
  return h;
}

const PXM=1.15;
function vGrid(){
  const fl=pickFlags();
  const dayAll=S.filter(f=>f.dateKey===gridDay);
  const scopeOk=f=>gridScope==='short'?shortlist.has(f.film):gridScope==='picks'?picks.has(f.id):true;
  const inScope=f=>scopeOk(f)&&(!availOnly||!soldOut(f.id))&&dropMatch(f.film)&&queryMatch(f.film,f.venue);
  const pool=dayAll.filter(f=>inScope(f)||touchedS.has(f.id));
  const di=DAYS.findIndex(([k])=>k===gridDay);
  let h=`<div class="ctrl daynav">
    <button class="pill nav" id="prevDay"${di<=0?' disabled':''} aria-label="Previous day">\u2039</button>
    <select id="gday">${DAYS.map(([k,l])=>`<option value="${k}"${k===gridDay?' selected':''}>${l}</option>`).join('')}</select>
    <button class="pill nav" id="nextDay"${di>=DAYS.length-1?' disabled':''} aria-label="Next day">\u203a</button></div>
    <div class="ctrl scopes">
    <button class="pill${gridScope==='short'?' active':''}" data-scope="short">Shortlist</button>
    <button class="pill${gridScope==='picks'?' active':''}" data-scope="picks">My picks</button>
    <button class="pill${gridScope==='all'?' active':''}" data-scope="all">Whole programme</button></div>`;
  h+=filterBar('Search film, director, venue\u2026');
  h+=`<div class="leg"><span><i style="background:var(--acb);border-color:var(--ac)"></i>shortlist</span>
    <span><i style="background:var(--sb);border-color:var(--sbr)"></i>picked</span>
    <span><i style="background:var(--ok-bg);border-color:var(--ok)"></i>ticket bought</span>
    <span><i style="background:var(--dgb);border-color:var(--dg)"></i>overlapping</span>
    <span><i style="background:var(--card2);opacity:.4"></i>blocked or sold out</span></div>`;
  if(!pool.length) return h+'<p class="empty">Nothing to show for this day at this scope.</p>';
  const venues=[...new Set(pool.map(f=>f.venue))].sort((a,b)=>a.localeCompare(b,'fi'));
  const t0=Math.floor(Math.min(...pool.map(f=>tm(f.start)))/60)*60;
  const t1=Math.ceil(Math.max(...pool.map(f=>tm(f.end)))/60)*60;
  const H=(t1-t0)*PXM;
  let lines='',labs='';
  for(let t=t0;t<=t1;t+=60){
    const y=(t-t0)*PXM;
    lines+=`<div class="hline" style="top:${y}px"></div>`;
    labs+=`<div class="tlab" style="top:${y}px">${String(Math.floor(t/60)).padStart(2,'0')}</div>`;
  }
  const cols=venues.map(v=>{
    const items=pool.filter(f=>f.venue===v);
    const blks=items.map(f=>{
      const on=picks.has(f.id), g=on?fl[f.id]:null;
      const bl=!on&&shortlist.has(f.film)?blockedBy(f):null;
      let c='blk';
      if(on&&g.cf) c+=' cf'; else if(hasTicket(f.id)) c+=' bt'; else if(on) c+=' pk'; else if(shortlist.has(f.film)) c+=' ll';
      if(bl&&!on) c+=' dd';
      if(soldOut(f.id)) c+=' so';
      if(!inScope(f)) c+=' gh';
      const top=(tm(f.start)-t0)*PXM;
      const hh=Math.max((f.duration?tm(f.end)-tm(f.start):30)*PXM,30);
      const t=`${f.title} \u00b7 ${f.start}\u2013${f.end} \u00b7 ${f.venue}`;
      return `<div class="${c}" style="top:${top}px;height:${hh-2}px" data-gpick="${f.id}" aria-label="${esc(t)}">
        <b>${esc(f.film)}</b><span>${f.start}\u2013${f.end}${ord(f)?' \u00b7 '+ord(f):''}${hasTicket(f.id)?' \u00b7 \u{1F3AB}':soldOut(f.id)?' \u00b7 SOLD OUT':''}</span></div>`;
    }).join('');
    return `<div class="gcol"><div class="ghead">${esc(v)}</div>
      <div class="gtrack" style="height:${H}px">${lines}${blks}</div></div>`;
  }).join('');
  h+=`<div class="gwrap"><div class="ginner">
    <div class="gutter"><div class="ghead"></div><div class="gtrack" style="height:${H}px">${labs}</div></div>
    ${cols}</div></div>`;
  const hidden=dayAll.length-pool.length;
  h+=`<p class="mt">${pool.length} screening${pool.length===1?'':'s'} across ${venues.length} venue${venues.length===1?'':'s'}${hidden>0?` \u00b7 ${hidden} hidden by scope or filters`:''}.</p>`;
  return h;
}

function vMine(){
  const fl=pickFlags();
  const it=[...picks].map(get).filter(Boolean).sort((a,b)=>a.dateKey-b.dateKey||tm(a.start)-tm(b.start));
  if(!it.length) return '<p class="empty">No picks yet.</p>';
  const days=[...new Set(it.map(f=>f.dateKey))].sort((a,b)=>a-b);
  let h='';
  days.forEach(dk=>{
    const d=it.filter(f=>f.dateKey===dk);
    h+=`<p class="dayh">${d[0].dateLabel} \u2014 ${d.length} film${d.length>1?'s':''}</p>`;
    d.forEach((f,i)=>{
      h+=rowHtml(f,fl);
      const m=meta(f.film);
      if(m.x) h+=`<p class="dsc" style="margin:-3px 0 7px 52px">${esc(m.x)}</p>`;
      if(i<d.length-1&&!overlaps(f,d[i+1])){
        const g=gapMin(f,d[i+1]);
        if(g!==null) h+=`<p class="mt" style="margin:-2px 0 6px 52px">${g} min gap${f.venue!==d[i+1].venue?' \u00b7 venue change':''}</p>`;
      }
    });
  });
  return h;
}

function shareBox(){
  const code=encodeState();
  const base=location.href.split('#')[0];
  const link=base+'#p='+code;
  const canLink = location.protocol.startsWith('http');
  // the fragment is portable between builds, so a friend can be sent the public one
  const pub = base.includes('/mine/') ? base.replace('/mine/','/') + '#p=' + code : null;
  return `<div class="bn">
    ${canLink?`<p class="mt" style="margin:0 0 4px"><b>Link to "${esc(active)}".</b> Send it to your own phone or to a friend \u2014 it is the same thing either way. It carries this shortlist, these picks and these sold-out marks. Opening it saves the plan by name: same name replaces, a new name is kept alongside.</p>
    <div class="ctrl" style="margin:0 0 8px"><input type="text" id="shareLink" value="${esc(link)}" readonly>
    <button class="pill" id="copyLink">Copy link</button></div>
    ${pub?`<p class="mt" style="margin:0 0 4px"><b>Same plan, public page.</b> Use this one for friends so they land on the shared version rather than yours.</p>
    <div class="ctrl" style="margin:0 0 8px"><input type="text" id="pubLink" value="${esc(pub)}" readonly>
    <button class="pill" id="copyPub">Copy link</button></div>`:''}`
    :`<p class="mt" style="margin:0 0 6px">This copy is opened as a local file, so a link won't work. Use the code below.</p>`}
    <p class="mt" style="margin:0 0 4px">Or paste a code \u2014 it is saved as a separate plan, not merged into this one:</p>
    <textarea id="shareTa">${esc(code)}</textarea>
    <div class="ctrl" style="margin:6px 0 0"><button class="pill" id="loadShare">Load pasted code</button>
    <button class="pill" id="closeShare">Close</button></div></div>`;
}

function render(){
  if(!ready) return;
  document.getElementById('sub').innerHTML =
    `${FEST.sub?esc(FEST.sub)+' \u00b7 ':''}${ALL_FILMS.length} films \u00b7 ${S.length} screenings${FEST.link?` \u00b7 <a href="${FEST.link}" target="_blank" rel="noopener">official schedule</a>`:''}`;
  document.getElementById('foot').textContent = FEST.src ||
    'Your shortlist, picks and notes are saved in your own browser only.';
  const sel=document.getElementById('preset');
  if(sel && !sel.options.length) sel.innerHTML=`<option value="antti">${PRESET_NAME} \u2014 shortlist ${PRESET.length} films</option>
    <option value="blank">Empty \u2014 shortlist nothing, add as you browse</option>`;
  const ss=document.getElementById('storeMsg');
  if(ss) ss.innerHTML = storeOk===false
    ? '<span class="warnmsg">This browser is not saving your choices \u2014 copy the share code before you close the tab.</span>'
    : '<span class="okmsg">Saved in this browser</span>';
  hideTip();
  document.getElementById('fest').textContent = FEST.name || 'Festival planner';
  renderPlanBar();
  document.getElementById('info').innerHTML=infoBox();
  renderStats();
  const b=document.getElementById('body');
  try{
    b.innerHTML = view==='cat'?vCat():view==='film'?vFilm():view==='grid'?vGrid():vMine();
  }catch(err){
    console.error(err);
    b.innerHTML = `<div class="bn warn">Something went wrong drawing this view: ${esc(err.message)}.
      Your picks are safe \u2014 try another tab, or copy your plan from "Share / import a plan".</div>`;
    return;
  }

  b.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>togglePick(+el.dataset.pick)));
  b.querySelectorAll('[data-gpick]').forEach(el=>{
    const id=+el.dataset.gpick;
    el.addEventListener('click',()=>{ hideTip(); gridPick(id); });
    if(CAN_HOVER){
      el.addEventListener('mouseenter',ev=>showTip(get(id),ev));
      el.addEventListener('mousemove',ev=>showTip(get(id),ev));
      el.addEventListener('mouseleave',hideTip);
    }
  });
  document.querySelectorAll('[data-focus]').forEach(el=>el.addEventListener('click',()=>{
    const n=el.dataset.focus;
    setView('film'); query=n.toLowerCase(); theme=''; kw=''; country=''; lang=''; render();
  }));
  b.querySelectorAll('[data-short]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();toggleShort(el.dataset.short);}));
  b.querySelectorAll('[data-av]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();cycleAv(+el.dataset.av);}));
  b.querySelectorAll('[data-scope]').forEach(el=>el.addEventListener('click',()=>{
    gridScope=el.dataset.scope; touchedS.clear(); render();}));
  const gd=document.getElementById('gday');
  if(gd) gd.addEventListener('change',e=>{gridDay=+e.target.value; touchedS.clear(); render();});
  const step=d=>{
    const i=DAYS.findIndex(([k])=>k===gridDay)+d;
    if(i>=0&&i<DAYS.length){ gridDay=DAYS[i][0]; touchedS.clear(); render(); }
  };
  const pv=document.getElementById('prevDay'), nx=document.getElementById('nextDay');
  if(pv) pv.addEventListener('click',()=>step(-1));
  if(nx) nx.addEventListener('click',()=>step(1));
  const th=document.getElementById('theme');
  if(th) th.addEventListener('change',e=>{theme=e.target.value;render();});
  const kwe=document.getElementById('kw');
  if(kwe) kwe.addEventListener('change',e=>{kw=e.target.value;render();});
  const ce=document.getElementById('country');
  if(ce) ce.addEventListener('change',e=>{country=e.target.value;render();});
  const le=document.getElementById('lang');
  if(le) le.addEventListener('change',e=>{lang=e.target.value;render();});
  const cfb=document.getElementById('clearFilters');
  if(cfb) cfb.addEventListener('click',()=>{theme='';kw='';country='';lang='';availOnly=false;render();});
  const aob=document.getElementById('availOnly');
  if(aob) aob.addEventListener('click',()=>{availOnly=!availOnly;touchedS.clear();touchedF.clear();render();});
  const oi=document.getElementById('onlyIn');
  if(oi) oi.addEventListener('click',()=>{catOnlyIn=!catOnlyIn; touchedF.clear(); render();});
  const ca=document.getElementById('clearAll');
  if(ca) ca.addEventListener('click',()=>{shortlist.clear();picks.clear();persist();render();});
  const q=document.getElementById('q');
  if(q) q.addEventListener('input',e=>{
    query=e.target.value.trim().toLowerCase(); render();
    const n=document.getElementById('q');
    if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); }
  });
}

function setView(v){
  view=v;
  document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('active', x.dataset.v===v));
}
document.querySelectorAll('.tb').forEach(t=>t.addEventListener('click',()=>{
  setView(t.dataset.v); query=''; theme=''; kw=''; country=''; lang=''; availOnly=false; touchedS.clear(); touchedF.clear(); render();
}));
const apBtn=document.getElementById('applyPreset');
if(apBtn) apBtn.addEventListener('click',()=>{
  const v=document.getElementById('preset').value;
  const next = v==='antti'?new Set(PRESET):new Set();
  const lose=[...picks].filter(id=>{const f=get(id); return !f||!next.has(f.film);}).length;
  if(lose && !confirm(`Loading this shortlist drops ${lose} time${lose>1?'s':''} you have already picked. Continue?`)) return;
  shortlist = next;
  [...picks].forEach(id=>{const f=get(id); if(!f||!shortlist.has(f.film)) picks.delete(id);});
  persist(); render();
});
const sbx=document.getElementById('shareBox');
document.getElementById('shareBtn').addEventListener('click',()=>{
  if(sbx.style.display==='none'){
    sbx.style.display='block'; sbx.innerHTML=shareBox();
    document.getElementById('closeShare').addEventListener('click',()=>{sbx.style.display='none';sbx.innerHTML='';});
    const copy=async(btn,inpId)=>{
      const inp=document.getElementById(inpId);
      try{ await navigator.clipboard.writeText(inp.value); btn.textContent='Copied'; }
      catch(e){ inp.select(); btn.textContent='Press \u2318/Ctrl+C'; }
      setTimeout(()=>{btn.textContent='Copy link';},2500);
    };
    const cl=document.getElementById('copyLink');
    if(cl) cl.addEventListener('click',()=>copy(cl,'shareLink'));
    const cp=document.getElementById('copyPub');
    if(cp) cp.addEventListener('click',()=>copy(cp,'pubLink'));
    document.getElementById('loadShare').addEventListener('click',()=>{
      try{
        const inc=decodeState(document.getElementById('shareTa').value);
        if(importPlan(inc)){ sbx.style.display='none'; sbx.innerHTML=''; render(); }
      }catch(e){ alert('That code could not be read. Paste the whole thing, with no line breaks.'); }
    });
  } else { sbx.style.display='none'; sbx.innerHTML=''; }
});
window.addEventListener('scroll',hideTip,{passive:true});
load();

</script>
