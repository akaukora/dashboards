<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Violent and protected world</title>
<meta name="description" content="Two world maps drawn only from data: lethal organized violence 1989–2025, and protected areas as of 2026. No basemap underneath.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Spectral:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#ffffff; --ink:#101010; --body:#4e4e4e; --faint:#8c8c8c; --rule:#e4e1da;
    --ui:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
    --text:Spectral,"Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--ui);
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden;
  }

  header{flex:0 0 auto;display:flex;align-items:center;gap:14px;
         padding:11px 22px;border-bottom:1px solid var(--rule)}

  .plate{position:absolute;top:26px;left:26px;z-index:2;pointer-events:none;max-width:52ch}
  .plate h1{font-family:var(--text);font-weight:300;font-size:clamp(23px,3.1vw,40px);
            line-height:1.1;letter-spacing:.005em;margin:0 0 10px;color:var(--ink)}
  .caption{font-family:var(--text);font-size:clamp(13px,1.15vw,15px);line-height:1.55;
           color:var(--body);max-width:46ch;margin:0;font-weight:300}

  .switch{display:flex;gap:2px;flex:0 0 auto}
  .switch button{
    font:inherit;font-size:13px;background:none;border:1px solid transparent;
    color:var(--faint);padding:4px 10px;cursor:pointer;line-height:1.3;
  }
  .switch button:hover{color:var(--ink)}
  .switch button[aria-pressed="true"]{color:var(--bg);background:var(--ink)}
  .icon{
    margin-left:auto;font:inherit;font-size:13px;width:28px;height:28px;flex:0 0 auto;cursor:pointer;
    background:none;border:1px solid var(--rule);color:var(--body);border-radius:50%;
  }
  .icon:hover{border-color:var(--ink);color:var(--ink)}
  button:focus-visible,summary:focus-visible{outline:2px solid #c73a28;outline-offset:2px}

  #stage{flex:1 1 auto;position:relative;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;
         transition:opacity .35s ease;}
  canvas[data-hidden="true"]{opacity:0}

  #read{
    position:absolute;right:22px;bottom:22px;z-index:3;width:270px;
    background:var(--bg);border:1px solid var(--rule);padding:13px 15px;
    opacity:0;transition:opacity .18s ease;pointer-events:none;
  }
  #read[data-on="true"]{opacity:1}
  #read h3{font-family:var(--text);font-weight:400;font-size:16px;margin:0 0 2px;color:var(--ink)}
  #read .sum{font-size:11.5px;color:var(--body);margin:0 0 10px;line-height:1.5}
  #read .bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center}
  #read .bars span{font-size:10px;color:var(--faint);white-space:nowrap}
  #read .bars span.v{color:var(--body);text-align:right;font-variant-numeric:tabular-nums}
  #read .bars i{display:block;height:6px;min-width:1px}
  .hint{position:absolute;right:22px;bottom:22px;z-index:2;font-size:11px;color:var(--faint);
        transition:opacity .18s ease}
  .hint[data-off="true"]{opacity:0}

  footer{flex:0 0 auto;padding:0 22px 16px;font-size:11px;color:var(--faint);line-height:1.5}
  footer summary{cursor:pointer;color:var(--faint);list-style:none}
  footer summary::-webkit-details-marker{display:none}
  footer summary::after{content:" ▸";font-size:9px}
  footer details[open] summary::after{content:" ▾"}
  footer .full{margin-top:6px;max-width:100ch}
  footer a{color:inherit}

  /* info panel */
  #info{
    position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);
    background:var(--bg);border-left:1px solid var(--rule);
    padding:22px;overflow-y:auto;z-index:4;
    transform:translateX(100%);transition:transform .3s ease;
  }
  #info[data-open="true"]{transform:none}
  #info h2{font-family:var(--text);font-size:19px;font-weight:400;margin:0 0 12px}
  #info .lead{font-family:var(--text);font-weight:300;font-size:15.5px;line-height:1.7;
              color:var(--ink);margin:0 0 20px}
  #info .method{font-family:var(--ui);font-size:11.5px;line-height:1.65;
                color:var(--faint);margin:0 0 12px}
  #info .method b{color:var(--body);font-weight:500}
  #info .close{position:absolute;top:16px;right:16px}
  .key{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;margin:0 0 16px}
  .key i{display:block;border-radius:1px}
  .key span{font-size:12px;color:var(--body)}

  @media (prefers-reduced-motion:reduce){canvas,#info{transition:none}}
  @media (max-width:720px){
    #read{right:12px;bottom:12px;left:12px;width:auto}
    .hint{display:none}
    header{padding:9px 16px}
    .plate{top:16px;left:16px;right:16px;max-width:none}
    .plate h1{font-size:22px;margin-bottom:7px}
    .caption{font-size:13px}
    footer{padding:0 16px 14px}
  }
</style>
</head>
<body>

<header>
  <div class="switch" role="group" aria-label="Choose a map">
    <button id="bViolence" aria-pressed="true">Violent world</button>
    <button id="bProtected" aria-pressed="false">Protected world</button>
  </div>
  <button class="icon" id="bInfo" aria-label="About these maps">i</button>
</header>

<div id="stage">
  <canvas id="cV"></canvas>
  <canvas id="cP" data-hidden="true"></canvas>

  <div id="read" data-on="false">
    <h3 id="rName"></h3>
    <p class="sum" id="rSum"></p>
    <div class="bars" id="rBars"></div>
  </div>
  <p class="hint" id="hint">Point anywhere on the map</p>

  <div class="plate">
    <h1 id="plateTitle"></h1>
    <p class="caption" id="caption"></p>
  </div>

  <aside id="info" data-open="false" aria-hidden="true">
    <button class="icon close" id="bClose" aria-label="Close">×</button>
    <h2 id="infoTitle"></h2>
    <div class="key" id="key"></div>
    <p class="lead" id="infoBody"></p>
    <p class="method" id="infoMethod"></p>
  </aside>
</div>

<footer>
  <details>
    <summary id="credit"></summary>
    <div class="full" id="creditFull"></div>
  </details>
</footer>

/* ---------- decode ---------- */
function unpack(block) {
  const bin = atob(block.b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const n = block.n;
  return {
    n,
    lon: new Uint16Array(bytes.buffer, 0, n),
    lat: new Uint16Array(bytes.buffer, 2 * n, n),
    cls: new Uint8Array(bytes.buffer, 4 * n, n),
    sea: new Uint8Array(bytes.buffer, 5 * n, n),
    cty: new Uint16Array(bytes.buffer, 6 * n, n),
    names: block.names
  };
}
const SETS = {
  violence: unpack(DATA.violence),
  protected: unpack(DATA.protected)
};

const COPY = {
  violence: {
    label: 'Violent world',
    caption: 'Every square is a place where someone was killed in organized violence between 1989 and 2025.',
    title: 'Violent world',
    key: ['0', '1–9', '10–99', '100–999', '1 000–9 999', '10 000 or more'],
    keyNote: 'deaths recorded in one square',
    body: 'The map of the world, drawn with violence. Over 37 years, 355 217 recorded events and 2 954 934 deaths. With no underlying map image, drawn purely in coordinate-based squares, each colored by the number of deaths from organized violence, the shape of the world is unfortunately easy to make out. Violence paints a depressing picture of our world.',
    method: '<b>UCDP Georeferenced Event Dataset v26.1.</b> The Uppsala Conflict Data Program, at Uppsala University, has recorded organized violence since 1979 and is the longest-running such effort; its georeferenced dataset tags each lethal event with coordinates and a date. The map divides the world into a grid of half-degree squares, each colored in intensity by the deaths recorded there between 1989 and 2025. Only events located to district precision or better are included: 355 217 of 417 968.',
    credit: 'UCDP GED v26.1',
    full: 'Shawn Davies, Therése Pettersson, Magnus Öberg, <i>Organized violence 1989–2025, and violent political protests</i>, Journal of Peace Research, 2026. Sundberg, Ralph and Erik Melander (2013) <i>Introducing the UCDP Georeferenced Event Dataset</i>, Journal of Peace Research 50(4). UCDP is part of and funded by DEMSCORE, national research infrastructure grant 2021-00162 from the Swedish Research Council.'
  },
  protected: {
    label: 'Protected world',
    caption: 'Every square is a place set aside for nature, as of September 2026.',
    title: 'Protected world',
    key: ['under 1', '1–10', '10–100', '100–1 000', '1 000–10 000', '10 000 or more'],
    keyNote: 'km² protected in one square — green on land, blue at sea',
    body: 'The map of the world, drawn with protected areas. 262 050 areas set aside for nature, across 272 countries and territories. The same planet, same coordinate squares, but environmental protection draws a fuller map than violence does. Violence dominates our news, but there exists a more hopeful, more optimistic view of the world.',
    method: '<b>World Database on Protected Areas, September 2026 release.</b> Compiled by UNEP-WCMC and IUCN from government and other authoritative sources, and republished monthly. Each site is reduced to one point inside its boundary, and the same half-degree grid is colored by the total protected km² whose center falls in each square. Lived-in landscapes (IUCN category V — farmed and inhabited country) are left out. Because a large site counts entirely in one square, this shows protected area per square rather than protected coverage, and overlapping designations are summed.',
    credit: 'WDPA, September 2026',
    full: 'UNEP-WCMC and IUCN (2026), Protected Planet: The World Database on Protected Areas (WDPA) and World Database on Other Effective Area-based Conservation Measures (WD-OECM) [Online], September 2026, Cambridge, UK: UNEP-WCMC and IUCN. Available at <a href="https://www.protectedplanet.net">www.protectedplanet.net</a>.'
  }
};

/* ---------- draw ---------- */
const cv = { violence: document.getElementById('cV'), protected: document.getElementById('cP') };
const [LO0, LO1, LA0, LA1] = DATA.frame;
const LON_SPAN = LO1 - LO0, LAT_SPAN = LA1 - LA0, G = DATA.grid;

let current = 'violence';
function paint(which) {
  const c = cv[which], set = SETS[which];
  const r = c.parentElement.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.max(1, Math.round(r.width * dpr));
  c.height = Math.max(1, Math.round(r.height * dpr));
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);

  // keep the artwork clear of the title plate rather than running under it
  const plate = document.querySelector('.plate');
  const padTop = (plate ? plate.getBoundingClientRect().height : 0) + 34;
  const pad = 16;
  const w = r.width - pad * 2, h = r.height - padTop - pad;
  const s = Math.min(w / LON_SPAN, h / LAT_SPAN);
  const ox = pad + (w - LON_SPAN * s) / 2, oy = padTop + (h - LAT_SPAN * s) / 2;
  if (which === current) view = { s, ox, oy };
  const pitch = G * s;

  // quiet classes first so the loud ones sit on top
  for (let k = 0; k < 6; k++) {
    const side = Math.max(1.1, pitch * DATA.sideStep[k]);
    for (let i = 0; i < set.n; i++) {
      if (set.cls[i] !== k) continue;
      const lo = LO0 + set.lon[i] * G + G / 2, la = LA0 + set.lat[i] * G + G / 2;
      ctx.fillStyle = which === 'violence' ? DATA.red[k]
                    : (set.sea[i] ? DATA.blue[k] : DATA.green[k]);
      ctx.fillRect(ox + (lo - LO0) * s - side / 2,
                   oy + (LA1 - la) * s - side / 2, side, side);
    }
  }
}

/* ---------- hover: summarize the country the square belongs to ---------- */
const INDEX = {};           // which cell sits at each grid position
for (const which of ['violence', 'protected']) {
  const set = SETS[which], m = new Map();
  for (let i = 0; i < set.n; i++) m.set(set.lat[i] * 4096 + set.lon[i], i);
  INDEX[which] = m;
}
let view = { s: 1, ox: 0, oy: 0 };

function nearestCell(which, px, py) {
  const set = SETS[which], m = INDEX[which];
  const lo = LO0 + (px - view.ox) / view.s, la = LA1 - (py - view.oy) / view.s;
  const gx = Math.floor((lo - LO0) / G), gy = Math.floor((la - LA0) / G);
  for (let r = 0; r <= 6; r++) {                    // widen the net up to 3°
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (r && Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const i = m.get((gy + dy) * 4096 + (gx + dx));
        if (i !== undefined) return i;
      }
    }
  }
  return -1;
}

const read = document.getElementById('read'), hint = document.getElementById('hint');
function summarize(which, i) {
  if (i < 0) { read.dataset.on = 'false'; hint.dataset.off = 'false'; return; }
  const set = SETS[which];
  const name = set.names[set.cty[i]];
  const stats = which === 'violence' ? DATA.vStats[name] : DATA.pStats[name];
  if (!stats) { read.dataset.on = 'false'; return; }
  const bands = which === 'violence' ? DATA.vBands : DATA.pBands;
  const nf = n => n.toLocaleString('en-US').replace(/,/g, ' ');

  document.getElementById('rName').textContent = name;
  document.getElementById('rSum').textContent = which === 'violence'
    ? `${nf(stats.d)} deaths in ${nf(stats.e)} events. Worst year ${stats.peak}.`
    : `${nf(stats.s)} protected areas, ${nf(stats.a)} km². ${
        stats.sea ? nf(stats.sea) + ' mostly at sea.' : 'All on land.'}`;

  const max = Math.max(...stats.dec, 1);
  const bars = document.getElementById('rBars');
  bars.innerHTML = '';
  stats.dec.forEach((v, k) => {
    const lab = document.createElement('span'); lab.textContent = bands[k];
    const track = document.createElement('div');
    const bar = document.createElement('i');
    bar.style.width = (v / max * 100).toFixed(1) + '%';
    bar.style.background = which === 'violence' ? DATA.red[3] : DATA.green[3];
    track.appendChild(bar);
    const num = document.createElement('span'); num.className = 'v'; num.textContent = nf(v);
    bars.append(lab, track, num);
  });
  read.dataset.on = 'true';
  hint.dataset.off = 'true';
}

/* ---------- state ---------- */
function show(which) {
  current = which;
  const t = COPY[which];
  document.getElementById('plateTitle').textContent = t.title;
  document.getElementById('caption').innerHTML = t.caption;
  document.getElementById('infoTitle').textContent = t.title;
  document.getElementById('infoBody').textContent = t.body;
  document.getElementById('infoMethod').innerHTML = t.method;
  document.getElementById('credit').textContent = t.credit;
  document.getElementById('creditFull').innerHTML = t.full;
  document.getElementById('bViolence').setAttribute('aria-pressed', which === 'violence');
  document.getElementById('bProtected').setAttribute('aria-pressed', which === 'protected');
  paint(which);
  cv.violence.dataset.hidden = which !== 'violence';
  cv.protected.dataset.hidden = which !== 'protected';

  const key = document.getElementById('key');
  key.innerHTML = '';
  t.key.forEach((cap, k) => {
    const side = 7 + k * 2.6;
    const sw = document.createElement('i');
    sw.style.cssText = `width:${side}px;height:${side}px;margin:${(23 - side) / 2}px auto;background:${
      which === 'violence' ? DATA.red[k] : DATA.green[k]};`;
    const lab = document.createElement('span');
    lab.textContent = cap;
    key.append(sw, lab);
  });
  const note = document.createElement('span');
  note.style.cssText = 'grid-column:1/-1;color:#8c8c8c;font-size:11px';
  note.textContent = t.keyNote;
  key.append(note);
  read.dataset.on = 'false'; hint.dataset.off = 'false';   // old country, other dataset
  if (typeof repaint === 'function') requestAnimationFrame(repaint);
}

document.getElementById('bViolence').onclick = () => show('violence');
document.getElementById('bProtected').onclick = () => show('protected');
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') show('violence');
  if (e.key === 'ArrowRight') show('protected');
  if (e.key === 'Escape') setInfo(false);
});

const info = document.getElementById('info');
function setInfo(open) {
  info.dataset.open = open;
  info.setAttribute('aria-hidden', !open);
}
document.getElementById('bInfo').onclick = () => setInfo(info.dataset.open !== 'true');
document.getElementById('bClose').onclick = () => setInfo(false);

const stage = document.getElementById('stage');
let hoverRaf = 0, lastPt = null;
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  lastPt = { x: e.clientX - r.left, y: e.clientY - r.top };
  if (!hoverRaf) hoverRaf = requestAnimationFrame(() => {
    hoverRaf = 0;
    summarize(current, nearestCell(current, lastPt.x, lastPt.y));
  });
});
stage.addEventListener('pointerleave', () => {
  read.dataset.on = 'false'; hint.dataset.off = 'false';
});

let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(repaint, 120);
});

function repaint() { paint('violence'); paint('protected'); }
show('violence'); repaint();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(repaint);
</script>
