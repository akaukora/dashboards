    // ===== Persist the TASKS.md file handle across sessions (IndexedDB) =====
    // The File System Access API lets us re-use a previously-picked file handle,
    // so the dashboard can re-open the same TASKS.md without navigating the file
    // picker every time. Browsers still require a single click to re-grant
    // permission after a full page reload, so on startup we either auto-load
    // (permission already granted) or show a one-click "Open <file>" button.
    const IDB_NAME = 'task-timeline';
    const IDB_STORE = 'handles';
    function idbOpen() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbSet(key, val) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function idbGet(key) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const r = tx.objectStore(IDB_STORE).get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';

    }

    function parseMemoryMarkdown(content) {
      const parsed = {
        title: '',
        fields: {},
        sections: {},
        tables: [],
        rawContent: content
      };

      const lines = content.split('\n');
      let currentSection = '_intro';
      parsed.sections[currentSection] = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];

        if (line.match(/^# /)) {
          parsed.title = line.replace(/^# /, '').trim();
          continue;
        }

        if (line.match(/^## /)) {
          currentSection = line.replace(/^## /, '').trim();
          parsed.sections[currentSection] = [];
          continue;
        }

        const kvMatch = line.match(/^\*\*(.+?):\*\*\s*(.*)$/);
        if (kvMatch) {
          parsed.fields[kvMatch[1]] = kvMatch[2];
          continue;
        }

        parsed.sections[currentSection].push(line);
      }

      for (const key in parsed.sections) {
        parsed.sections[key] = parsed.sections[key].join('\n').trim();
      }

      const tableRegex = /\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)+)/g;
      let match;
      while ((match = tableRegex.exec(content)) !== null) {
        const headers = match[1].split('|').map(h => h.trim()).filter(h => h);
        const rowLines = match[2].trim().split('\n');
        const rows = rowLines.map(row => row.split('|').map(c => c.trim()).filter(c => c));
        parsed.tables.push({ headers, rows });
      }

      return parsed;
    }

    function getPreview(content, maxLength = 150) {
      let preview = content
        .replace(/^#+ .+$/gm, '')
        .replace(/\*\*(.+?):\*\*.*/g, '')
        .replace(/\|.+\|/g, '')
        .replace(/[-=]{3,}/g, '')
        .trim()
        .substring(0, maxLength);
      if (content.length > maxLength) preview += '...';
      return preview;
    }

    function getDisplayName(filename) {
      return filename
        .replace('.md', '')
        .split(/[-_]/)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1))
        .join(' ');
    }

    async function loadMemoryDirectory() {
      if (typeof window.showDirectoryPicker !== 'function') { showStatus("This browser can't open local folders — use Chrome or Edge"); return; }
      try {
        memoryDirHandle = await window.showDirectoryPicker();

        memoryData = { claudeMd: null, memoryFiles: [], memoryDirs: {} };

        try {
          const claudeFileHandle = await memoryDirHandle.getFileHandle('CLAUDE.md');
          const file = await claudeFileHandle.getFile();
          memoryData.claudeMd = { content: await file.text(), fileHandle: claudeFileHandle };
        } catch (e) { console.log('No CLAUDE.md found'); }

        try {
          const memoryDir = await memoryDirHandle.getDirectoryHandle('memory');
          for await (const entry of memoryDir.values()) {
            if (entry.kind === 'file' && entry.name.endsWith('.md')) {
              const file = await entry.getFile();
              const content = await file.text();
              memoryData.memoryFiles.push({
                name: entry.name,
                content,
                fileHandle: entry
              });
              if (entry.name === 'timeline-categories.md') {
                loadCategoryConfig(content);
              }
            } else if (entry.kind === 'directory') {
              memoryData.memoryDirs[entry.name] = [];
              const subDirHandle = entry;
              for await (const subEntry of subDirHandle.values()) {
                if (subEntry.kind === 'file' && subEntry.name.endsWith('.md')) {
                  const file = await subEntry.getFile();
                  const content = await file.text();
                  memoryData.memoryDirs[entry.name].push({
                    name: subEntry.name,
                    content: content,
                    fileHandle: subEntry,
                    dirHandle: subDirHandle,
                    parsed: parseMemoryMarkdown(content)
                  });
                }
              }
            }
          }
        } catch (e) { console.log('No memory/ directory found'); }

        renderMemory();
        memoryEmptyState.style.display = 'none';
        memoryMainContent.style.display = 'flex';
        filePathEl.textContent = memoryDirHandle.name;
        showStatus('Loaded memory from ' + memoryDirHandle.name);

      } catch (e) {
        if (e.name !== 'AbortError') { showStatus('Error: ' + e.message); }
      }
    }

    function renderMemory() {
      renderMemoryTabs();
      renderMemoryContent();

    function renderMemoryTabs() {
      let html = '';

      if (memoryData.claudeMd) {
        html += `<button class="memory-tab active" data-tab="overview">Overview</button>`;
      }

      for (const file of memoryData.memoryFiles) {
        const name = file.name.replace('.md', '');
        html += `<button class="memory-tab${!memoryData.claudeMd && memoryData.memoryFiles[0] === file ? ' active' : ''}" data-tab="file-${name}">${name}</button>`;
      }

      for (const dirName of Object.keys(memoryData.memoryDirs).sort()) {
        const files = memoryData.memoryDirs[dirName];
        let count;
        if (dirName === 'context') {
          count = 0;

    function renderMemoryDirectoryFlat(dirName, files) {
      let html = `

      for (const file of files) {

        // Render fields as a key-value table
        const fieldEntries = Object.entries(p.fields);
        if (fieldEntries.length > 0) {
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><tbody>`;
          for (const [key, value] of fieldEntries) {
            html += `<tr data-search="${escapeHtml((key + ' ' + value).toLowerCase())}"><td>${escapeHtml(key)}</td><td>${escapeHtml(value)}</td></tr>`;
          }
          html += `</tbody></table></div>`;
        }

        // Render parsed tables (teams, tools, etc.) as proper HTML tables
        for (const table of p.tables) {
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><thead><tr>`;
          for (const h of table.headers) {
            html += `<th>${escapeHtml(h)}</th>`;
          }
          html += `</tr></thead><tbody>`;
          for (const row of table.rows) {
            const searchData = row.join(' ').toLowerCase();
            html += `<tr data-search="${escapeHtml(searchData)}">`;
            for (const cell of row) {
              html += `<td>${escapeHtml(cell)}</td>`;
            }
            html += `</tr>`;
          }
          html += `</tbody></table></div>`;
        }

        // Render non-table section content as list items
        for (const [sectionName, sectionContent] of Object.entries(p.sections)) {
          if (!sectionContent || sectionName === '_intro') continue;
          const lines = sectionContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('|'));
          if (lines.length === 0) continue;
          html += `<div class="file-card" style="margin-bottom: 16px;"><table class="memory-flat-table"><thead><tr><th colspan="2">${escapeHtml(sectionName)}</th></tr></thead><tbody>`;
          for (const line of lines) {
            const cleanLine = line.replace(/^[-*]\s*/, '').replace(/\*\*(.+?)\*\*/g, '$1').trim();
            if (!cleanLine) continue;
            html += `<tr data-search="${escapeHtml((sectionName + ' ' + cleanLine).toLowerCase())}"><td colspan="2">${escapeHtml(cleanLine)}</td></tr>`;
          }
          html += `</tbody></table></div>`;
        }
      }

      html += `</div>`;
      memoryContentContainer.innerHTML = html;
    }

    function filterMemoryDirectory(dirName, searchTerm) {
      const grid = document.getElementById('dirGrid');
      const items = grid.querySelectorAll('.memory-card, tr[data-search]');

    function renderMarkdownToHtml(md) {
      let html = escapeHtml(md);

      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/```[\s\S]*?```/g, match => {
        const code = match.replace(/```\w*\n?/g, '');
        return '<pre><code>' + code + '</code></pre>';
      });
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/(\|.+\|\n\|[-| ]+\|\n(?:\|.+\|\n?)+)/g, match => {
        const lines = match.trim().split('\n');
        const headers = lines[0].split('|').filter(c => c.trim());
        const rows = lines.slice(2).map(row => row.split('|').filter(c => c.trim()));
        let table = '<table><thead><tr>';
        headers.forEach(h => table += `<th>${h.trim()}</th>`);
        table += '</tr></thead><tbody>';
        rows.forEach(row => {
          table += '<tr>';
          row.forEach(cell => table += `<td>${cell.trim()}</td>`);
          table += '</tr>';
        });
        table += '</tbody></table>';
        return table;
      });
      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
      html = html.replace(/^(?!<[hupol]|<li|<table|<pre)(.+)$/gm, '<p>$1</p>');
      html = html.replace(/<p><\/p>/g, '');
      html = html.replace(/<p>\s*<\/p>/g, '');

      return html;
    }

    async function saveModal() {
      const type = modalOverlay.dataset.type;

      // Handle category manager save
      if (type === 'categoryManager') {
        applyCategoryManagerSave();
        closeModal();
        return;
      }

      // Handle vacation manager save
      if (type === 'vacationManager') {
        applyVacationManagerSave();
        closeModal();
        return;
      }

      // Handle task edit before reading editContent (which doesn't exist in this modal)
      if (type === 'taskEdit') {
        const taskId = modalOverlay.dataset.taskId;
        const fromSection = modalOverlay.dataset.fromSection;
        const list = tasks[fromSection] || [];
        const task = list.find(x => String(x.id) === taskId);
        if (!task) { closeModal(); return; }

        const newTitle = document.getElementById('taskEditTitle').value.trim();
        const newStartStr = document.getElementById('taskEditStart').value;
        const newEndStr   = document.getElementById('taskEditEnd').value;
        // Category: prefer the "new category" input if visible+nonempty, otherwise the select.
        // Skip the sentinel "__new__" value (means user opened "+ Add new" but didn't type anything).
        const _catNewEl = document.getElementById('taskEditCategoryNew');
        const _catSelEl = document.getElementById('taskEditCategory');
        let newCategory = '';
        if (_catNewEl && _catNewEl.style.display !== 'none' && _catNewEl.value.trim()) {
          newCategory = _catNewEl.value.trim();
        } else if (_catSelEl) {
          const v = _catSelEl.value;
          newCategory = (v && v !== '__new__') ? v : '';
        }
        let   newSection  = document.getElementById('taskEditSection').value;
        const newNote     = document.getElementById('taskEditNote').value;
        const newChecked  = document.getElementById('taskEditChecked').checked;
        const newSrcLabel = document.getElementById('taskEditSourceLabel').value.trim();
        const newSrcUrl   = document.getElementById('taskEditSourceUrl').value.trim();
        const newRepeat   = (document.getElementById('taskEditRepeat').value || '').trim() || null;

        if (newTitle) task.title = newTitle;
        task.startDate = newStartStr ? parseIsoDate(newStartStr) : null;
        task.endDate   = newEndStr   ? parseIsoDate(newEndStr)   : null;
        // If end < start, swap
        if (task.startDate && task.endDate && task.endDate < task.startDate) {
          const tmp = task.startDate;
          task.startDate = task.endDate;
          task.endDate = tmp;
        }
        task.category = newCategory || null;
        task.note = newNote;
        if (newSrcUrl) {
          task.sourceLink = { label: newSrcLabel || '🔗 link', url: newSrcUrl };
        } else {
          task.sourceLink = null;
        }
        task.repeat = newRepeat;

        // Bind section ↔ checked symmetrically:
        // - If the user CHECKED a previously-unchecked task and didn't move section → move it to Valmiit
        // - If the user UNCHECKED a previously-checked task and didn't move section → move it OUT of Valmiit (to first non-done section)
        // - If the user CHANGED section to Valmiit → also tick the box
        // - If the user CHANGED section AWAY from Valmiit → also untick the box
        const isDoneSection = (id) => {
          const s = sections.find(x => x.id === id);
          return s && /^(valmiit|done|completed)$/i.test(s.name);
        };
        const firstActiveSection = () => {
          const s = sections.find(x => !/^(valmiit|done|completed)$/i.test(x.name));
          return s ? s.id : sections[0].id;
        };
        const doneSectionId = () => {
          const s = sections.find(x => /^(valmiit|done|completed)$/i.test(x.name));
          return s ? s.id : null;
        };

        const wasChecked = task.checked;
        task.checked = newChecked;

        if (newSection === fromSection) {
          // User did NOT touch the section dropdown — let checkbox drive the section
          if (newChecked && !wasChecked) {
            const dst = doneSectionId();
            if (dst) newSection = dst;
          } else if (!newChecked && wasChecked) {
            // Unchecking a previously-checked task → move out of Valmiit
            if (isDoneSection(fromSection)) {
              newSection = firstActiveSection();
            }
          }
        } else {
          // User changed the section explicitly — sync checked to whatever the new section implies
          task.checked = isDoneSection(newSection);
        }

        // Move between sections if needed
        if (newSection && newSection !== fromSection) {
          const fromList = tasks[fromSection];
          const idx = fromList.indexOf(task);
          if (idx >= 0) fromList.splice(idx, 1);
          if (!tasks[newSection]) tasks[newSection] = [];
          tasks[newSection].push(task);
          task.section = newSection;
        }

        // If task was newly checked AND has a repeat cadence, materialize next instance
        if (newChecked && !wasChecked && task.repeat) {
          const created = createNextRepeatInstance(task);
          if (created) {
            const rangeStr = '[' + dateKey(created.startDate) + ' → ' + dateKey(created.endDate) + ']';
            try { showStatus(T('repeatCreatedNext', { title: created.title, range: rangeStr })); } catch {}
          }
        }

        closeModal();
        markChanged();
        renderTasks();
        return;
      }

      const content = document.getElementById('editContent').value;

      try {
        if (type === 'claudeMd') {
          memoryData.claudeMd.content = content;
          const writable = await memoryData.claudeMd.fileHandle.createWritable();
          await writable.write(content);
          await writable.close();
          showStatus('Saved CLAUDE.md');

        } else if (type === 'memoryFile') {
          const fileName = modalOverlay.dataset.fileName;
          const file = memoryData.memoryFiles.find(f => f.name === fileName);
          if (file) {
            file.content = content;
            const writable = await file.fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
            showStatus('Saved ' + fileName);
          }

        } else if (type === 'dirFile') {
          const dirName = modalOverlay.dataset.dirName;
          const fileName = modalOverlay.dataset.fileName;
          const files = memoryData.memoryDirs[dirName];
          const file = files.find(f => f.name === fileName);
          if (file) {
            file.content = content;
            file.parsed = parseMemoryMarkdown(content);
            const writable = await file.fileHandle.createWritable();
            await writable.write(content);
            await writable.close();
            showStatus('Saved ' + fileName);
          }

        } else if (type === 'newDirFile') {
          const dirName = modalOverlay.dataset.dirName;
          let fileName = document.getElementById('newFileName').value.trim();
          if (!fileName) { showStatus('Please enter a filename'); return; }
          if (!fileName.endsWith('.md')) fileName += '.md';

          const memoryDir = await memoryDirHandle.getDirectoryHandle('memory');
          const subDir = await memoryDir.getDirectoryHandle(dirName, { create: true });
          const fileHandle = await subDir.getFileHandle(fileName, { create: true });

          const writable = await fileHandle.createWritable();
          await writable.write(content);
          await writable.close();

          memoryData.memoryDirs[dirName].push({
            name: fileName,
            content: content,
            fileHandle: fileHandle,
            dirHandle: subDir,
            parsed: parseMemoryMarkdown(content)
          });

          showStatus('Created ' + fileName);
        }

        closeModal();
        renderMemory();

      } catch (e) {
        showStatus('Error saving: ' + e.message);
      }
    }

    // Load persisted timeline expanded/collapsed state at startup
    loadExpandedState();

    // Try to re-open the last-used TASKS.md (File System Access API + IndexedDB)

    // ============================================================
    // ===== DEMO MODE (?demo) =====

    function buildDemoTasksMd() {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      // Anchor = Monday of this week (next Monday at weekends, so "this week" is the working week ahead)
      const mon = new Date(today);
      if (mon.getDay() === 6 || mon.getDay() === 0) mon.setDate(mon.getDate() + (mon.getDay() === 6 ? 2 : 1));
      else mon.setDate(mon.getDate() - (mon.getDay() - 1));
      const d = (n) => { const r = new Date(mon); r.setDate(r.getDate() + n); return r; };
      const iso = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
      const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const dm = (x) => `${x.getDate()} ${MON[x.getMonth()]}`;
      const rng = (a, b) => `[${iso(a)} → ${iso(b)}]`;
      const weekday = (x) => { const r = new Date(x); const w = r.getDay();
        if (w === 6) r.setDate(r.getDate() - 1); if (w === 0) r.setDate(r.getDate() - 2); return r; };
      const minus = (x, n) => { const r = new Date(x); r.setDate(r.getDate() - n); return r; };
      const q = (x) => Math.floor(x.getMonth() / 3) + 1;
      const Y = today.getFullYear();
      const budgetYear = today.getMonth() >= 5 ? Y + 1 : Y;
      // previous quarter
      const prevQEnd = new Date(Y, Math.floor(today.getMonth() / 3) * 3, 0);
      const pq = q(prevQEnd), pqY = prevQEnd.getFullYear();
      const nextQ = q(today) % 4 + 1, nextQY = q(today) === 4 ? Y + 1 : Y;
      const halfLabel = today.getMonth() >= 6 ? `H1 ${Y}` : `H2 ${Y - 1}`;

      // Month-end close: deadline = 2nd working day of the following month
      const closeDeadline = (yy, mm) => { const r = new Date(yy, mm + 1, 1); let wd = 0;
        while (true) { const w = r.getDay(); if (w !== 0 && w !== 6) { wd++; if (wd === 2) return r; } r.setDate(r.getDate() + 1); } };
      const closes = [];
      for (let k = -2; k <= 3; k++) {
        const base = new Date(Y, today.getMonth() + k, 1);
        const end = closeDeadline(base.getFullYear(), base.getMonth());
        closes.push({ label: `${String(base.getMonth() + 1).padStart(2, '0')}/${base.getFullYear()}`, start: minus(end, 7), end });
      }
      const doneCloses = closes.filter(c => c.end < today).slice(-1);
      const openCloses = closes.filter(c => c.end >= today).slice(0, 3);
      const closeLine = (c, done) => `- [${done ? 'x' : ' '}] **Month-end close — ${c.label}** - ${rng(c.start, c.end)} \`MONTH-END\` monthly close (deadline 2nd working day)`;

      const board1 = d(16), board1Dl = d(9);
      const board2 = d(72), board2Dl = d(65);
      const fyEnd = weekday(d(170));

      return `# Tasks

## Urgent
- [ ] **Correct the Q${pq} VAT figure** - ${rng(d(-7), d(-3))} \`AD HOC\` Sam spotted a mismatch in the reconciliation. "Could you correct the Q${pq} VAT figure before ${DOW[d(-3).getDay()]}?" [📧 Sam ${dm(d(-7))}](https://example.com/mail/vat)

## Not started
- [ ] **Board meeting ${dm(board1)} — materials** - ${rng(d(2), board1Dl)} \`BOARD\` Materials deadline ${DOW[board1Dl.getDay()]} ${dm(board1Dl)} (one week before the meeting).
- [ ] **Board meeting ${dm(board2)} — materials** - ${rng(d(58), board2Dl)} \`BOARD\` Materials deadline ${DOW[board2Dl.getDay()]} ${dm(board2Dl)}.
- [ ] **Budget ${budgetYear} — first draft** - ${rng(d(7), d(18))} \`BUDGET\` Consolidate department inputs into one model.
- [ ] **Budget ${budgetYear} — review with CFO** - ${rng(d(21), d(25))} \`BUDGET\`
- [ ] **Budget ${budgetYear} — final version to the board** - ${rng(d(28), d(39))} \`BUDGET\`
${openCloses.map(c => closeLine(c, false)).join('\n')}
- [ ] **Lender covenant report Q${pq} ${pqY}** - ${rng(d(14), d(25))} \`LENDERS\` Quarterly compliance certificate to the bank.
- [ ] **Lender covenant report FY ${fyEnd.getFullYear() - 1}** - ${rng(d(130), fyEnd)} \`LENDERS\` [↻ annual] Audited figures + compliance certificate, 90 days after year end.
- [ ] **Industry rent survey Q${nextQ} ${nextQY}** - ${rng(d(50), d(60))} \`SURVEYS\` [↻ quarterly] Submit rent levels to the industry benchmark.
- [ ] **Annual report ${d(158).getFullYear() - 1}** - ${rng(d(98), d(158))} \`REPORTING\` Financial statements, notes and management report.
  - [ ] [${iso(d(130))}] Draft to the auditors
  - [ ] [${iso(d(151))}] Board sign-off

## Active
- [ ] **Budget ${budgetYear} — collect department inputs** - ${rng(d(-14), d(4))} \`BUDGET\` Department heads enter their figures in the budgeting tool.
- [ ] **Cash-flow forecast refresh** - ${rng(d(-4), d(11))} \`REPORTING\` Update the 12-month forecast with last month's actuals.

## Waiting for others
- [ ] **Bank account for the new subsidiary** - ${rng(d(-25), d(4))} \`AD HOC\` Waiting for the bank's customer-due-diligence review.

## Some day
- [ ] **Automate the monthly KPI pack** - \`AD HOC\` Pull figures straight from the BI tool instead of copy-paste.

## Completed
- [x] **Budget ${budgetYear} — kickoff memo** - ${rng(d(-28), d(-24))} \`BUDGET\` Timetable and guidelines sent to department heads.
${doneCloses.map(c => closeLine(c, true)).join('\n')}
- [x] **Lender covenant report ${halfLabel}** - ${rng(d(-35), d(-10))} \`LENDERS\` Half-year compliance certificate.

<!-- DASHBOARD:VACATIONS
Holiday week | ${iso(d(21))} | ${iso(d(25))}
Winter break | ${iso(d(140))} | ${iso(d(144))}
-->
`;
    }

    async function loadDemoMemory() {
      // Works when served over http(s), e.g. GitHub Pages; skipped for file://.
      const base = new URL('../template/', location.href);
      const get = async (path) => { const r = await fetch(new URL(path, base)); if (!r.ok) throw new Error(path); return r.text(); };
      try {
        memoryData = { claudeMd: null, memoryFiles: [], memoryDirs: {} };
        memoryData.claudeMd = { content: await get('CLAUDE.md'), fileHandle: null };
        for (const f of ['glossary.md', 'recurring.md', 'timeline-categories.md', 'dismissed-suggestions.md']) {
          try { memoryData.memoryFiles.push({ name: f, content: await get('memory/' + f), fileHandle: null }); } catch {}
        }
        for (const [dir, files] of [['people', ['maria-lind.md']], ['projects', ['harbor.md']]]) {
          memoryData.memoryDirs[dir] = [];
          for (const f of files) {
            try { const content = await get(`memory/${dir}/${f}`);
              memoryData.memoryDirs[dir].push({ name: f, content, fileHandle: null, dirHandle: null, parsed: parseMemoryMarkdown(content) }); } catch {}
          }
        }
        renderMemory();
        memoryEmptyState.style.display = 'none';
        memoryMainContent.style.display = 'flex';
      } catch (e) {
        memoryData = { claudeMd: null, memoryFiles: [], memoryDirs: {} };
        console.log('Demo memory not available here:', e.message);
      }
    }

    async function loadDemo() {
      // Banner under the header
      const header = document.querySelector('header');
      header.insertAdjacentHTML('afterend', `
        <div class="demo-banner">
          <span class="demo-tag">Demo</span>
          <span>Fictional example tasks, dated around today. Try dragging bars, ticking tasks or switching views — edits stay in this tab and aren't saved.</span>
          <span class="spacer"></span>
          <a href="https://akaukora.github.io/dashboards/" target="_top" rel="noopener">More dashboards</a>
          <a href="${DEMO_REPO_URL}" target="_top" rel="noopener">Download from GitHub →</a>
        </div>`);
      loadCategoryConfig(DEMO_CATEGORIES);
      const content = buildDemoTasksMd();
      const result = parseTaskMarkdown(content);
      sections = result.sections;
      tasks = result.tasks;
      const parsedVac = parseVacationsFromMarkdown(content);
      if (parsedVac) vacations = parsedVac;   // not saved to this browser
      taskFileName = 'TASKS.md (demo)';
      filePathEl.textContent = 'example TASKS.md · demo';
      let storedZoom = null;
      try { storedZoom = localStorage.getItem('task-timeline:timeline-zoom'); } catch {}
      if (!storedZoom) timelineZoom = 'week';
      await loadDemoMemory();
      switchTaskView('timeline');
    }

    if (IS_DEMO) loadDemo(); else tryRestoreTaskFile();

    // Memory event listeners
    openMemoryBtn.addEventListener('click', loadMemoryDirectory);
    document.getElementById('openMemoryBtnLarge').addEventListener('click', loadMemoryDirectory);
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);
    document.getElementById('modalSave').addEventListener('click', saveModal);

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Expose functions to onclick handlers
    window.openFileModal = openFileModal;
    window.openNewFileModal = openNewFileModal;
    window.openEditModal = openEditModal;
    window.filterMemoryDirectory = filterMemoryDirectory;
  </script>
