    function createColumn(id, title, items) {
      const col = document.createElement('div');
      const sectSlug = (title || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      col.className = 'column sect-' + sectSlug;
      col.innerHTML = `
        <div class="column-header">
          <span class="column-title" data-section-id="${id}" style="cursor: pointer;">${title}</span>
          <span class="count">${items.length}</span>
        </div>
        <div class="cards" data-column="${id}"></div>
        <div class="add-card">
          <button data-add="${id}">+ Add task</button>
        </div>
      `;

      col.querySelector('.column-title').addEventListener('click', (e) => {
        if (!col.dragging) { startEditingColumnTitle(e.target, id); }
      });

      const header = col.querySelector('.column-header');
      header.draggable = true;

      header.addEventListener('dragstart', (e) => {
        e.stopPropagation();
        col.classList.add('dragging-column');
        e.dataTransfer.setData('text/column', id);
        e.dataTransfer.effectAllowed = 'move';
      });

      header.addEventListener('dragend', () => {
        col.classList.remove('dragging-column');
        board.querySelectorAll('.column-drop-indicator').forEach(el => el.remove());
      });

      col.addEventListener('dragover', (e) => {
        if (e.dataTransfer.types.includes('text/column')) {
          e.preventDefault();
          e.stopPropagation();
          board.querySelectorAll('.column-drop-indicator').forEach(el => el.remove());
          const indicator = document.createElement('div');
          indicator.className = 'column-drop-indicator';
          const rect = col.getBoundingClientRect();
          if (e.clientX < rect.left + rect.width / 2) { col.before(indicator); }
          else { col.after(indicator); }
        }
      });

      col.addEventListener('drop', (e) => {
        if (e.dataTransfer.types.includes('text/column')) {
          e.preventDefault();
          e.stopPropagation();
          const fromId = e.dataTransfer.getData('text/column');
          const toId = id;
          if (fromId !== toId) {
            const rect = col.getBoundingClientRect();
            const insertBefore = e.clientX < rect.left + rect.width / 2;
            moveSection(fromId, toId, insertBefore);
          }
          board.querySelectorAll('.column-drop-indicator').forEach(el => el.remove());
        }
      });

      const cardsContainer = col.querySelector('.cards');
      items.forEach(task => { cardsContainer.appendChild(createCard(task)); });

      const getDropPosition = (e) => {
        const allCards = [...cardsContainer.querySelectorAll('.task-card')];
        const visibleCards = allCards.filter(c => !c.classList.contains('dragging'));
        let insertBeforeCard = null;
        let dropIndex = visibleCards.length;
        for (let i = 0; i < visibleCards.length; i++) {
          const rect = visibleCards[i].getBoundingClientRect();
          if (e.clientY < rect.top + rect.height / 2) {
            insertBeforeCard = visibleCards[i];
            dropIndex = i;
            break;
          }
        }
        return { insertBeforeCard, dropIndex };
      };

      const showDropIndicator = (e) => {
        col.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        const { insertBeforeCard } = getDropPosition(e);
        const indicator = document.createElement('div');
        indicator.className = 'drop-indicator';
        indicator.style.cssText = 'height: 3px; background: var(--accent); border-radius: 2px; margin: 5px 0;';
        if (insertBeforeCard) { cardsContainer.insertBefore(indicator, insertBeforeCard); }
        else { cardsContainer.appendChild(indicator); }
      };

      col.addEventListener('dragover', (e) => {
        e.preventDefault();
        cardsContainer.classList.add('drag-over');
        showDropIndicator(e);
      });

      col.addEventListener('dragleave', (e) => {
        if (!col.contains(e.relatedTarget)) {
          cardsContainer.classList.remove('drag-over');
          col.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        }
      });

      col.addEventListener('drop', (e) => {
        e.preventDefault();
        cardsContainer.classList.remove('drag-over');
        col.querySelectorAll('.drop-indicator').forEach(el => el.remove());
        const taskId = parseFloat(e.dataTransfer.getData('text/plain'));
        const { dropIndex } = getDropPosition(e);
        moveTask(taskId, id, dropIndex);
      });

      col.querySelector(`[data-add="${id}"]`).addEventListener('click', () => {
        addNewTask(id, col.querySelector('.cards'));
      });

      return col;
    }

    function addNewTask(sectionId, container) {
      const existing = container.querySelector('.new-task-input');
      if (existing) return;

      const input = document.createElement('textarea');
      input.className = 'new-task-input';
      input.placeholder = 'What needs to be done?';
      input.rows = 2;
      container.appendChild(input);
      input.focus();

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const title = input.value.trim();
          if (title) {
            if (!tasks[sectionId]) tasks[sectionId] = [];
            tasks[sectionId].push({
              id: Date.now() + Math.random(),
              title,
              note: '',
              checked: false,
              subtasks: [],
              section: sectionId
            });
            markChanged();
            renderTasks();
          } else { input.remove(); }
        } else if (e.key === 'Escape') { input.remove(); }
      });

      input.addEventListener('blur', () => { setTimeout(() => input.remove(), 100); });
    }

    function moveSection(fromId, toId, insertBefore) {
      const fromIdx = sections.findIndex(s => s.id === fromId);
      const toIdx = sections.findIndex(s => s.id === toId);
      if (fromIdx === -1 || toIdx === -1) return;
      const [section] = sections.splice(fromIdx, 1);
      let newIdx = sections.findIndex(s => s.id === toId);
      if (!insertBefore) newIdx++;
      sections.splice(newIdx, 0, section);
      markChanged();
      renderTasks();
    }

    function moveTask(taskId, toSectionId, dropIndex = -1) {
      let task = null;
      for (const section of sections) {
        const sectionTasks = tasks[section.id] || [];
        const idx = sectionTasks.findIndex(t => t.id === taskId);
        if (idx !== -1) {
          task = sectionTasks.splice(idx, 1)[0];
          break;
        }
      }
      if (!task) return;
      task.section = toSectionId;
      if (!tasks[toSectionId]) tasks[toSectionId] = [];
      if (dropIndex >= 0 && dropIndex <= tasks[toSectionId].length) {
        tasks[toSectionId].splice(dropIndex, 0, task);
      } else {
        tasks[toSectionId].push(task);
      }
      markChanged();
      renderTasks();
    }

    function deleteTask(task) {
      if (!confirm(`Delete "${task.title}"?`)) return;
      for (const section of sections) {
        const sectionTasks = tasks[section.id] || [];
        const idx = sectionTasks.findIndex(t => t.id === task.id);
        if (idx !== -1) { sectionTasks.splice(idx, 1); break; }
      }
      markChanged();
      renderTasks();
    }

    let saveTimeout = null;
    let lastModified = 0;
    let watchInterval = null;
    let isSaving = false;

    function markChanged() {
      hasChanges = true;
      saveBtn.disabled = false;
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(autoSave, 500);
    }

    async function autoSave() {
      if (!taskFileHandle || !hasChanges || isSaving) return;
      isSaving = true;
      try {
        const writable = await taskFileHandle.createWritable();
        const content = toMarkdown();
        await writable.write(content);
        await writable.close();
        const file = await taskFileHandle.getFile();
        lastModified = file.lastModified;
        hasChanges = false;
        saveBtn.disabled = true;
        showStatus('Saved');
      } catch (e) {
        showStatus('Save failed: ' + e.message);
      }
      isSaving = false;
    }

    async function checkForExternalChanges() {
      if (!taskFileHandle || hasChanges || isSaving) return;
      try {
        const file = await taskFileHandle.getFile();
        if (file.lastModified > lastModified) {
          lastModified = file.lastModified;
          const content = await file.text();
          const result = parseTaskMarkdown(content);
          sections = result.sections;
          tasks = result.tasks;
          const parsedVac = parseVacationsFromMarkdown(content);
          if (parsedVac) { vacations = parsedVac; saveVacations(); }
          renderTasks();
          showStatus('Reloaded');
        }
      } catch (e) { console.log('Watch error:', e); }
    }

    function startWatching() {
      if (watchInterval) clearInterval(watchInterval);
      watchInterval = setInterval(checkForExternalChanges, 1000);
    }

    function stopWatching() {
      if (watchInterval) { clearInterval(watchInterval); watchInterval = null; }
    }

    function saveStatusFilter() {

    function dayWidthFor(zoom) {
      if (zoom === 'week') return 20;
      if (zoom === 'month') return 6;
      return 60; // day
    }
    function get_DAY_W() { return dayWidthFor(timelineZoom); }
    // Backwards-compat: many places reference DAY_W directly; we re-declare it as a let so we can update it.
    let DAY_W = dayWidthFor(timelineZoom);

    let categoryConfig = {};      // tag → { type: 'process'|'bag', label }
    let expandedCategories = {};  // tag → bool

    function loadCategoryConfig(content) {
      // Parse the YAML-like block out of memory/timeline-categories.md
      categoryConfig = {};
      const yamlMatch = content && content.match(/```yaml\s*([\s\S]*?)\s*```/);
      if (!yamlMatch) return;
      const yaml = yamlMatch[1];
      const blocks = yaml.split(/\n\s*-\s+tag:\s*/).slice(1);
      for (const b of blocks) {
        const tagMatch = b.match(/^"?([^"\n]+?)"?\s*\n/);
        const typeMatch = b.match(/\btype:\s*(process|bag)/);
        const labelMatch = b.match(/\blabel:\s*"([^"]+)"/);
        if (tagMatch) {
          const tag = tagMatch[1].trim();
          categoryConfig[tag] = {
            type: typeMatch ? typeMatch[1] : 'bag',
            label: labelMatch ? labelMatch[1] : tag
          };
        }
      }
    }

    function loadExpandedState() {

        const raw = localStorage.getItem('task-timeline:timeline-expanded');
        if (raw) expandedCategories = JSON.parse(raw);
      } catch {}

    function saveExpandedState() {
      try {
        localStorage.setItem('task-timeline:timeline-expanded', JSON.stringify(expandedCategories));
      } catch {}
    }

    function categoryDefaultsToExpanded(tag) {
      const cfg = categoryConfig[tag];
      return cfg && cfg.type === 'process';
    }

    function isCategoryExpanded(tag) {
      if (Object.prototype.hasOwnProperty.call(expandedCategories, tag)) {
        return expandedCategories[tag];
      }
      return categoryDefaultsToExpanded(tag);
    }

    function escHtml(s) {
      return (s || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
    }

    // Convert minimal markdown — currently just [text](url) — to safe HTML.
    // Everything else is escaped.
    function noteToHtml(s) {
      if (!s) return '';
      const LINK_RE = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
      let html = '';
      let last = 0;
      let m;
      while ((m = LINK_RE.exec(s)) !== null) {
        html += escHtml(s.slice(last, m.index));
        const label = escHtml(m[1]);
        const url = m[2].replace(/"/g, '%22');
        html += `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color: var(--accent); text-decoration: underline;" onclick="event.stopPropagation()">${label}</a>`;
        last = m.index + m[0].length;
      }
      html += escHtml(s.slice(last));
      return html;
    }

    // Find the first URL in a note (used to surface a primary link)
    function firstUrlInNote(s) {
      if (!s) return null;
      const m = s.match(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/);
      return m ? { label: m[1], url: m[2] } : null;
    }

    function categoryFor(item) {
      // Prefer explicit category. Otherwise infer from title prefix.
      if (item.task.category) return item.task.category;
      const t = item.task.title || '';
      // Untagged tasks default to AD HOC bucket
      return 'AD HOC';
    }

    // Shift a date by the cadence ('monthly', 'quarterly', 'annual'). Returns new Date.
    function shiftByCadence(d, cadence) {
      const r = new Date(d);
      if (cadence === 'monthly')    r.setMonth(r.getMonth() + 1);
      else if (cadence === 'quarterly') r.setMonth(r.getMonth() + 3);
      else if (cadence === 'annual')    r.setFullYear(r.getFullYear() + 1);
      return r;
    }
    // Shift end back to previous Friday if it lands on Sat/Sun; shift start by same delta.
    function applyWeekendRule(start, end) {
      const e = new Date(end);
      let shifted = 0;
      while (e.getDay() === 0 || e.getDay() === 6) {
        e.setDate(e.getDate() - 1);
        shifted++;
      }
      const s = new Date(start);
      s.setDate(s.getDate() - shifted);
      return { start: s, end: e };
    }
    // Smart title bumping: if title contains a 4-digit year matching the original end-year,
    // increment by 1 year. For quarterly/monthly cycles, look for /MM\/YYYY/ patterns too.
    function bumpTitleForRepeat(title, origEnd, cadence) {
      if (!title) return title;
      if (cadence === 'annual') {
        const y = origEnd.getFullYear();
        return title.replace(new RegExp('\\b' + y + '\\b'), String(y + 1));
      }
      if (cadence === 'monthly' || cadence === 'quarterly') {
        // Pattern: "MM/YYYY" → bump
        return title.replace(/(\d{2})\/(\d{4})/g, (m, mm, yyyy) => {
          const d = new Date(parseInt(yyyy), parseInt(mm) - 1, 1);
          const shifted = shiftByCadence(d, cadence);
          return String(shifted.getMonth() + 1).padStart(2, '0') + '/' + shifted.getFullYear();
        });
      }
      return title;
    }
    // Create the next instance of a repeating task. Returns the new task object, or null if can't.
    function createNextRepeatInstance(srcTask) {
      if (!srcTask.repeat || !srcTask.startDate || !srcTask.endDate) return null;
      // Skip if a next instance with the bumped title already exists somewhere
      const bumped = bumpTitleForRepeat(srcTask.title, srcTask.endDate, srcTask.repeat);
      const exists = sections.some(s =>
        (tasks[s.id] || []).some(t => t.title === bumped && t !== srcTask)
      );
      if (exists) return null;
      // Compute new dates
      let newStart = shiftByCadence(srcTask.startDate, srcTask.repeat);
      let newEnd   = shiftByCadence(srcTask.endDate,   srcTask.repeat);
      const adj = applyWeekendRule(newStart, newEnd);
      newStart = adj.start; newEnd = adj.end;
      // Drop into "Not started" section if present, else first non-done section
      const dst = sections.find(s => /^not started$/i.test(s.name))
               || sections.find(s => !/^(valmiit|done|completed)$/i.test(s.name))
               || sections[0];
      if (!dst) return null;
      const newTask = {
        id: Date.now() + Math.random(),
        title: bumped,
        note: srcTask.note,
        checked: false,
        subtasks: [],  // milestones don't copy — they're instance-specific
        section: dst.id,
        startDate: newStart,
        endDate: newEnd,
        category: srcTask.category,
        sourceLink: null,  // source email is for the old occurrence
        repeat: srcTask.repeat  // carry the repeat marker forward
      };
      if (!tasks[dst.id]) tasks[dst.id] = [];
      tasks[dst.id].push(newTask);
      return newTask;
    }

    // Build the {task, sectionId, sectionName} object that openTaskEditModal expects.
    function itemForTask(task) {
      const s = sections.find(x => x.id === task.section);
      return {
        task,
        sectionId: task.section,
        sectionName: s ? s.name : ''
      };
    }

    // When a checkbox toggles, mirror to section (and vice versa).
    // - Checking a non-done task → move to Valmiit AND materialize next repeat instance if applicable
    // - Unchecking a done task → move out of Valmiit (to first non-done section)
    function syncCheckedToSection(task) {
      const fromSection = task.section;
      const doneSection = sections.find(s => /^(valmiit|done|completed)$/i.test(s.name));
      const isDone = (id) => {
        const s = sections.find(x => x.id === id);
        return s && /^(valmiit|done|completed)$/i.test(s.name);
      };
      const firstActive = sections.find(s => !/^(valmiit|done|completed)$/i.test(s.name));

      let target = null;
      const wasJustChecked = task.checked && !isDone(fromSection);
      if (task.checked && !isDone(fromSection) && doneSection) {
        target = doneSection.id;
      } else if (!task.checked && isDone(fromSection) && firstActive) {
        target = firstActive.id;
      }
      if (target && target !== fromSection) {
        const list = tasks[fromSection];
        const idx = list.indexOf(task);
        if (idx >= 0) list.splice(idx, 1);
        if (!tasks[target]) tasks[target] = [];
        tasks[target].push(task);
        task.section = target;
      }
      // If task was just checked AND has repeat cadence, create next instance
      if (wasJustChecked && task.repeat) {
        const created = createNextRepeatInstance(task);
        if (created) {
          const rangeStr = '[' + dateKey(created.startDate) + ' → ' + dateKey(created.endDate) + ']';
          try { showStatus(T('repeatCreatedNext', { title: created.title, range: rangeStr })); } catch {}
        }
      }
    }

    function renderTimeline() {
      timelineView.innerHTML = '';

      // Refresh DAY_W from current zoom (in case it changed since last render)
      DAY_W = dayWidthFor(timelineZoom);

      // Compute overdue count (used by toolbar)
      const todayForOverdue = new Date(); todayForOverdue.setHours(0,0,0,0);
      const allOverdue = [];
      sections.forEach(section => {
        const isDoneSec = /^(valmiit|done|completed)$/i.test(section.name);
        if (isDoneSec) return;
        (tasks[section.id] || []).forEach(t => {
          if (t.endDate && t.endDate < todayForOverdue && !t.checked) {
            allOverdue.push({ task: t, sectionName: section.name, sectionId: section.id });
          }
        });
      });
      const overdueCount = allOverdue.length;

      // === Toolbar ===
      const toolbar = document.createElement('div');
      toolbar.className = 'timeline-toolbar';
      const overdueBtnHtml = overdueCount > 0
        ? `<button class="tb-overdue" id="tbOverdue" title="${escHtml(T('overdueTooltip'))}">${T('overdueCount', { n: overdueCount })}</button>`
        : '';
      // Status filter chips — built from current sections (excludes typical "done" auto-hidden by default if filter is null)
      const filterIsActive = (sectId) => {
        if (statusFilter === null) {
          // Default: show all sections, including Completed (rendered faded).
          // The Completed chip can still be toggled off to hide finished work.
          return true;
        }
        return statusFilter.has(sectId);
      };
      const allShown = sections.every(s => filterIsActive(s.id));
      const showAllChip = `<button data-status-all="1" class="${allShown ? 'active' : ''}">${escHtml(T('showAll'))}</button>`;
      const filterChips = showAllChip + sections.map(s => {
        const on = filterIsActive(s.id);
        return `<button data-status="${escHtml(s.id)}" class="${on ? 'active' : ''}">${escHtml(s.name)}</button>`;
      }).join('');
      toolbar.innerHTML = `
        <button class="tb-btn primary" id="tbNewTask">${T('newTask')}</button>
        ${overdueBtnHtml}
        <button class="tb-btn" id="tbManageCategories" title="${escHtml(T('manageCategories'))}" aria-label="${escHtml(T('manageCategories'))}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor"/></svg></button>
        <button class="tb-btn" id="tbManageVacations" title="${escHtml(T('manageVacations'))}">🌴</button>
        <span style="font-size:11px; color: var(--text-muted); margin-left:8px; margin-right:4px;">${T('statusFilter')}</span>
        <div class="tb-group">${filterChips}</div>
        <div class="spacer"></div>
        <button class="tb-btn" id="tbToday" title="${T('today')}">${T('today')}</button>
        <span style="font-size:11px; color: var(--text-muted); margin-left:8px; margin-right:4px;">${T('zoom')}</span>
        <div class="tb-group">
          <button data-zoom="day"   class="${timelineZoom === 'day'   ? 'active' : ''}">${T('day')}</button>
          <button data-zoom="week"  class="${timelineZoom === 'week'  ? 'active' : ''}">${T('week')}</button>
          <button data-zoom="month" class="${timelineZoom === 'month' ? 'active' : ''}">${T('month')}</button>
        </div>
        <span style="font-size:11px; color: var(--text-muted); margin-left:8px; margin-right:4px;">🎉</span>
        <div class="tb-group">
          <button data-holiday="fi" class="${holidayCountries.has('fi') ? 'active' : ''}" title="Finnish public holidays">FI</button>
          <button data-holiday="ca" class="${holidayCountries.has('ca') ? 'active' : ''}" title="Canadian public holidays">CA</button>
        </div>
        <span style="font-size:11px; color: var(--text-muted); margin-left:8px; margin-right:4px;">${T('language')}</span>
        <div class="tb-group">
          <button data-lang="en" class="${currentLang === 'en' ? 'active' : ''}">EN</button>
          <button data-lang="fr" class="${currentLang === 'fr' ? 'active' : ''}">FR</button>
        </div>
      `;
      timelineView.appendChild(toolbar);

      // Wire toolbar buttons
      toolbar.querySelector('#tbNewTask').addEventListener('click', () => createNewTaskFromTimeline());
      toolbar.querySelector('#tbToday').addEventListener('click', () => scrollTimelineToToday());
      const mgrBtn = toolbar.querySelector('#tbManageCategories');
      if (mgrBtn) mgrBtn.addEventListener('click', () => openCategoryManager());
      const vacBtn = toolbar.querySelector('#tbManageVacations');
      if (vacBtn) vacBtn.addEventListener('click', () => openVacationManager());
      const overdueBtn = toolbar.querySelector('#tbOverdue');
      if (overdueBtn) {
        overdueBtn.addEventListener('click', () => {
          // Scroll to earliest overdue task (by end date)
          allOverdue.sort((a, b) => a.task.endDate - b.task.endDate);
          const earliest = allOverdue[0];
          if (earliest && timelineFirstDate) {
            const main = timelineView.querySelector('.timeline-main');
            if (main) {
              const idx = daysBetween(timelineFirstDate, earliest.task.endDate);
              const viewportW = main.clientWidth;
              const target = idx * DAY_W - viewportW / 3;
              main.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
            }
          }
        });
      }
      toolbar.querySelectorAll('[data-zoom]').forEach(btn => {
        btn.addEventListener('click', () => {
          timelineZoom = btn.dataset.zoom;
          try { localStorage.setItem('task-timeline:timeline-zoom', timelineZoom); } catch {}
          renderTimeline();
        });
      });
      toolbar.querySelectorAll('[data-lang]').forEach(btn => {
        btn.addEventListener('click', () => {
          currentLang = btn.dataset.lang;
          try { localStorage.setItem('task-timeline:ui-lang', currentLang); } catch {}
          renderTimeline();
        });
      });
      toolbar.querySelectorAll('[data-holiday]').forEach(btn => {
        btn.addEventListener('click', () => {
          const c = btn.dataset.holiday;
          if (holidayCountries.has(c)) holidayCountries.delete(c);
          else holidayCountries.add(c);
          saveHolidayCountries();
          renderTimeline();
        });
      });
      const showAllBtn = toolbar.querySelector('[data-status-all]');
      if (showAllBtn) {
        showAllBtn.addEventListener('click', () => {
          // Show every section, including Completed
          statusFilter = new Set(sections.map(s => s.id));
          saveStatusFilter();
          renderTimeline();
        });
      }
      toolbar.querySelectorAll('[data-status]').forEach(btn => {
        btn.addEventListener('click', () => {
          // Initialize statusFilter from current visible set if needed
          if (statusFilter === null) {
            // Seed from the current default (all sections visible, incl. Completed)
            statusFilter = new Set(sections.map(s => s.id));
          }
          const id = btn.dataset.status;
          if (statusFilter.has(id)) statusFilter.delete(id);
          else statusFilter.add(id);
          saveStatusFilter();
          renderTimeline();
        });
      });

      const all = [];
      sections.forEach(section => {
        // Apply status filter
        if (!filterIsActive(section.id)) return;
        (tasks[section.id] || []).forEach(t => {
          all.push({ task: t, sectionName: section.name, sectionId: section.id });
        });
      });

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const scheduled = [];
      const undated = [];
      all.forEach(item => {
        // Completed tasks are kept on the timeline (rendered faded via
        // .sect-completed / .checked) rather than dropped, so finished work
        // stays visible but is clearly marked done.
        if (item.task.startDate && item.task.endDate) scheduled.push(item);
        else undated.push(item);
      });

      // Group scheduled by category
      const groups = {};   // tag -> { type, label, items }
      scheduled.forEach(item => {
        const tag = categoryFor(item);
        if (!groups[tag]) {
          const cfg = categoryConfig[tag];
          groups[tag] = {
            tag,
            type: cfg ? cfg.type : (tag === '(No category)' ? 'bag' : 'bag'),
            label: cfg ? cfg.label : tag,
            items: []
          };
        }
        groups[tag].items.push(item);
      });

      // Compute timeline range
      let firstDate = dateAdd(today, -14);
      let lastDate  = dateAdd(today, 30);
      scheduled.forEach(item => {
        if (item.task.startDate < firstDate) firstDate = new Date(item.task.startDate);
        if (item.task.endDate   > lastDate ) lastDate  = new Date(item.task.endDate);
      });
      firstDate = dateAdd(firstDate, -3);
      lastDate  = dateAdd(lastDate, 3);
      timelineFirstDate = firstDate;
      timelineLastDate  = lastDate;

      const totalDays = daysBetween(firstDate, lastDate) + 1;
      const canvasWidth = totalDays * DAY_W;

      // ===== Top gantt: left name column + right canvas =====
      const ganttWrap = document.createElement('div');
      ganttWrap.className = 'timeline-gantt-wrap';

      const namesCol = document.createElement('div');
      namesCol.className = 'timeline-names';
      const namesHdr = document.createElement('div');
      namesHdr.className = 'timeline-names-header';
      namesHdr.textContent = T('categoryTask');
      namesCol.appendChild(namesHdr);
      const namesBody = document.createElement('div');
      namesBody.className = 'timeline-names-body';
      namesCol.appendChild(namesBody);
      ganttWrap.appendChild(namesCol);

      // Deadline column
      const deadlinesCol = document.createElement('div');
      deadlinesCol.className = 'timeline-deadlines';
      const deadlinesHdr = document.createElement('div');
      deadlinesHdr.className = 'timeline-deadlines-header';
      deadlinesHdr.textContent = T('deadlineHeader');
      deadlinesCol.appendChild(deadlinesHdr);
      const deadlinesBody = document.createElement('div');
      deadlinesBody.className = 'timeline-deadlines-body';
      deadlinesCol.appendChild(deadlinesBody);
      ganttWrap.appendChild(deadlinesCol);

      const main = document.createElement('div');
      main.className = 'timeline-main';

      const canvas = document.createElement('div');
      canvas.className = 'timeline-canvas';
      canvas.style.setProperty('--day-w', DAY_W + 'px');
      canvas.style.width = canvasWidth + 'px';

      // Header row + background columns
      const headerRow = document.createElement('div');
      headerRow.className = 'timeline-header-row';
      headerRow.style.width = canvasWidth + 'px';
      const dows = currentLang === 'fr'
        ? ['Di','Lu','Ma','Me','Je','Ve','Sa']
        : ['Su','Mo','Tu','We','Th','Fr','Sa'];
      let lastMonth = -1;

      // Anchor density depends on zoom:
      // day: every day | week: each Monday | month: each 1st-of-month
      const isAnchor = (d) => {
        if (timelineZoom === 'week')  return d.getDay() === 1;          // Monday
        if (timelineZoom === 'month') return d.getDate() === 1;          // 1st
        return true;
      };
      const anchorWidth = (d) => {
        if (timelineZoom === 'week')  return 7 * DAY_W;
        if (timelineZoom === 'month') {
          const next = new Date(d.getFullYear(), d.getMonth() + 1, 1);
          return Math.round((next - d) / 86400000) * DAY_W;
        }
        return DAY_W;
      };

      for (let i = 0; i < totalDays; i++) {
        const d = dateAdd(firstDate, i);
        const isToday = d.getTime() === today.getTime();
        const dow = d.getDay();
        const isWeekend = dow === 0 || dow === 6;
        const holiday = holidayName(d);
        const vac = vacationFor(d);

        // Background column per day at day+week zoom; per month at month zoom.
        // This gives day-level gridlines + weekend/holiday tinting at week zoom too.
        const showBgCol = (timelineZoom === 'month') ? isAnchor(d) : true;
        if (showBgCol) {
          const bgCol = document.createElement('div');
          let bgClass = 'timeline-bg-col';
          if (timelineZoom === 'month' || d.getDate() === 1) bgClass += ' mo';
          else if (dow === 1) bgClass += ' wk';
          if (timelineZoom !== 'month') {
            if (isWeekend) bgClass += ' weekend';
            if (holiday)   bgClass += ' holiday';
            if (vac)       bgClass += ' vacation';
          }
          bgCol.className = bgClass;
          bgCol.style.left = (i * DAY_W) + 'px';
          // At day+week zoom, each bg-col is exactly 1 day wide → DAY_W
          // At month zoom, anchored to start-of-month and spans full month
          bgCol.style.width = (timelineZoom === 'month' ? anchorWidth(d) : DAY_W) + 'px';
          bgCol.dataset.dayIndex = i;
          if (vac && holiday)      bgCol.title = vac.label + ' · ' + holiday;
          else if (vac)            bgCol.title = vac.label;
          else if (holiday)        bgCol.title = holiday;
          canvas.appendChild(bgCol);
        }

        // Week gridline: thin dashed vertical line each Monday at month zoom
        // (at day/week zoom the per-day columns already provide gridlines).
        if (timelineZoom === 'month' && dow === 1 && d.getDate() !== 1) {
          const wl = document.createElement('div');
          wl.className = 'timeline-week-line';
          wl.style.left = (i * DAY_W) + 'px';
          canvas.appendChild(wl);
        }

        // Holiday marker: 🎉 at the top of the timeline, name on hover.
        if (holiday) {
          const hm = document.createElement('div');
          hm.className = 'timeline-holiday-marker';
          hm.style.left = (i * DAY_W + DAY_W / 2) + 'px';
          hm.textContent = '🎉';
          hm.title = holiday;
          canvas.appendChild(hm);
        }

        // Header tick at anchor density (every day at day zoom, every Mon at week zoom, etc.)
        if (isAnchor(d)) {
          const tick = document.createElement('div');
          let tickClass = 'timeline-day-tick';
          if (timelineZoom === 'month' || d.getDate() === 1) tickClass += ' mo';
          else if (dow === 1) tickClass += ' wk';
          if (timelineZoom === 'day') {
            if (isWeekend) tickClass += ' weekend';
            if (holiday)   tickClass += ' holiday';
          }
          tick.className = tickClass;
          tick.style.left = (i * DAY_W) + 'px';
          tick.style.width = anchorWidth(d) + 'px';
          if (holiday) tick.title = holiday;

          if (timelineZoom === 'day') {
            if (isToday) tick.classList.add('today');
            const monthLabel = (d.getMonth() !== lastMonth)
              ? `<div class="month">${fmtMonthLabel(d)}</div>` : '<div class="month">&nbsp;</div>';
            tick.innerHTML = `${monthLabel}<div class="dow">${dows[dow]}</div><div class="dom">${d.getDate()}</div>`;
            lastMonth = d.getMonth();
          } else if (timelineZoom === 'week') {
            const monthLabel = (d.getMonth() !== lastMonth)
              ? `<div class="month">${fmtMonthLabel(d)}</div>` : '<div class="month">&nbsp;</div>';
            tick.innerHTML = `${monthLabel}<div class="dom" style="font-size:11px;">${d.getDate()}.${d.getMonth()+1}.</div>`;
            lastMonth = d.getMonth();
          } else {
            // month
            tick.innerHTML = `<div class="month" style="margin-top:8px; font-size:11px; font-weight:600;">${fmtMonthLabel(d)}</div>`;
          }
          headerRow.appendChild(tick);
        }
      }

      // Vacation bands — span the lanes area, visible at all zoom levels
      vacations.forEach(v => {
        const vs = parseIsoDate(v.start), ve = parseIsoDate(v.end);
        if (!vs || !ve) return;
        let sIdx = daysBetween(firstDate, vs);
        let eIdx = daysBetween(firstDate, ve);
        if (eIdx < 0 || sIdx > totalDays - 1) return; // outside visible range
        sIdx = Math.max(0, sIdx);
        eIdx = Math.min(totalDays - 1, eIdx);
        if (eIdx < sIdx) return;
        const band = document.createElement('div');
        band.className = 'timeline-vacation-band';
        band.style.left = (sIdx * DAY_W) + 'px';
        band.style.width = ((eIdx - sIdx + 1) * DAY_W) + 'px';
        canvas.appendChild(band);

        // Label strip between the date row and the timeline (own high z-index so
        // it sits above the opaque sticky header); bottom border ties it visually
        // to the shaded dates below.
        const vhdr = document.createElement('div');
        vhdr.className = 'timeline-vacation-hdr';
        vhdr.style.left = (sIdx * DAY_W) + 'px';
        vhdr.style.width = ((eIdx - sIdx + 1) * DAY_W) + 'px';
        vhdr.innerHTML = `<span class="vac-label">🌴 ${escHtml(v.label || 'Vacation')}</span>`;
        canvas.appendChild(vhdr);
      });

      // Today marker as a thin vertical line overlay (so it's visible at all zooms)
      const todayIdx = daysBetween(firstDate, today);
      if (todayIdx >= 0 && todayIdx < totalDays) {
        const marker = document.createElement('div');
        marker.className = 'timeline-today-marker';
        marker.style.left = (todayIdx * DAY_W + Math.max(1, DAY_W / 2 - 1)) + 'px';
        canvas.appendChild(marker);
      }

      canvas.appendChild(headerRow);

      const lanes = document.createElement('div');
      lanes.className = 'timeline-lanes';
      lanes.style.width = canvasWidth + 'px';

      // Render category groups
      // Order: process categories first (most useful), then bags, then '(No category)'
      const groupTags = Object.keys(groups).sort((a, b) => {
        const ta = groups[a].type, tb = groups[b].type;
        const aProc = ta === 'process' ? 0 : 1;
        const bProc = tb === 'process' ? 0 : 1;
        if (aProc !== bProc) return aProc - bProc;
        return groups[a].label.localeCompare(groups[b].label);
      });

      let totalLaneCount = 0;
      groupTags.forEach(tag => {
        const g = groups[tag];
        // Sort within a category by deadline (end date), ascending. Tasks without an end
        // date sink to the bottom.
        g.items.sort((a, b) => {
          const aEnd = a.task.endDate ? a.task.endDate.getTime() : Infinity;
          const bEnd = b.task.endDate ? b.task.endDate.getTime() : Infinity;
          return aEnd - bEnd;
        });

        const expanded = isCategoryExpanded(tag);
        const isProcess = g.type === 'process';

        // Category header lane (name column + timeline lane)
        const minStart = g.items.reduce((m, i) => i.task.startDate < m ? i.task.startDate : m, g.items[0].task.startDate);
        const maxEnd   = g.items.reduce((m, i) => i.task.endDate   > m ? i.task.endDate   : m, g.items[0].task.endDate);
        const doneCount = g.items.filter(i => i.task.checked).length;
        const total = g.items.length;
        const pct = total ? Math.round((doneCount / total) * 100) : 0;

        // Count overdue children in this category
        const overdueInCat = g.items.filter(it =>
          it.task.endDate && it.task.endDate < today && !it.task.checked
        ).length;

        // Name row for category
        const catNameRow = document.createElement('div');
        catNameRow.className = 'timeline-name-row category' + (isProcess ? '' : ' bag');
        catNameRow.innerHTML = `
          <span class="caret">${expanded ? '▼' : '▶'}</span>
          <span class="name-text" title="${escHtml(g.label)}">${escHtml(g.label)}</span>
          ${overdueInCat > 0 ? `<span class="cat-overdue" title="${overdueInCat} overdue">⚠ ${overdueInCat}</span>` : ''}
          ${isProcess ? `<span class="pct">${pct}%</span>` : ''}
          <span class="count">${doneCount}/${total}</span>
          <button class="cat-add-btn" title="${escHtml(T('addTaskToCategory', { cat: g.label }))}">+</button>
        `;
        catNameRow.addEventListener('click', (e) => {
          // Skip if clicked the + button — it has its own handler below
          if (e.target.classList && e.target.classList.contains('cat-add-btn')) return;
          expandedCategories[tag] = !isCategoryExpanded(tag);
          saveExpandedState();
          renderTimeline();
        });
        catNameRow.querySelector('.cat-add-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          // Use tag as category — but translate (No category) / AD HOC fallback to null
          const catForNew = (tag === '(No category)' || tag === 'AD HOC') ? null : tag;
          createNewTaskFromTimeline({ category: catForNew });
        });
        namesBody.appendChild(catNameRow);

        // Deadline cell for category: earliest pending deadline among children
        const pending = g.items.filter(it => !it.task.checked && it.task.endDate);
        pending.sort((a, b) => a.task.endDate - b.task.endDate);
        const catDeadlineRow = document.createElement('div');
        catDeadlineRow.className = 'timeline-deadline-row category' + (isProcess ? '' : ' bag');
        if (pending.length === 0) {
          catDeadlineRow.innerHTML = '<span class="deadline-empty">—</span>';
        } else {
          const next = pending[0].task.endDate;
          const isOv = next < today;
          if (isOv) catDeadlineRow.classList.add('overdue');
          catDeadlineRow.textContent = fmtDeadline(next);
        }
        deadlinesBody.appendChild(catDeadlineRow);

        // Category lane on timeline
        const catLane = document.createElement('div');
        catLane.className = 'timeline-lane category-lane' + (isProcess ? '' : ' bag');
        catLane.dataset.categoryTag = tag;

        // Activity shading: contiguous day-ranges where any sub-task is active.
        // Computed as the union of all sub-task intervals.
        const intervals = g.items.map(it => [
          Math.max(0, daysBetween(firstDate, it.task.startDate)),
          Math.max(0, daysBetween(firstDate, it.task.endDate))
        ]).sort((a, b) => a[0] - b[0]);
        const merged = [];
        intervals.forEach(([s, e]) => {
          if (merged.length && s <= merged[merged.length - 1][1] + 1) {
            merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], e);
          } else {
            merged.push([s, e]);
          }
        });
        merged.forEach(([s, e]) => {
          const band = document.createElement('div');
          band.className = 'timeline-activity-band' + (isProcess ? '' : ' bag');
          band.style.left = (s * DAY_W) + 'px';
          band.style.width = ((e - s + 1) * DAY_W) + 'px';
          catLane.appendChild(band);
        });

        if (isProcess) {
          // Rollup bar on top of the activity bands
          const startIdx = Math.max(0, daysBetween(firstDate, minStart));
          const endIdx   = Math.max(startIdx, daysBetween(firstDate, maxEnd));
          const left = startIdx * DAY_W + 2;
          const width = Math.max((endIdx - startIdx + 1) * DAY_W - 4, DAY_W - 4);
          const rollup = document.createElement('div');
          rollup.className = 'timeline-rollup';
          rollup.style.left = left + 'px';
          rollup.style.width = width + 'px';
          const fill = document.createElement('div');
          fill.className = 'timeline-rollup-fill';
          fill.style.width = pct + '%';
          rollup.appendChild(fill);
          catLane.appendChild(rollup);
        } else {
          // For bag categories, when collapsed also stack the individual bars
          if (!expanded) {
            g.items.forEach(item => catLane.appendChild(makeBar(item, today)));
          }
        }
        lanes.appendChild(catLane);
        totalLaneCount++;

        // Sub-task rows (only when expanded)
        if (expanded) {
          g.items.forEach(item => {
            const nameRow = document.createElement('div');
            const isItemOverdue = item.task.endDate && item.task.endDate < today && !item.task.checked;
            nameRow.className = 'timeline-name-row subtask' + (isItemOverdue ? ' overdue' : '');
            const checkSymbol = item.task.checked ? '☑' : '☐';
            const overdueMark = isItemOverdue ? '<span class="row-overdue-icon" title="Overdue">⚠</span> ' : '';
            nameRow.innerHTML = `
              <span class="caret"></span>
              <span class="name-text" title="${escHtml(item.task.title)}">${overdueMark}${checkSymbol} ${escHtml(item.task.title)}</span>
            `;
            // Click row → scroll bar into view (handy when scrolled away horizontally)
            nameRow.style.cursor = 'pointer';
            nameRow.addEventListener('click', () => {
              if (!item.task.startDate || !timelineFirstDate) return;
              const main = timelineView.querySelector('.timeline-main');
              if (!main) return;
              const idx = daysBetween(timelineFirstDate, item.task.startDate);
              const viewportW = main.clientWidth;
              main.scrollTo({ left: Math.max(0, idx * DAY_W - viewportW / 4), behavior: 'smooth' });
            });
            namesBody.appendChild(nameRow);

            // Deadline cell for sub-task
            const deadlineRow = document.createElement('div');
            deadlineRow.className = 'timeline-deadline-row' + (isItemOverdue ? ' overdue' : '');
            if (item.task.endDate) {
              deadlineRow.textContent = fmtDeadline(item.task.endDate);
            } else {
              deadlineRow.innerHTML = '<span class="deadline-empty">—</span>';
            }
            deadlinesBody.appendChild(deadlineRow);

            const lane = document.createElement('div');
            lane.className = 'timeline-lane';
            lane.dataset.categoryTag = tag;
            lane.appendChild(makeBar(item, today));
            lanes.appendChild(lane);
            totalLaneCount++;
          });
        }
      });

      const minLanesHeight = Math.max(totalLaneCount * 38, 200);
      canvas.style.minHeight = (56 + minLanesHeight) + 'px';
      canvas.appendChild(lanes);

      // Row hover: highlight row i in names, deadlines and lanes together.
      // The three columns are built in the same order, so the child index is the row id.
      let hoverIdx = -1;
      const setRowHover = (idx) => {
        if (idx === hoverIdx) return;
        [namesBody, deadlinesBody, lanes].forEach(c => {
          const old = c.children[hoverIdx]; if (old) old.classList.remove('row-hover');
          const nw = c.children[idx];      if (nw) nw.classList.add('row-hover');
        });
        hoverIdx = idx;
      };
      const rowIndexOf = (container, target) => {
        let el = target;
        while (el && el.parentElement !== container) el = el.parentElement;
        return el ? Array.prototype.indexOf.call(container.children, el) : -1;
      };
      [namesBody, deadlinesBody].forEach(c => {
        c.addEventListener('mouseover', e => setRowHover(rowIndexOf(c, e.target)));
        c.addEventListener('mouseleave', () => setRowHover(-1));
      });
      main.addEventListener('mousemove', e => {
        const r = lanes.getBoundingClientRect();
        const y = e.clientY - r.top;
        setRowHover(y >= 0 && y < r.height ? Math.floor(y / 38) : -1);
      });
      main.addEventListener('mouseleave', () => setRowHover(-1));

      main.addEventListener('dragover', onMainDragOver);
      main.addEventListener('drop', onMainDrop);
      main.addEventListener('dragleave', clearDropHighlights);

      // Click on empty timeline area → date popover
      // Any click inside main that didn't land on a task bar (or its children/handles/link) counts.
      // This covers: bg-col, day-tick, and empty lane area.
      main.addEventListener('click', (e) => {
        // If a popover was just dismissed by this same click, don't immediately re-open one
        if (suppressNextDayClick) return;
        // Skip clicks on bars / handles / link icons
        if (e.target.closest('.timeline-bar')) return;
        // Skip if click bubbled from outside the canvas (shouldn't happen, but safe)
        const canvasEl = timelineView.querySelector('.timeline-canvas');
        if (!canvasEl || !canvasEl.contains(e.target)) return;
        const d = pointerToDate(e);
        if (d) showDayPopover(d, e.clientX, e.clientY);
      });

      // Sync vertical scroll between names, deadlines and main
      main.addEventListener('scroll', () => {
        namesBody.scrollTop = main.scrollTop;
        deadlinesBody.scrollTop = main.scrollTop;
      });

      // Mouse wheel over the left columns (names / deadlines) should scroll the timeline vertically.
      // Without this, the wheel does nothing when the cursor is over the left side (overflow: hidden).
      const forwardWheel = (el) => {
        el.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) {
            main.scrollTop += e.deltaY;
            e.preventDefault();
          }
        }, { passive: false });
      };
      forwardWheel(namesCol);
      forwardWheel(deadlinesCol);

      // Keep both side columns' bottom padding in sync with the horizontal scrollbar in main
      const syncScrollbarPadding = () => {
        const sb = main.offsetHeight - main.clientHeight;
        const p = (sb > 0 ? sb : 0) + 'px';
        namesBody.style.paddingBottom = p;
        deadlinesBody.style.paddingBottom = p;
      };
      window.addEventListener('resize', syncScrollbarPadding);

      main.appendChild(canvas);
      ganttWrap.appendChild(main);
      timelineView.appendChild(ganttWrap);

      // ===== Bottom: undated bar (horizontal) =====
      if (undated.length > 0) {
        const undatedWrap = document.createElement('div');
        undatedWrap.className = 'timeline-undated-row';
        const undatedBar = document.createElement('div');
        undatedBar.className = 'timeline-undated';
        const label = document.createElement('div');
        label.className = 'timeline-undated-label';
        label.textContent = `${T('unscheduled')} (${undated.length}) — ${T('dragToSchedule')}`;
        undatedBar.appendChild(label);
        undated.forEach(item => undatedBar.appendChild(makeUndatedPill(item)));
        undatedWrap.appendChild(undatedBar);
        timelineView.appendChild(undatedWrap);
      }

      // Scroll today into view on first render of this view, and align side columns
      // to the timeline (compensate for horizontal scrollbar height).
      requestAnimationFrame(() => {
        scrollTimelineToToday();
        const mainEl = timelineView.querySelector('.timeline-main');
        const namesBodyEl = timelineView.querySelector('.timeline-names-body');
        const deadlinesBodyEl = timelineView.querySelector('.timeline-deadlines-body');
        if (mainEl) {
          const sbHeight = mainEl.offsetHeight - mainEl.clientHeight;
          const p = (sbHeight > 0 ? sbHeight : 0) + 'px';
          if (namesBodyEl) namesBodyEl.style.paddingBottom = p;
          if (deadlinesBodyEl) deadlinesBodyEl.style.paddingBottom = p;
        }
      });
    }

    function scrollTimelineToToday() {
      const main = timelineView.querySelector('.timeline-main');
      if (!main || !timelineFirstDate) return;
      const today = new Date(); today.setHours(0,0,0,0);
      const todayIdx = daysBetween(timelineFirstDate, today);
      // Center today in the viewport (roughly), with 1/4 of viewport width of context to the left
      const viewportW = main.clientWidth;
      const target = todayIdx * DAY_W - viewportW / 4;
      main.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    }

    function createNewTaskFromTimeline(opts) {
      opts = opts || {};
      const aktiivinen = sections.find(s =>
        /^aktiiviset|^active$/i.test(s.name)
      ) || sections.find(s => !/^(valmiit|done|completed)$/i.test(s.name)) || sections[0];
      if (!aktiivinen) {
        alert('No suitable section. Add an "Active" section first.');
        return;
      }
      const baseDate = opts.startDate ? new Date(opts.startDate) : (() => {
        const t = new Date(); t.setHours(0,0,0,0); return t;
      })();
      baseDate.setHours(0,0,0,0);
      const newTask = {
        id: Date.now() + Math.random(),
        title: currentLang === 'fr' ? 'Nouvelle tâche' : 'New task',
        note: '',
        checked: false,
        subtasks: [],
        section: aktiivinen.id,
        startDate: new Date(baseDate),
        endDate: dateAdd(baseDate, 7),
        category: opts.category || null,
        sourceLink: null
      };
      if (!tasks[aktiivinen.id]) tasks[aktiivinen.id] = [];
      tasks[aktiivinen.id].push(newTask);
      markChanged();
      renderTasks();
      // Open the modal pre-focused on the title input
      openTaskEditModal({
        task: newTask,
        sectionId: aktiivinen.id,
        sectionName: aktiivinen.name
      });
    }

    // Day-click popover
    let suppressNextDayClick = false;
    function showDayPopover(d, anchorX, anchorY) {
      // Remove any existing popover first
      document.querySelectorAll('.timeline-day-popover').forEach(p => p.remove());

      const pop = document.createElement('div');
      pop.className = 'timeline-day-popover';
      const dateLabel = d.toLocaleDateString(currentLang === 'fr' ? 'fr-FR' : 'en-GB',
        { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      const holiday = holidayName(d);
      pop.innerHTML = `
        <div class="pop-date">${escHtml(dateLabel)}</div>
        ${holiday ? `<div class="pop-meta">🎉 ${escHtml(holiday)}</div>` : ''}
        <button class="pop-btn">${escHtml(T('addTaskHere'))}</button>
      `;
      // Position near the cursor; keep within viewport
      document.body.appendChild(pop);
      const rect = pop.getBoundingClientRect();
      const vw = window.innerWidth, vh = window.innerHeight;
      let x = anchorX + 8;
      let y = anchorY + 8;
      if (x + rect.width  > vw - 8) x = vw - rect.width - 8;
      if (y + rect.height > vh - 8) y = anchorY - rect.height - 8;
      pop.style.left = x + 'px';
      pop.style.top  = y + 'px';

      pop.querySelector('.pop-btn').addEventListener('click', () => {
        pop.remove();
        createNewTaskFromTimeline({ startDate: d });
      });

      // Dismiss on outside click. Use capture phase + a brief suppress flag so the
      // same click that dismisses the popover doesn't also re-open one at the new spot.
      const dismiss = (ev) => {
        if (!pop.contains(ev.target)) {
          pop.remove();
          document.removeEventListener('mousedown', dismiss, true);
          suppressNextDayClick = true;
          setTimeout(() => { suppressNextDayClick = false; }, 100);
        }
      };
      setTimeout(() => document.addEventListener('mousedown', dismiss, true), 0);
    }

        tbody.appendChild(tr);
        tr.querySelector('.del-btn').addEventListener('click', () => tr.remove());
        tr.querySelector('.cat-mgr-tag').focus();

      // Stash the original rows so we can compute renames on save

    // Helper used by saveModal — apply all category-manager edits
    function applyCategoryManagerSave() {
      const tbody = document.getElementById('catMgrRows');
      const origTags = JSON.parse(modalOverlay.dataset.origRows || '[]');

      // Read current state from the form
      const newRows = [];
      tbody.querySelectorAll('tr').forEach(tr => {
        const tag = tr.querySelector('.cat-mgr-tag').value.trim();
        const label = tr.querySelector('.cat-mgr-label').value.trim();
        const type = tr.querySelector('.cat-mgr-type').value;
        const idxAttr = tr.dataset.rowIdx;
        const origTag = (idxAttr !== undefined && idxAttr < origTags.length) ? origTags[idxAttr] : null;
        if (tag) newRows.push({ origTag, tag, label: label || tag, type });
      });

      // 1) Rename: any task whose category matches an origTag that changed → update to the new tag
      const renames = {};
      newRows.forEach(r => {
        if (r.origTag && r.origTag !== r.tag) renames[r.origTag] = r.tag;
      });
      if (Object.keys(renames).length) {
        sections.forEach(s => (tasks[s.id] || []).forEach(t => {
          if (t.category && renames[t.category]) {
            t.category = renames[t.category];
          }
        }));
      }

      // 2) Rebuild categoryConfig in memory
      categoryConfig = {};
      newRows.forEach(r => {
        categoryConfig[r.tag] = { type: r.type, label: r.label };
      });

      // 3) Persist categoryConfig to memory/timeline-categories.md
      // Build a fresh YAML block. Keep the surrounding intro/comments minimal.
      const yamlLines = ['categories:'];
      newRows.forEach(r => {
        yamlLines.push(`  - tag: "${r.tag.replace(/"/g, '\\"')}"`);
        yamlLines.push(`    type: ${r.type}`);
        yamlLines.push(`    label: "${(r.label || r.tag).replace(/"/g, '\\"')}"`);
      });
      const newYaml = yamlLines.join('\n');

      // Try to write to memory/timeline-categories.md if available
      (async () => {
        try {
          if (memoryDirHandle) {
            const memoryDir = await memoryDirHandle.getDirectoryHandle('memory');
            const handle = await memoryDir.getFileHandle('timeline-categories.md', { create: true });
            // Read existing content to preserve any surrounding text outside the YAML block
            let oldContent = '';
            try {
              const file = await handle.getFile();
              oldContent = await file.text();
            } catch {}
            let newContent;
            if (/```yaml[\s\S]*?```/.test(oldContent)) {
              newContent = oldContent.replace(/```yaml\s*[\s\S]*?\s*```/, '```yaml\n' + newYaml + '\n```');
            } else {
              newContent = '# Timeline categories\n\n```yaml\n' + newYaml + '\n```\n';
            }
            const writable = await handle.createWritable();
            await writable.write(newContent);
            await writable.close();
            // Also update the in-memory cache
            const cachedFile = memoryData.memoryFiles.find(f => f.name === 'timeline-categories.md');
            if (cachedFile) cachedFile.content = newContent;
          }
        } catch (e) {
          console.log('Could not write timeline-categories.md:', e);
        }
      })();

      markChanged();
      renderTasks();
    }

    function pointerToDate(e) {
      if (!timelineFirstDate) return null;
      const canvas = timelineView.querySelector('.timeline-canvas');
      if (!canvas) return null;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const idx = Math.floor(x / DAY_W);
      const max = daysBetween(timelineFirstDate, timelineLastDate);
      const clamped = Math.max(0, Math.min(max, idx));
      return dateAdd(timelineFirstDate, clamped);
    }

    function makeBar(item, today) {
      const t = item.task;
      const bar = document.createElement('div');
      const isOverdue = t.endDate < today && !t.checked;
      // Section slug for color coding (e.g. "waiting-for-others")
      const sectSlug = (item.sectionName || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      // Current week (Mon–Sun) — bars touching it render at full strength
      const _wkStart = new Date(today); _wkStart.setHours(0,0,0,0);
      _wkStart.setDate(_wkStart.getDate() - ((_wkStart.getDay() + 6) % 7));
      const _wkEnd = new Date(_wkStart); _wkEnd.setDate(_wkEnd.getDate() + 6);
      const isNow = t.startDate <= _wkEnd && t.endDate >= _wkStart;
      bar.className = 'timeline-bar'
        + ' sect-' + sectSlug
        + (isNow ? ' now' : '')
        + (isOverdue ? ' overdue' : '')
        + (t.checked ? ' checked' : '');
      const startIdx = daysBetween(timelineFirstDate, t.startDate);
      const endIdx   = daysBetween(timelineFirstDate, t.endDate);
      const left = startIdx * DAY_W;
      const width = Math.max((endIdx - startIdx + 1) * DAY_W - 4, DAY_W - 4);
      bar.style.left = (left + 2) + 'px';
      bar.style.width = width + 'px';

      bar.dataset.taskId = t.id;
      bar.title = `${t.title}\n${dateKey(t.startDate)} → ${dateKey(t.endDate)}` + (t.note ? '\n' + t.note : '');

      const linkInfo = (t.sourceLink && t.sourceLink.url) ? t.sourceLink : null;
      const linkIcon = linkInfo
        ? `<a href="${linkInfo.url.replace(/"/g,'%22')}" target="_blank" rel="noopener noreferrer" class="bar-link" title="${escHtml(linkInfo.label || 'Open source link')}" onclick="event.stopPropagation()">🔗</a>`
        : '';

      bar.innerHTML = `
        <div class="bar-handle start" data-handle="start"></div>
        ${isOverdue ? '<span class="bar-overdue-icon" title="Overdue">⚠</span>' : ''}
        <span class="bar-section">${escHtml(item.sectionName)}</span>
        <span class="bar-title">${escHtml(t.title)}</span>
        ${linkIcon}
        <div class="bar-handle end" data-handle="end"></div>
      `;

      // Milestone markers: sub-tasks with a date prefix render as diamonds on the bar
      if (t.subtasks && t.subtasks.length) {
        t.subtasks.forEach(st => {
          if (!st.milestone) return;
          const mIdx = daysBetween(timelineFirstDate, st.milestone);
          const mCanvasLeft = mIdx * DAY_W + DAY_W / 2;  // centered on the day cell
          // Position relative to bar (bar.style.left already set, bar is position:absolute)
          const barLeftPx = parseFloat(bar.style.left) || 0;
          const localLeft = mCanvasLeft - barLeftPx;
          // Only render if the milestone falls within the bar's date range
          if (localLeft >= 0 && localLeft <= width) {
            const m = document.createElement('div');
            m.className = 'milestone' + (st.checked ? ' checked' : '');
            m.style.left = localLeft + 'px';
            m.title = `${dateKey(st.milestone)} — ${st.text}${st.checked ? ' ✓' : ''}`;
            bar.appendChild(m);
          }
        });
      }

      // Pointer-based move / resize
      bar.addEventListener('pointerdown', (e) => onBarPointerDown(e, item));

      return bar;
    }

    function makeUndatedPill(item) {
      const pill = document.createElement('div');
      pill.className = 'undated-item' + (item.task.checked ? ' checked' : '');
      pill.draggable = true;
      pill.dataset.taskId = item.task.id;
      const title = escHtml(item.task.title);
      pill.innerHTML = `<div class="item-section">${escHtml(item.sectionName)}</div><div>${title}</div>`;
      pill.title = (item.task.title || '') + (item.task.note ? '\n' + item.task.note : '');

      pill.addEventListener('dragstart', (e) => {
        dragFromSidebar = item;
        pill.classList.add('dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(item.task.id));
        }
      });
      pill.addEventListener('dragend', () => {
        pill.classList.remove('dragging');
        dragFromSidebar = null;
        clearDropHighlights();
      });

      // Click (without drag) opens the edit modal — same as for timeline bars.
      // The native drag system fires 'dragstart' if the user moves, so 'click' only fires
      // when the user just taps without dragging.
      pill.addEventListener('click', (e) => {
        // Avoid hijacking native drag — only handle if dragFromSidebar isn't currently set
        if (!dragFromSidebar) {
          openTaskEditModal(item);
        }
      });

      return pill;
    }

    function onMainDragOver(e) {
      if (!dragFromSidebar) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      const dayIdx = pointerToDayIndex(e);
      clearDropHighlights();
      const cols = timelineView.querySelectorAll('.timeline-bg-col');
      // Highlight a 7-day window
      for (let i = dayIdx; i < dayIdx + DEFAULT_DURATION_DAYS && i < cols.length; i++) {
        if (i >= 0 && cols[i]) cols[i].classList.add('drop-target');
      }
    }

    function onMainDrop(e) {
      if (!dragFromSidebar) return;
      e.preventDefault();
      const dayIdx = pointerToDayIndex(e);
      const start = dateAdd(timelineFirstDate, dayIdx);
      const end = dateAdd(start, DEFAULT_DURATION_DAYS - 1);
      dragFromSidebar.task.startDate = start;
      dragFromSidebar.task.endDate = end;
      dragFromSidebar = null;
      clearDropHighlights();
      markChanged();
      renderTasks();
    }

    function clearDropHighlights() {
      timelineView.querySelectorAll('.timeline-bg-col.drop-target')
        .forEach(c => c.classList.remove('drop-target'));
    }

    function pointerToDayIndex(e) {
      const canvas = timelineView.querySelector('.timeline-canvas');
      if (!canvas) return 0;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const idx = Math.floor(x / DAY_W);
      const max = daysBetween(timelineFirstDate, timelineLastDate);
      return Math.max(0, Math.min(max, idx));
    }

    function onBarPointerDown(e, item) {
      // Ignore right-click etc
      if (e.button !== 0) return;
      // Let the link icon handle its own click (open URL) without drag/edit interference
      if (e.target && e.target.classList && e.target.classList.contains('bar-link')) return;
      e.preventDefault();
      e.stopPropagation();
      const target = e.target;
      let mode = 'move';
      if (target.classList && target.classList.contains('bar-handle')) {
        mode = target.dataset.handle === 'start' ? 'resize-start' : 'resize-end';
      }
      const bar = e.currentTarget;
      bar.setPointerCapture(e.pointerId);

      draggingTask = {
        item,
        mode,
        anchorX: e.clientX,
        anchorY: e.clientY,
        origStart: new Date(item.task.startDate),
        origEnd: new Date(item.task.endDate),
        bar,
        moved: false
      };

      const moveHandler = (ev) => {
        if (!draggingTask) return;
        const dx = Math.abs(ev.clientX - draggingTask.anchorX);
        const dy = Math.abs(ev.clientY - draggingTask.anchorY);
        if (!draggingTask.moved && (dx > 4 || dy > 4)) {
          draggingTask.moved = true;
          draggingTask.bar.classList.add(mode === 'move' ? 'dragging' : 'resizing');
        }
        if (draggingTask.moved) onBarPointerMove(ev);
      };
      const upHandler = (ev) => {
        const wasClick = draggingTask && !draggingTask.moved;
        if (draggingTask && draggingTask.bar) {
          draggingTask.bar.classList.remove('dragging', 'resizing');
          try { draggingTask.bar.releasePointerCapture(ev.pointerId); } catch {}
        }
        document.removeEventListener('pointermove', moveHandler);
        document.removeEventListener('pointerup', upHandler);
        const wasItem = draggingTask ? draggingTask.item : null;
        const wasMoved = draggingTask ? draggingTask.moved : false;
        const wasMode  = draggingTask ? draggingTask.mode : null;
        draggingTask = null;
        if (wasMoved) {
          // If a 'move' drag released over a different category lane, change category
          if (wasMode === 'move' && wasItem) {
            // Temporarily hide the bar so elementFromPoint reads the underlying lane
            const bar = ev.target.closest ? ev.target.closest('.timeline-bar') : null;
            if (bar) bar.style.pointerEvents = 'none';
            const underEl = document.elementFromPoint(ev.clientX, ev.clientY);
            if (bar) bar.style.pointerEvents = '';
            const laneEl = underEl ? underEl.closest('.timeline-lane') : null;
            const droppedTag = laneEl && laneEl.dataset && laneEl.dataset.categoryTag;
            if (droppedTag) {
              const currentTag = wasItem.task.category || categoryFor(wasItem);
              if (droppedTag !== currentTag) {
                // Translate "(No category)" sentinel back to null
                wasItem.task.category = (droppedTag === '(No category)') ? null : droppedTag;
              }
            }
          }
          markChanged();
          renderTasks();
        } else if (wasClick && wasItem) {
          openTaskEditModal(wasItem);
        }
      };
      document.addEventListener('pointermove', moveHandler);
      document.addEventListener('pointerup', upHandler);
    }

            </label>
          </div>
          <div style="display: flex; gap: 12px;">

                style="display:block; width:100%; margin-top:4px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-primary); font-family:inherit; font-size:14px;">
                ${catOptionsHtml}

              <input type="text" id="taskEditCategoryNew" placeholder="${escHtml(T('newCategoryPlaceholder'))}"
                style="display:none; width:100%; margin-top:4px; padding:8px; border-radius:6px; border:1px solid var(--accent); background:var(--bg-card); color:var(--text-primary); font-family:inherit; font-size:14px;">

                placeholder="${escHtml(T('sourceLabelPlaceholder'))}"

            </label>
            <label style="flex:2; font-size: 12px; color: var(--text-secondary);">${escHtml(T('sourceUrl'))}
              <input type="text" id="taskEditSourceUrl" value="${escHtml(t.sourceLink ? t.sourceLink.url : '')}"
                placeholder="https://… (link to the email, chat message or document)"
                style="display:block; width:100%; margin-top:4px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-primary); font-family:inherit; font-size:13px;">
            </label>

          ${t.sourceLink && t.sourceLink.url ? `<div style="margin-top:-4px;">
            <a href="${t.sourceLink.url.replace(/"/g,'%22')}" target="_blank" rel="noopener noreferrer"
               style="font-size:12px; color: var(--accent); text-decoration: underline;">${escHtml(T('openSource'))}</a>
          </div>` : ''}
          <label style="font-size: 12px; color: var(--text-secondary);">${escHtml(T('note'))}
            <textarea id="taskEditNote" rows="4"
              style="display:block; width:100%; margin-top:4px; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg-card); color:var(--text-primary); font-family:inherit; font-size:13px; resize:vertical;"

                <option value="" ${!t.repeat ? 'selected' : ''}>${escHtml(T('repeatNone'))}</option>
                <option value="monthly" ${t.repeat === 'monthly' ? 'selected' : ''}>${escHtml(T('repeatMonthly'))}</option>
                <option value="quarterly" ${t.repeat === 'quarterly' ? 'selected' : ''}>${escHtml(T('repeatQuarterly'))}</option>
                <option value="annual" ${t.repeat === 'annual' ? 'selected' : ''}>${escHtml(T('repeatAnnual'))}</option>
              </select>

              <input type="checkbox" id="taskEditChecked" ${t.checked ? 'checked' : ''}>
              ${escHtml(T('done'))}

      modalOverlay.dataset.type = 'taskEdit';
      modalOverlay.dataset.taskId = String(item.task.id);
      modalOverlay.dataset.fromSection = item.sectionId;

      // Category select: when "+ Add new" is chosen, swap to the text input
      const catSelect = document.getElementById('taskEditCategory');
      const catNewInput = document.getElementById('taskEditCategoryNew');
      catSelect.addEventListener('change', () => {
        if (catSelect.value === '__new__') {
          catSelect.style.display = 'none';
          catNewInput.style.display = 'block';
          catNewInput.value = '';
          catNewInput.focus();
        }
      });
      // If the input is cleared via Escape, swap back to the select
      catNewInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          catNewInput.style.display = 'none';
          catSelect.style.display = 'block';
          catSelect.value = t.category || '';
        }
      });

      // Delete handler
      document.getElementById('taskEditDelete').onclick = () => {
        if (!confirm(T('deleteConfirm', { title: t.title }))) return;
        const list = tasks[item.sectionId] || [];
        const idx = list.findIndex(x => x.id === t.id);
        if (idx >= 0) list.splice(idx, 1);
        closeModal();
        markChanged();
        renderTasks();
      };

      // Focus the title for quick keyboard editing
      setTimeout(() => {
        const el = document.getElementById('taskEditTitle');
        if (el) { el.focus(); el.select(); }
      }, 50);
    }

    function onBarPointerMove(e) {
      if (!draggingTask) return;
      const dx = e.clientX - draggingTask.anchorX;
      const dayShift = Math.round(dx / DAY_W);
      if (dayShift === draggingTask.lastShift) return;
      draggingTask.lastShift = dayShift;

      const t = draggingTask.item.task;
      if (draggingTask.mode === 'move') {
        t.startDate = dateAdd(draggingTask.origStart, dayShift);
        t.endDate = dateAdd(draggingTask.origEnd, dayShift);
      } else if (draggingTask.mode === 'resize-start') {
        let newStart = dateAdd(draggingTask.origStart, dayShift);
        if (newStart > t.endDate) newStart = new Date(t.endDate);
        t.startDate = newStart;
      } else if (draggingTask.mode === 'resize-end') {
        let newEnd = dateAdd(draggingTask.origEnd, dayShift);
        if (newEnd < t.startDate) newEnd = new Date(t.startDate);
        t.endDate = newEnd;
      }

      // Update bar position live without full re-render
      const startIdx = daysBetween(timelineFirstDate, t.startDate);
      const endIdx   = daysBetween(timelineFirstDate, t.endDate);
      draggingTask.bar.style.left = (startIdx * DAY_W + 2) + 'px';
      draggingTask.bar.style.width = Math.max((endIdx - startIdx + 1) * DAY_W - 4, DAY_W - 4) + 'px';
      draggingTask.bar.title = `${t.title}\n${dateKey(t.startDate)} → ${dateKey(t.endDate)}` + (t.note ? '\n' + t.note : '');
    }

    function renderBoard() {
      board.innerHTML = '';
      sections.forEach(section => {
        const sectionTasks = sortedSectionTasks(section.id);
        board.appendChild(createColumn(section.id, section.name, sectionTasks));
      });

      const addSectionBtn = document.createElement('div');
      addSectionBtn.className = 'column';
      addSectionBtn.style.cssText = 'background: transparent; border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 120px;';
      addSectionBtn.innerHTML = '<span style="color: var(--text-muted); font-size: 14px; font-weight: 500;">+ Add Section</span>';
      addSectionBtn.addEventListener('click', () => startAddingSection(addSectionBtn));
      board.appendChild(addSectionBtn);
    }

    function renderList() {
      listView.innerHTML = '';

      if (!quickAddSection && sections.length > 0) {
        quickAddSection = sections[0].id;
      }

      // Quick add at top
      const quickAdd = document.createElement('div');
      quickAdd.className = 'quick-add';
      quickAdd.style.cssText = 'border-bottom: 2px solid var(--border); margin-bottom: 24px; padding-bottom: 16px;';

      const sectionName = sections.find(s => s.id === quickAddSection)?.name || 'Select section';
      quickAdd.innerHTML = `
        <span class="checkbox" style="opacity: 0.3;"></span>
        <input type="text" class="quick-add-input" placeholder="Add a task..." id="quickAddInput">
        <span class="quick-add-section" id="quickAddSectionBtn">${sectionName}</span>
      `;
      listView.appendChild(quickAdd);

      const quickInput = document.getElementById('quickAddInput');
      const sectionBtn = document.getElementById('quickAddSectionBtn');

      quickInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && quickInput.value.trim()) {
          const title = quickInput.value.trim();
          if (!tasks[quickAddSection]) tasks[quickAddSection] = [];
          tasks[quickAddSection].unshift({
            id: Date.now() + Math.random(),
            title,
            note: '',
            checked: false,
            subtasks: [],
            section: quickAddSection
          });
          quickInput.value = '';
          markChanged();
          renderTasks();
          setTimeout(() => document.getElementById('quickAddInput')?.focus(), 10);
        }
      });

      sectionBtn.addEventListener('click', (e) => { showSectionPicker(e.target); });

      // Render each section
      sections.forEach(section => {
        const sectionTasks = sortedSectionTasks(section.id);
        const sectionEl = document.createElement('div');
        sectionEl.className = 'list-section';
        sectionEl.dataset.sectionId = section.id;

        const header = document.createElement('div');
        header.className = 'list-section-header';
        header.innerHTML = `
          <span class="section-title" data-section-id="${section.id}">${section.name}</span>
          <span class="count">${sectionTasks.length}</span>
        `;

        header.querySelector('.section-title').addEventListener('click', (e) => {
          startEditingListSectionTitle(e.target, section);
        });

        sectionEl.appendChild(header);

        const tasksContainer = document.createElement('div');
        tasksContainer.className = 'list-tasks-container';
        tasksContainer.dataset.sectionId = section.id;

        sectionTasks.forEach(task => {
          tasksContainer.appendChild(createListItem(task, section));
        });

        sectionEl.appendChild(tasksContainer);

        // Drag-and-drop handlers for section
        const getDropPosition = (e, container) => {
          const items = [...container.querySelectorAll('.list-item:not(.dragging)')];
          let insertBeforeEl = null;
          let dropIndex = items.length;
          for (let i = 0; i < items.length; i++) {
            const rect = items[i].getBoundingClientRect();
            if (e.clientY < rect.top + rect.height / 2) {
              insertBeforeEl = items[i];
              dropIndex = i;
              break;
            }
          }
          return { insertBeforeEl, dropIndex };
        };

        const showDropIndicator = (e) => {
          tasksContainer.querySelectorAll('.list-drop-indicator').forEach(el => el.remove());
          const { insertBeforeEl } = getDropPosition(e, tasksContainer);
          const indicator = document.createElement('div');
          indicator.className = 'list-drop-indicator';
          if (insertBeforeEl) { tasksContainer.insertBefore(indicator, insertBeforeEl); }
          else { tasksContainer.appendChild(indicator); }
        };

        sectionEl.addEventListener('dragover', (e) => {
          e.preventDefault();
          sectionEl.classList.add('drag-over');
          showDropIndicator(e);
        });

        sectionEl.addEventListener('dragleave', (e) => {
          if (!sectionEl.contains(e.relatedTarget)) {
            sectionEl.classList.remove('drag-over');
            tasksContainer.querySelectorAll('.list-drop-indicator').forEach(el => el.remove());
          }
        });

        sectionEl.addEventListener('drop', (e) => {
          e.preventDefault();
          sectionEl.classList.remove('drag-over');
          tasksContainer.querySelectorAll('.list-drop-indicator').forEach(el => el.remove());
          const taskId = parseFloat(e.dataTransfer.getData('text/plain'));
          if (!taskId) return;
          const { dropIndex } = getDropPosition(e, tasksContainer);
          moveTask(taskId, section.id, dropIndex);
        });

        listView.appendChild(sectionEl);
      });

      // Add Section button
      const addSectionBtn = document.createElement('div');
      addSectionBtn.className = 'list-add-section';
      addSectionBtn.textContent = '+ Add Section';
      addSectionBtn.addEventListener('click', () => { startAddingListSection(addSectionBtn); });
      listView.appendChild(addSectionBtn);
    }

    function startEditingListSectionTitle(titleEl, section) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = section.name;
      input.style.cssText = 'width: 200px; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 4px 10px; color: var(--text-primary); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-family: inherit; outline: none;';

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newName = input.value.trim();
        if (newName && newName !== section.name) {
          const oldId = section.id;
          section.name = newName;
          const newId = taskSectionId(newName);
          if (newId !== oldId) {
