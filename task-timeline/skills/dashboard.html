<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Task timeline dashboard.
    Derived from the dashboard.html in Anthropic's "productivity" plugin (Apache License 2.0).
    Modified: timeline view (swimlanes by category, process roll-ups, drag/resize bars,
    milestones, holidays, vacations, deadline column, row hover), recurring-task markers,
    source links, status filters, and a token-based light/dark theme. See NOTICE.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task timeline</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='2' width='24' height='28' rx='4' fill='%231e252d' stroke='%2300a83f' stroke-width='2'/%3E%3Crect x='8' y='0' width='16' height='5' rx='2.5' fill='%2300a83f'/%3E%3Cpath d='M9 13l3 3 5-5' fill='none' stroke='%2300e054' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='20' y='12' width='5' height='2' rx='1' fill='%23667788'/%3E%3Crect x='9' y='20' width='10' height='2' rx='1' fill='%23667788'/%3E%3Crect x='9' y='25' width='7' height='2' rx='1' fill='%23667788'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== Design tokens (tokens.css, dashboards STYLE.md) =====
       Dark by default; warm-paper light theme when the system prefers light
       or <html data-theme="light">. data-theme="dark" forces dark.
       Components reference these variables only — no raw hex below this block. */
    :root {
      --bg: #14181c; --card: #1e252d; --card-2: #2c3440; --line: #2c3440; --line-2: #384352;
      --text: #e6edf3; --text-2: #9ab; --text-3: #678;
      --green: #00e054; --green-mark: #00a83f; --blue-mark: #2a9dd1; --orange: #ff8000;
      --c-good: #25a657; --c-best: #4cc972; --c-active: #4d8f63; --c-ok: #5b8fb9; --c-before: #5b6e80;
      --c-muted: #6b7885; --c-bad: #5d6975; --c-recede: #4a5563; --c-known: #3a4551;
      --c-lines: rgba(122, 135, 148, .22);
      --tag-fg: #fff; --tag-bg: #2c3440; --art: #b9a3dd; --art-line: #7a5aa8;
      --active-bg: #10261a; --active-pill: #0d1f16;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* panel surface (columns, timeline panes) sits between page and card */
      --panel: color-mix(in srgb, var(--card) 50%, var(--bg));
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #f5efe2; --card: #fffdf7; --card-2: #ece5d4; --line: #e6dfcd; --line-2: #d1c7b1;
        --text: #1e1a13; --text-2: #5a5446; --text-3: #7d7668;
        --green: #00a83f; --green-mark: #00913a;
        --tag-fg: #fff; --tag-bg: #7d7668; --art: #6a4aa0; --art-line: #9a84c6;
        --active-bg: #e4f3e8; --active-pill: #d3ead9;
        --panel: color-mix(in srgb, var(--card-2) 55%, var(--bg));
        --warn-ink: color-mix(in srgb, var(--orange) 50%, var(--text));
        --warn-ring: transparent;
        --warn-ring-soft: transparent;
        --grid-day: color-mix(in srgb, var(--text) 7%, transparent);
        --grid-week: color-mix(in srgb, var(--text) 12%, transparent);
        --grid-month: color-mix(in srgb, var(--text) 21%, transparent);
        --row-hover: color-mix(in srgb, var(--text) 8%, transparent);
        color-scheme: light;
      }
    }
    :root[data-theme="light"] {
      --bg: #f5efe2; --card: #fffdf7; --card-2: #ece5d4; --line: #e6dfcd; --line-2: #d1c7b1;
      --text: #1e1a13; --text-2: #5a5446; --text-3: #7d7668;
      --green: #00a83f; --green-mark: #00913a;
      --tag-fg: #fff; --tag-bg: #7d7668; --art: #6a4aa0; --art-line: #9a84c6;
      --active-bg: #e4f3e8; --active-pill: #d3ead9;
      --panel: color-mix(in srgb, var(--card-2) 55%, var(--bg));
      --warn-ink: color-mix(in srgb, var(--orange) 50%, var(--text));
      --warn-ring: transparent;
      --warn-ring-soft: transparent;
      --grid-day: color-mix(in srgb, var(--text) 7%, transparent);
      --grid-week: color-mix(in srgb, var(--text) 12%, transparent);
      --grid-month: color-mix(in srgb, var(--text) 21%, transparent);
      --row-hover: color-mix(in srgb, var(--text) 8%, transparent);
      color-scheme: light;
    }

    /* Board vocabulary mapped onto the tokens */
    :root {
      --bg-primary: var(--bg);
      --bg-secondary: var(--panel);
      --bg-card: var(--card);
      --text-primary: var(--text);
      --text-secondary: var(--text-2);
      --text-muted: var(--text-3);
      --accent: var(--green-mark);
      --accent-hover: color-mix(in srgb, var(--green-mark) 82%, black);
      --border: var(--line);
      --border-light: var(--line);
      --shadow: transparent;
      --shadow-hover: transparent;
      --hover-wash: color-mix(in srgb, var(--text) 5%, transparent);

      /* Section colors: one warning hue (orange), green = active, blue = waiting, greys recede */
      --s-urgent: var(--orange);
      --s-not-started: var(--c-before);
      --s-active: var(--c-active);
      --s-waiting: var(--c-ok);
      --s-some-day: var(--c-recede);
      --s-completed: var(--c-good);
      --s-overdue: var(--orange);
      /* Warning ink (text, thin borders) and bar outline. On dark the orange itself reads well;
         on cream it is only ~2.2:1, so light uses a darker burnt orange (~5:1) and drops the outline. */
      --warn-ink: var(--orange);
      /* Timeline gridlines: day < week (Monday) < month (1st), same hierarchy at every zoom */
      --grid-day: color-mix(in srgb, var(--text) 9%, transparent);
      --grid-week: color-mix(in srgb, var(--text) 13%, transparent);
      --grid-month: color-mix(in srgb, var(--text) 22%, transparent);
      --row-hover: color-mix(in srgb, var(--text) 7%, transparent);
      --warn-ring: var(--orange);
      --warn-ring-soft: color-mix(in srgb, var(--orange) 55%, transparent);
      --holiday: var(--art);
      --vacation: var(--c-good);
    }

    body {
      font-family: var(--font);
      font-size: 14px;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      padding: 20px 24px;
      line-height: 1.5;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; color: var(--text-secondary); }

    .header-left {
      display: flex;
      align-items: flex-start;
      gap: 0;
    }

    .view-toggle {
      display: flex;
      gap: 4px;
      background: var(--card-2);
      padding: 4px;
      border-radius: 8px;
      margin-left: 16px;
    }

    .view-toggle[data-caption] { position: relative; }
    .view-toggle[data-caption]::after {
      content: attr(data-caption);
      position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
      text-align: center; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted); pointer-events: none;
    }

    .view-toggle button {
      background: transparent;
      border: none;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-muted);
      border-radius: 6px;
    }

    .view-toggle button:hover {
      color: var(--text-primary);
      background: transparent;
    }

    .view-toggle button.active {
      background: var(--card);
      color: var(--text-primary);
      font-weight: 700;
    }

    .buttons { display: flex; gap: 12px; align-items: center; }
    .unsupported-note {
      max-width: 520px; margin: 0 auto 20px; padding: 14px 18px; text-align: left;
      background: color-mix(in srgb, var(--s-waiting) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--s-waiting) 45%, transparent);
      border-radius: var(--radius); color: var(--text); font-size: 14px; line-height: 1.5;
    }
    .unsupported-note strong { display: block; margin-bottom: 4px; }
    .demo-banner {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      margin: -4px 0 14px; padding: 9px 16px; flex-shrink: 0;
      background: var(--active-bg); border: 1px solid color-mix(in srgb, var(--green-mark) 45%, transparent);
      border-radius: var(--radius); font-size: 13px; color: var(--text-2);
    }
    .demo-banner .demo-tag {
      background: var(--green-mark); color: var(--tag-fg); font-weight: 700; font-size: 11px;
      letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px;
    }
    .demo-banner .spacer { flex: 1; }
    .demo-banner a {
      color: var(--green); font-weight: 700; text-decoration: none; white-space: nowrap;
    }
    .demo-banner a:hover { text-decoration: underline; }
    .theme-toggle { padding: 8px 12px; font-size: 15px; line-height: 1; border-radius: 999px; }

    button {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--line-2);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    button:hover {
      background: var(--card-2);
      border-color: var(--line-2);
    }

    button.primary {
      background: var(--accent);
      color: var(--tag-fg);
      font-weight: 700;
      border-color: var(--accent);
    }

    button.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== TASKS STYLES ===== */

    .board {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 24px;
      flex: 1;
      min-height: 0;
    }

    .column {
      background: var(--bg-secondary);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      min-width: 340px;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 100%;
    }

    .column-header {
      padding: 16px 18px;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--green);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .column-header:active {
      cursor: grabbing;
    }

    .column.dragging-column {
      opacity: 0.5;
    }

    .column-drop-indicator {
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 0 -2px;
      min-height: 100px;
    }

    .column-header .count {
      background: var(--card-2);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .cards {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 12px;
      min-height: 100px;
    }

    .cards.drag-over {
      background: color-mix(in srgb, var(--green-mark) 8%, transparent);
      border-radius: 8px;
    }

    .task-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: grab;
      transition: all 0.15s ease;
      position: relative;
    }

    .task-card:hover {
      transform: translateY(-1px);
      border-color: var(--line-2);
    }

    .task-card .add-on-hover {
      display: none;
    }

    .task-card:hover .add-on-hover {
      display: block;
    }

    .task-card .delete-btn {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      font-size: 14px;
      line-height: 1;
      border-radius: 4px;
    }

    .task-card:hover .delete-btn {
      display: block;
    }

    .task-card .delete-btn:hover {
      background: var(--card-2);
      color: var(--warn-ink);
    }

    .task-card.dragging {
      opacity: 0.5;
      transform: rotate(2deg);
    }

    .card-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .card-note {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .card-subtasks {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-light);
      font-size: 13px;
      color: var(--text-secondary);
    }

    .subtask {
      padding: 3px 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      min-width: 18px;
      min-height: 18px;
      flex-shrink: 0;
      border: 2px solid var(--line-2);
      border-radius: 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--bg-card);
    }

    .checkbox:hover {
      border-color: var(--accent);
    }

    .checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .checkbox.checked::after {
      content: '';
      width: 5px;
      height: 9px;
      border: solid var(--tag-fg);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: var(--text-muted);
    }

    .empty-state button {
      font-size: 16px;
      padding: 14px 28px;
      background: var(--accent);
      border: none;
      color: var(--tag-fg);
      font-weight: 700;
    }

    .empty-state button:hover {
      background: var(--accent-hover);
    }

    .status-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: var(--bg-primary);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 200;
    }

    .status-bar.visible { opacity: 1; }

    .add-card {
      padding: 12px;
    }

    .add-card button {
      width: 100%;
      background: transparent;
      border: 2px dashed var(--line-2);
      color: var(--text-muted);
      font-weight: 500;
    }

    .add-card button:hover {
      border-color: var(--accent);
      color: var(--green);
      background: transparent;
    }

    .new-task-input {
      width: 100%;
      background: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      resize: none;
    }

    .new-task-input:focus {
      outline: none;
    }

    .new-task-input::placeholder {
      color: var(--text-muted);
    }

    /* Scrollbar styling */
    .cards::-webkit-scrollbar,
    .list-view::-webkit-scrollbar {
      width: 6px;
    }

    .cards::-webkit-scrollbar-track,
    .list-view::-webkit-scrollbar-track {
      background: transparent;
    }

    .cards::-webkit-scrollbar-thumb,
    .list-view::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .cards::-webkit-scrollbar-thumb:hover,
    .list-view::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* List View Styles */
    .list-view {
      max-width: 800px;
      margin: 0 auto;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
    }

    /* Timeline View Styles */
    .timeline-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
      min-height: 0;
      overflow: hidden;
      padding-bottom: 8px;
    }

    .timeline-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 0 10px 0;
      flex-shrink: 0;
    }

    .timeline-toolbar .tb-group {
      display: flex;
      background: var(--card-2);
      border-radius: 6px;
      padding: 2px;
      gap: 1px;
    }

    .timeline-toolbar .tb-group button {
      background: transparent;
      border: none;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--text-muted);
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }

    .timeline-toolbar .tb-group button:hover {
      color: var(--text-primary);
      background: var(--hover-wash);
    }

    .timeline-toolbar .tb-group button.active {
      background: var(--card);
      color: var(--text-primary);
      font-weight: 700;
    }

    .timeline-toolbar .tb-btn {
      background: var(--bg-card);
      border: 1px solid var(--line-2);
      padding: 5px 12px;
      font-size: 12px;
      color: var(--text-primary);
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }

    .timeline-toolbar .tb-btn:hover {
      background: var(--bg-secondary);
      border-color: var(--text-muted);
    }

    .timeline-toolbar .tb-btn.primary {
      background: var(--accent);
      color: var(--tag-fg);
      font-weight: 700;
      border-color: var(--accent);
    }

    .timeline-toolbar .tb-btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .timeline-toolbar .spacer { flex: 1; }

    .timeline-view::-webkit-scrollbar { width: 6px; height: 8px; }
    .timeline-view::-webkit-scrollbar-track { background: transparent; }
    .timeline-view::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Top: gantt area with name column + scrolling date grid */
    .timeline-gantt-wrap {
      flex: 1;
      display: flex;
      min-height: 0;
      gap: 8px;
    }

    .timeline-undated-row {
      max-height: 140px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      margin-top: 8px;
    }

    .timeline-undated {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
    }

    .timeline-undated-label {
      width: 100%;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin: 0 0 4px 0;
      font-weight: 600;
    }

    .timeline-undated h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin: 0 0 12px 0;
      font-weight: 600;
    }

    .timeline-undated .undated-item {
      background: var(--bg-card);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      border-left: 3px solid var(--text-muted);
      cursor: grab;
      user-select: none;
      max-width: 220px;
    }

    .timeline-undated .undated-item:active {
      cursor: grabbing;
    }

    .timeline-undated .undated-item:hover {
      border-left-color: var(--accent);
    }

    .timeline-undated .undated-item.dragging {
      opacity: 0.4;
    }

    .timeline-undated .undated-item .item-section {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .timeline-undated .undated-item.checked {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .timeline-undated-hint {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 10px;
      padding: 6px 8px;
      background: var(--hover-wash);
      border-radius: 6px;
    }

    /* Deadline column (between names and main) */
    .timeline-deadlines {
      width: 90px;
      min-width: 90px;
      background: var(--bg-secondary);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
    }
    .timeline-deadlines-header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      padding: 0 12px 8px 12px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .timeline-deadlines-body {
      flex: 1;
      overflow-y: hidden;
    }
    .timeline-deadline-row {
      height: 38px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
      box-sizing: border-box;
      white-space: nowrap;
    }
    .timeline-deadline-row.category {
      font-weight: 600;
      font-size: 11px;
      color: var(--text-primary);
      border-top: 1px solid var(--border);
    }
    .timeline-deadline-row.category.bag {
      /* no special background */
    }
    .timeline-deadline-row.overdue {
      color: var(--warn-ink);
      background: color-mix(in srgb, var(--s-overdue) 7%, transparent);
    }
    .timeline-deadline-row .deadline-empty {
      color: var(--text-muted);
      font-style: italic;
      font-size: 10px;
    }

    /* Left name column for swimlanes */
    .timeline-names {
      width: 260px;
      min-width: 260px;
      background: var(--bg-secondary);
      border-radius: var(--radius) 0 0 var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }

    .timeline-names-header {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      padding: 0 14px 8px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .timeline-names-body {
      flex: 1;
      overflow-y: hidden; /* synced with main */
    }

    .timeline-name-row {
      display: flex;
      align-items: center;
      padding: 0 12px;
      height: 38px;
      border-bottom: 1px solid var(--border);
      gap: 8px;
      font-size: 12px;
    }

    .timeline-name-row.category {
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      border-top: 1px solid var(--border);
    }

    .timeline-name-row.category:hover {
      background: var(--hover-wash);
    }

    .timeline-name-row.category.bag {
      /* no shading — just inherits the border separators */
    }

    .timeline-name-row .caret {
      color: var(--text-muted);
      font-size: 10px;
      width: 12px;
      flex-shrink: 0;
    }

    .timeline-name-row.subtask {
      padding-left: 28px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .timeline-name-row .name-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timeline-name-row .pct {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    .timeline-name-row .count {
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .timeline-name-row .cat-add-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
      font-family: inherit;
    }
    .timeline-name-row .cat-add-btn:hover {
      background: var(--accent);
      color: var(--tag-fg);
      border-color: var(--accent);
    }

    .timeline-name-row .cat-overdue {
      font-size: 11px;
      color: var(--warn-ink);
      font-weight: 600;
      background: color-mix(in srgb, var(--s-overdue) 14%, transparent);
      padding: 1px 6px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .timeline-name-row .row-overdue-icon {
      color: var(--warn-ink);
      font-weight: 600;
    }

    .timeline-name-row.subtask.overdue {
      background: color-mix(in srgb, var(--s-overdue) 7%, transparent);
    }
    .timeline-name-row.subtask.overdue .name-text {
      color: var(--warn-ink);
    }
    .timeline-name-row.subtask:hover {
      background: var(--hover-wash);
    }

    .timeline-main {
      flex: 1;
      background: var(--bg-secondary);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 0;
      overflow: auto;
      min-width: 0;
      position: relative;
    }

    .timeline-canvas {
      position: relative;
      min-height: 100%;
    }

    .timeline-header-row {
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      height: 56px;
    }

    .timeline-day-tick {
      position: absolute;
      top: 0;
      width: var(--day-w, 60px);
      height: 100%;
      text-align: center;
      box-sizing: border-box;
      border-left: 1px solid var(--grid-day);
    }
    .timeline-day-tick.wk { border-left-color: var(--grid-week); }
    .timeline-day-tick.mo { border-left-color: var(--grid-month); }

    .timeline-day-tick.today {
      background: color-mix(in srgb, var(--green-mark) 12%, transparent);
      border-left: 2px solid var(--green);
    }

    .timeline-day-tick.weekend {
      background: var(--hover-wash);
    }

    .timeline-day-tick .month {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      padding-top: 4px;
      white-space: nowrap;
      overflow: visible;
    }

    .timeline-day-tick .dow {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .timeline-day-tick .dom {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .timeline-day-tick.today .dom {
      color: var(--green);
    }

    .timeline-bg-col {
      position: absolute;
      top: 56px;
      bottom: 0;
      width: var(--day-w, 60px);
      box-sizing: border-box;
      border-left: 1px solid var(--grid-day);
    }
    .timeline-bg-col.wk { border-left-color: var(--grid-week); }
    .timeline-bg-col.mo { border-left-color: var(--grid-month); }

    .timeline-bg-col.today {
      background: color-mix(in srgb, var(--green-mark) 6%, transparent);
      border-left: 2px solid var(--green);
    }

    .timeline-bg-col.weekend {
      background: var(--hover-wash);
    }

    .timeline-bg-col.holiday {
      background: color-mix(in srgb, var(--holiday) 9%, transparent);
    }

    .timeline-bg-col.holiday.weekend {
      background: color-mix(in srgb, var(--holiday) 13%, transparent);
    }

    .timeline-bg-col.vacation {
      background: color-mix(in srgb, var(--vacation) 8%, transparent);
    }
    .timeline-bg-col.vacation.weekend {
      background: color-mix(in srgb, var(--vacation) 13%, transparent);
    }
    .timeline-bg-col.vacation.holiday {
      background: color-mix(in srgb, var(--vacation) 13%, transparent);
    }

    .timeline-day-tick.holiday .dom {
      color: var(--holiday);
    }

    /* Vacation band overlay — visible at all zoom levels */
    .timeline-vacation-band {
      position: absolute;
      top: 56px;
      bottom: 0;
      background: color-mix(in srgb, var(--vacation) 5%, transparent);
      border-left: 2px dashed color-mix(in srgb, var(--vacation) 55%, transparent);
      border-right: 2px dashed color-mix(in srgb, var(--vacation) 55%, transparent);
      pointer-events: none;
      z-index: 3;
    }
    /* Vacation label sits in a strip between the date row and the timeline,
       above the sticky header (which has z-index:3 and an opaque background). */
    .timeline-vacation-hdr {
      position: absolute;
      top: 37px;
      height: 19px;
      z-index: 6;
      pointer-events: none;
    }
    .timeline-vacation-hdr .vac-label {
      position: sticky;
      left: 3px;
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      background: var(--active-bg);
      padding: 1px 8px;
      border: 1px solid color-mix(in srgb, var(--green-mark) 50%, transparent);
      border-bottom: 2px solid var(--green-mark);
      border-radius: 5px 5px 0 0;
      white-space: nowrap;
    }

    .timeline-bg-col.drop-target {
      background: color-mix(in srgb, var(--green-mark) 20%, transparent);
    }

    /* Category manager table */
    .cat-mgr-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cat-mgr-table th { text-align: left; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; }
    .cat-mgr-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .cat-mgr-table input[type=text] {
      width: 100%; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-primary); font-family: inherit; font-size: 13px;
    }
    .cat-mgr-table select {
      padding: 5px 8px; border-radius: 4px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-primary); font-family: inherit; font-size: 13px;
    }
    .cat-mgr-table .usage { color: var(--text-muted); font-size: 12px; text-align: right; }
    .cat-mgr-table .del-btn {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
    }
    .cat-mgr-table .del-btn:not(:disabled):hover { background: color-mix(in srgb, var(--s-overdue) 14%, transparent); color: var(--warn-ink); border-color: var(--warn-ink); }
    .cat-mgr-table .del-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .cat-mgr-add { margin-top: 10px; background: transparent; border: 1px dashed var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--text-muted); width: 100%; font-family: inherit; font-size: 13px; }
    .cat-mgr-add:hover { color: var(--green); border-color: var(--accent); }

    /* Day-click popover */
    .timeline-day-popover {
      position: absolute;
      z-index: 20;
      background: var(--bg-card);
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 200px;
      font-size: 13px;
    }
    .timeline-day-popover .pop-date {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }
    .timeline-day-popover .pop-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .timeline-day-popover .pop-btn {
      background: var(--accent);
      color: var(--tag-fg);
      font-weight: 700;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      width: 100%;
    }
    .timeline-day-popover .pop-btn:hover { background: var(--accent-hover); }

    /* Make day-ticks clickable */
    .timeline-day-tick { cursor: pointer; }
    .timeline-bg-col { cursor: pointer; }

    /* Thin vertical line marking 'today' — visible at all zoom levels */
    .timeline-today-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--green);
      pointer-events: none;
      z-index: 2;
    }

    /* 🎉 marker sitting at the top of the timeline on each holiday day.
       Centered on its day column; the holiday name shows on hover (title). */
    .timeline-holiday-marker {
      position: absolute;
      top: 1px;
      z-index: 7;
      transform: translateX(-50%);
      font-size: 11px;
      line-height: 1;
      pointer-events: auto;
      cursor: default;
      user-select: none;
    }

    /* Thin dashed vertical gridline marking the start of each week (Monday).
       Shown at month zoom, where the only solid gridlines are month starts. */
    .timeline-week-line {
      position: absolute;
      top: 56px;
      bottom: 0;
      border-left: 1px solid var(--grid-week);
      pointer-events: none;
      z-index: 1;
    }

    .timeline-lanes {
      position: relative;
      /* No padding-top here: the sticky headerRow above lives in normal flow
         and already pushes lanes down 56px. Adding padding here would
         misalign lanes vs. the names column (which has no equivalent offset). */
    }

    .timeline-lane {
      position: relative;
      height: 38px;
    }

    .timeline-bar {
      position: absolute;
      top: 6px;
      height: 26px;
      /* Translucent so day gridlines and weekend/holiday tints show through */
      background: color-mix(in srgb, var(--card) 70%, transparent);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      color: var(--text);
      padding: 3px 8px 3px 10px;
      font-size: 12px;
      display: flex;
      align-items: center;
      cursor: grab;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      user-select: none;
      box-sizing: border-box;
      line-height: 1.2;
    }

    .timeline-bar:active {
      cursor: grabbing;
    }

    .timeline-bar.dragging {
      opacity: 0.7;
      z-index: 10;
    }

    .timeline-bar.resizing {
      opacity: 0.8;
    }

    .timeline-bar.overdue {
      border-left-color: var(--s-overdue);
      background: color-mix(in srgb, var(--s-overdue) 12%, transparent);
    }

    .timeline-bar.checked {
      opacity: 0.5;
    }

    /* Section-based bar coloring (tokens.css task-board mapping).
       Urgent + overdue share the one warning hue (orange). Active = green, Waiting = blue,
       Not started / Some day = receding greys, Completed = faded green.
       Bars sit at ~70 % strength; bars touching the current week (.now) go to full strength. */
    .timeline-bar.sect-urgent {
      border-left-color: var(--s-urgent);
      background: color-mix(in srgb, var(--s-urgent) 18%, transparent);
      box-shadow: inset 0 0 0 1.5px var(--warn-ring-soft);
    }
    .timeline-bar.sect-not-started {
      border-left-color: var(--s-not-started);
      background: color-mix(in srgb, var(--s-not-started) 26%, transparent);
    }
    .timeline-bar.sect-active {
      border-left-color: var(--s-active);
      background: color-mix(in srgb, var(--s-active) 32%, transparent);
    }
    .timeline-bar.sect-waiting-for-others {
      border-left-color: var(--s-waiting);
      background: color-mix(in srgb, var(--s-waiting) 28%, transparent);
    }
    .timeline-bar.sect-some-day {
      border-left-color: var(--s-some-day);
      background: color-mix(in srgb, var(--s-some-day) 22%, transparent);
    }
    .timeline-bar.sect-completed {
      border-left-color: var(--s-completed);
      background: color-mix(in srgb, var(--s-completed) 8%, transparent);
      opacity: 0.45;
      text-decoration: line-through;
      color: var(--text-muted);
      box-shadow: none;
    }
    .timeline-bar:not(.now):not(.sect-completed):not(.checked) { opacity: 0.7; }
    .timeline-bar.now:not(.sect-completed):not(.checked) { opacity: 1; font-weight: 600; }
    /* Any checked task reads as done — faded, struck through — even before it moves to Completed. */
    .timeline-bar.checked {
      opacity: 0.45;
      text-decoration: line-through;
      color: var(--text-muted);
      box-shadow: none;
    }

    /* Board columns: section color as a 3 px top rule plus a faint header wash.
       Header labels follow the section-label style (green), Urgent keeps the warning hue. */
    .column.sect-urgent { border-top: 3px solid var(--s-urgent); }
    .column.sect-urgent .column-header { background: color-mix(in srgb, var(--s-urgent) 12%, transparent); color: var(--warn-ink); }

    .column.sect-not-started { border-top: 3px solid var(--s-not-started); }
    .column.sect-not-started .column-header { background: color-mix(in srgb, var(--s-not-started) 14%, transparent); }

    .column.sect-active { border-top: 3px solid var(--s-active); }
    .column.sect-active .column-header { background: color-mix(in srgb, var(--s-active) 16%, transparent); }

    .column.sect-waiting-for-others { border-top: 3px solid var(--s-waiting); }
    .column.sect-waiting-for-others .column-header { background: color-mix(in srgb, var(--s-waiting) 14%, transparent); }

    .column.sect-some-day { border-top: 3px solid var(--s-some-day); }
    .column.sect-some-day .column-header { background: color-mix(in srgb, var(--s-some-day) 14%, transparent); color: var(--text-muted); }

    .column.sect-completed { border-top: 3px solid color-mix(in srgb, var(--s-completed) 45%, transparent); }
    .column.sect-completed .column-header { background: color-mix(in srgb, var(--s-completed) 6%, transparent); color: var(--text-muted); }
    .column.sect-completed .task-card { opacity: 0.6; }

    /* Overdue indicator — applies on top of section color */
    .timeline-bar.overdue {
      border-left-color: var(--warn-ink);
      background: color-mix(in srgb, var(--s-overdue) 14%, transparent);
      box-shadow: inset 0 0 0 2px var(--warn-ring);
    }

    .timeline-bar .bar-overdue-icon {
      font-size: 11px;
      margin-right: 4px;
      color: var(--warn-ink);
      flex-shrink: 0;
    }

    /* Overdue counter in toolbar */
    .tb-overdue {
      background: color-mix(in srgb, var(--s-overdue) 14%, transparent);
      border: 1px solid var(--warn-ink);
      color: var(--warn-ink);
      padding: 5px 12px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }
    .tb-overdue:hover {
      background: color-mix(in srgb, var(--s-overdue) 22%, transparent);
    }

    /* Rollup bars for process categories */
    .timeline-rollup {
      position: absolute;
      top: 8px;
      height: 22px;
      background: color-mix(in srgb, var(--green-mark) 18%, transparent);
      border: 1px solid color-mix(in srgb, var(--green-mark) 45%, transparent);
      border-radius: 4px;
      box-sizing: border-box;
      pointer-events: none;
      overflow: hidden;
    }

    .timeline-rollup-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      background: color-mix(in srgb, var(--green-mark) 45%, transparent);
    }

    .timeline-rollup.bag {
      background: color-mix(in srgb, var(--c-muted) 16%, transparent);
      border-color: color-mix(in srgb, var(--c-muted) 35%, transparent);
    }

    /* Shading on the category lane showing which days have sub-task activity */
    .timeline-activity-band {
      position: absolute;
      top: 4px;
      bottom: 4px;
      background: color-mix(in srgb, var(--green-mark) 12%, transparent);
      border-radius: 2px;
      pointer-events: none;
    }

    .timeline-activity-band.bag {
      background: color-mix(in srgb, var(--c-muted) 14%, transparent);
    }

    .timeline-lane.category-lane {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .timeline-lane.category-lane.bag {
      /* no special background — just borders */
    }

    .timeline-lane.collapsed { display: none; }

    /* Row hover: the same row lights up in the names, deadline and timeline columns.
       Layered as a flat background-image so it sits on top of overdue/category tints. */
    .timeline-name-row.row-hover,
    .timeline-deadline-row.row-hover,
    .timeline-lane.row-hover {
      background-image: linear-gradient(var(--row-hover), var(--row-hover));
    }
    .timeline-name-row.row-hover .name-text { color: var(--text); }

    .timeline-bar:hover {
      filter: brightness(1.08);
    }

    .timeline-bar .bar-section {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .timeline-bar .bar-title {
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .timeline-bar .bar-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 7px;
      cursor: ew-resize;
      background: transparent;
    }

    .timeline-bar .bar-handle.start { left: 0; border-radius: 6px 0 0 6px; }
    .timeline-bar .bar-handle.end   { right: 0; border-radius: 0 6px 6px 0; }
    .timeline-bar .bar-handle:hover { background: color-mix(in srgb, var(--text) 12%, transparent); }

    .timeline-bar .milestone {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      background: var(--bg-card);
      border: 2px solid var(--green-mark);
      transform: rotate(45deg);
      box-sizing: border-box;
      cursor: help;
      z-index: 2;
    }
    .timeline-bar .milestone.checked {
      background: var(--green-mark);
    }

    .timeline-bar .bar-link {
      font-size: 11px;
      margin-right: 8px;
      text-decoration: none;
      cursor: pointer;
      opacity: 0.7;
      flex-shrink: 0;
    }
    .timeline-bar .bar-link:hover {
      opacity: 1;
    }

    .timeline-overdue-bucket {
      background: color-mix(in srgb, var(--s-overdue) 8%, transparent);
      border: 1px dashed var(--warn-ink);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .timeline-overdue-bucket h4 {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--warn-ink);
      margin: 0 0 6px 0;
      font-weight: 600;
    }

    .timeline-empty {
      padding: 32px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .list-section {
      margin-bottom: 28px;
    }

    .list-section.drag-over {
      background: color-mix(in srgb, var(--green-mark) 8%, transparent);
      border-radius: 8px;
      margin: 0 -12px 32px;
      padding: 0 12px;
    }

    .list-section-header {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--green);
      padding: 4px 0;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-section-header .section-title {
      cursor: pointer;
    }

    .list-section-header .section-title:hover {
      color: var(--text-primary);
    }

    .list-section-header .count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 6px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      cursor: grab;
      position: relative;
      border-radius: var(--radius);

  </style>
  <script>
    /* Theme: dark by default, light when the system prefers it; the sun/moon button
       forces one and remembers the choice. */
    (function () {
      const root = document.documentElement;
      try { const t = localStorage.getItem('task-timeline:theme'); if (t === 'light' || t === 'dark') root.dataset.theme = t; } catch {}
      const isLight = () => root.dataset.theme ? root.dataset.theme === 'light'
        : window.matchMedia('(prefers-color-scheme: light)').matches;
      const sync = () => { const b = document.getElementById('themeToggle'); if (b) b.textContent = isLight() ? '☾' : '☀'; };
      document.addEventListener('DOMContentLoaded', () => {
        sync();
        const b = document.getElementById('themeToggle');
        if (b) b.addEventListener('click', () => {
          root.dataset.theme = isLight() ? 'dark' : 'light';
          try { localStorage.setItem('task-timeline:theme', root.dataset.theme); } catch {}
          sync();
        });
      });
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', sync);
    })();
  </script>

  <script>
    // ===== SHARED STATE =====
    let activeMainTab = 'tasks'; // 'tasks' or 'memory'

    const statusEl = document.getElementById('status');
    const filePathEl = document.getElementById('filePath');

    function showStatus(msg) {
      statusEl.textContent = msg;
      statusEl.classList.add('visible');
      setTimeout(() => statusEl.classList.remove('visible'), 2000);
    }

    // ===== MAIN TAB SWITCHING =====
    const tasksTabBtn = document.getElementById('tasksTabBtn');
    const memoryTabBtn = document.getElementById('memoryTabBtn');
    const tasksPanel = document.getElementById('tasksPanel');
    const memoryPanel = document.getElementById('memoryPanel');
    const taskViewToggle = document.getElementById('taskViewToggle');
    const openTaskBtn = document.getElementById('openTaskBtn');
    const openMemoryBtn = document.getElementById('openMemoryBtn');
    const saveBtn = document.getElementById('saveBtn');

    function switchMainTab(tab) {
      activeMainTab = tab;

      tasksTabBtn.classList.toggle('active', tab === 'tasks');
      memoryTabBtn.classList.toggle('active', tab === 'memory');

      tasksPanel.classList.toggle('active', tab === 'tasks');
      memoryPanel.classList.toggle('active', tab === 'memory');

      // Show/hide view toggle for tasks
      taskViewToggle.style.display = tab === 'tasks' ? 'flex' : 'none';

      // Show/hide appropriate buttons
      openTaskBtn.style.display = tab === 'tasks' ? 'inline-flex' : 'none';
      openMemoryBtn.style.display = tab === 'memory' ? 'inline-flex' : 'none';
      saveBtn.style.display = tab === 'tasks' ? 'inline-flex' : 'none';

      // Update file path display
      if (tab === 'tasks') {
        filePathEl.textContent = taskFileHandle ? taskFileName : '';
      } else {
        filePathEl.textContent = memoryDirHandle ? memoryDirHandle.name : '';
      }
    }

    tasksTabBtn.addEventListener('click', () => switchMainTab('tasks'));
    memoryTabBtn.addEventListener('click', () => switchMainTab('memory'));

    // ============================================================
    // ===== TASKS FUNCTIONALITY =====
    // ============================================================

    let taskFileHandle = null;
    let taskFileName = '';
    let sections = [];
    let tasks = {};
    let hasChanges = false;
    let currentView = 'board';
    let quickAddSection = null;

    const board = document.getElementById('board');
    const listView = document.getElementById('listView');
    const listViewBtn = document.getElementById('listViewBtn');
    const boardViewBtn = document.getElementById('boardViewBtn');

    // Sort order for board + list views ('deadline' or 'manual'). Default: deadline.
    let taskSort = (() => {
      try { return localStorage.getItem('task-timeline:task-sort') || 'deadline'; }
      catch { return 'deadline'; }
    })();
    const sortDeadlineBtn = document.getElementById('sortDeadlineBtn');
    const sortManualBtn = document.getElementById('sortManualBtn');
    function refreshSortToggleUI() {
      sortDeadlineBtn.classList.toggle('active', taskSort === 'deadline');
      sortManualBtn.classList.toggle('active', taskSort === 'manual');
    }
    refreshSortToggleUI();
    sortDeadlineBtn.addEventListener('click', () => {
      taskSort = 'deadline';
      try { localStorage.setItem('task-timeline:task-sort', taskSort); } catch {}
      refreshSortToggleUI();
      renderTasks();
    });
    sortManualBtn.addEventListener('click', () => {
      taskSort = 'manual';
      try { localStorage.setItem('task-timeline:task-sort', taskSort); } catch {}
      refreshSortToggleUI();
      renderTasks();
    });
    // Returns a (maybe-sorted) copy of section tasks based on current taskSort
    function sortedSectionTasks(sectionId) {
      const arr = (tasks[sectionId] || []).slice();
      if (taskSort === 'deadline') {
        arr.sort((a, b) => {
          const aEnd = a.endDate ? a.endDate.getTime() : Infinity;
          const bEnd = b.endDate ? b.endDate.getTime() : Infinity;
          return aEnd - bEnd;
        });
      }
      return arr;
    }
    const timelineView = document.getElementById('timelineView');
    const timelineViewBtn = document.getElementById('timelineViewBtn');

    const DEFAULT_DURATION_DAYS = 7;

    // Range syntax in note: [YYYY-MM-DD → YYYY-MM-DD]
    // Accepts → / -> / .. / / as separator.
    const RANGE_REGEX = /\[(\d{4}-\d{2}-\d{2})\s*(?:→|->|\.\.|\/)\s*(\d{4}-\d{2}-\d{2})\]/;

    function dateKey(d) {
      const y = d.getFullYear();
      const mo = String(d.getMonth() + 1).padStart(2, '0');
      const da = String(d.getDate()).padStart(2, '0');
      return `${y}-${mo}-${da}`;
    }

    function parseIsoDate(s) {
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return null;
      const d = new Date(+m[1], +m[2] - 1, +m[3]);
      d.setHours(0, 0, 0, 0);
      return isNaN(d) ? null : d;
    }

    function dateAdd(d, days) {
      const r = new Date(d);
      r.setDate(r.getDate() + days);
      return r;
    }

    function daysBetween(a, b) {
      const ms = b.getTime() - a.getTime();
      return Math.round(ms / 86400000);
    }

    function fmtMonthLabel(d) {
      const months = currentLang === 'fr'
        ? ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.']
        : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    // ===== Finnish public holidays =====
    // Computes Easter Sunday for a given year (Anonymous Gregorian algorithm)
    function easterSunday(year) {
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }

    // Returns a Map<dateKey, name> of Finnish public holidays for a given year
    function finnishHolidaysFor(year) {
      const map = new Map();
      const add = (d, name) => map.set(dateKey(d), name);

      // Fixed-date holidays
      add(new Date(year, 0, 1),  'Uudenvuodenpäivä');
      add(new Date(year, 0, 6),  'Loppiainen');
      add(new Date(year, 4, 1),  'Vappu');
      add(new Date(year, 11, 6), 'Itsenäisyyspäivä');
      add(new Date(year, 11, 24),'Jouluaatto');
      add(new Date(year, 11, 25),'Joulupäivä');
      add(new Date(year, 11, 26),'Tapaninpäivä');

      // Easter-relative
      const easter = easterSunday(year);
      add(dateAdd(easter, -2), 'Pitkäperjantai');
      add(easter, 'Pääsiäispäivä');
      add(dateAdd(easter, 1), '2. pääsiäispäivä');
      add(dateAdd(easter, 39), 'Helatorstai');
      add(dateAdd(easter, 49), 'Helluntaipäivä');

      // Juhannus: Saturday between 20–26 June
      for (let day = 20; day <= 26; day++) {
        const d = new Date(year, 5, day);
        if (d.getDay() === 6) { // Saturday
          add(dateAdd(d, -1), 'Juhannusaatto');
          add(d, 'Juhannuspäivä');
          break;
        }
      }
      // Pyhäinpäivä: Saturday between 31 Oct – 6 Nov
      for (let m = 9, day = 31; ; day++) {
        if (day > 31 && m === 9) { m = 10; day = 1; }
        const d = new Date(year, m, day);
        if (d.getDay() === 6) {
          add(d, 'Pyhäinpäivä');
          break;
        }
        if (m === 10 && day > 6) break;
      }
      return map;
    }

    // Returns a Map<dateKey, name> of Canadian (federal) public holidays for a year
    function canadianHolidaysFor(year) {
      const map = new Map();
      const add = (d, name) => map.set(dateKey(d), name);

      // Fixed-date holidays
      add(new Date(year, 0, 1),   "New Year's Day");
      add(new Date(year, 6, 1),   'Canada Day');
      add(new Date(year, 8, 30),  'Truth & Reconciliation Day');
      add(new Date(year, 10, 11), 'Remembrance Day');
      add(new Date(year, 11, 25), 'Christmas Day');
      add(new Date(year, 11, 26), 'Boxing Day');

      // Easter-relative
      const easter = easterSunday(year);
      add(dateAdd(easter, -2), 'Good Friday');
      add(dateAdd(easter, 1),  'Easter Monday');

      // Victoria Day: Monday preceding May 25 (Mon between May 18–24)
      for (let day = 24; day >= 18; day--) {
        const d = new Date(year, 4, day);
        if (d.getDay() === 1) { add(d, 'Victoria Day'); break; }
      }
      // Labour Day: first Monday of September
      for (let day = 1; day <= 7; day++) {
        const d = new Date(year, 8, day);
        if (d.getDay() === 1) { add(d, 'Labour Day'); break; }
      }
      // Thanksgiving: second Monday of October
      let mondays = 0;
      for (let day = 1; day <= 14; day++) {
        const d = new Date(year, 9, day);
        if (d.getDay() === 1 && ++mondays === 2) { add(d, 'Thanksgiving'); break; }
      }
      return map;
    }

    // Which holiday calendars are shown. Persisted as a comma list, e.g. "fi,ca".
    let holidayCountries = (() => {
      try {
        const raw = localStorage.getItem('task-timeline:timeline-holiday-countries');
        if (raw !== null) return new Set(raw ? raw.split(',').filter(Boolean) : []);
      } catch {}
      return new Set(['fi']); // default: Finnish only
    })();
    function saveHolidayCountries() {
      try { localStorage.setItem('task-timeline:timeline-holiday-countries', [...holidayCountries].join(',')); } catch {}
    }
    const HOLIDAY_BUILDERS = { fi: finnishHolidaysFor, ca: canadianHolidaysFor };

    // Cache holiday maps per year+country-set to avoid recomputing on every render
    let _holidayCache = new Map();
    function _holidayCacheKey(year) { return [...holidayCountries].sort().join(',') + ':' + year; }
    function holidaysForYear(year) {
      const key = _holidayCacheKey(year);
      if (_holidayCache.has(key)) return _holidayCache.get(key);
      const merged = new Map();
      [...holidayCountries].forEach(c => {
        const builder = HOLIDAY_BUILDERS[c];
        if (!builder) return;
        builder(year).forEach((name, dk) => {
          // If two calendars share a date, show both names joined
          merged.set(dk, merged.has(dk) ? merged.get(dk) + ' / ' + name : name);
        });
      });
      _holidayCache.set(key, merged);
      return merged;
    }
    function holidayName(d) {
      return holidaysForYear(d.getFullYear()).get(dateKey(d)) || null;
    }

    // ===== Vacation periods (user-managed, persisted in localStorage) =====
    // Each entry: { label, start: 'YYYY-MM-DD', end: 'YYYY-MM-DD' } (inclusive range)
    function loadVacations() {
      try {
        const raw = localStorage.getItem('task-timeline:vacations');
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) {
            return arr
              .filter(v => v && v.start && v.end)
              .map(v => ({ label: v.label || 'Vacation', start: v.start, end: v.end }));
          }
        }
      } catch {}
      // First run: no vacations until the user adds some (🌴 button or the TASKS.md block)
      return [];
    }
    let vacations = loadVacations();
    function saveVacations() {
      try { localStorage.setItem('task-timeline:vacations', JSON.stringify(vacations)); } catch {}
    }
    // Returns the vacation entry covering date d (inclusive), or null.
    function vacationFor(d) {
      const k = dateKey(d);
      for (const v of vacations) {
        if (v.start && v.end && k >= v.start && k <= v.end) return v;
      }
      return null;
    }
    // Vacations are stored INSIDE TASKS.md (so they travel with the file across
    // browsers/machines) as an HTML comment block the task parser ignores:
    //   <!-- DASHBOARD:VACATIONS
    //   Summer holiday | 2026-06-06 | 2026-06-28
    //   -->
    function parseVacationsFromMarkdown(content) {
      const m = content.match(/<!--\s*DASHBOARD:VACATIONS\s*([\s\S]*?)-->/);
      if (!m) return null; // no block → caller keeps current vacations
      const out = [];
      m[1].split('\n').forEach(line => {
        const s = line.trim();
        if (!s) return;
        const parts = s.split('|').map(x => x.trim());
        if (parts.length >= 3
            && /^\d{4}-\d{2}-\d{2}$/.test(parts[1])
            && /^\d{4}-\d{2}-\d{2}$/.test(parts[2])) {
          out.push({ label: parts[0] || 'Vacation', start: parts[1], end: parts[2] });
        }
      });
      return out;
    }
    function vacationsBlockMarkdown() {
      if (!vacations || !vacations.length) return '';
      let s = '\n<!-- DASHBOARD:VACATIONS\n';
      vacations.forEach(v => { s += `${v.label || 'Vacation'} | ${v.start} | ${v.end}\n`; });
      s += '-->\n';
      return s;
    }

    // Compact deadline display, e.g. "29 May 2026" → "29 May" (current year) or "29 May 27" (other year)
    function fmtDeadline(d) {
      if (!d) return '';
      const months_en = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const months_fr = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
      const arr = currentLang === 'fr' ? months_fr : months_en;
      const thisYear = new Date().getFullYear();
      const day = d.getDate();
      const mon = arr[d.getMonth()];
      const yr = d.getFullYear();
      if (yr === thisYear) return `${day} ${mon}`;
      return `${day} ${mon} ’${String(yr).slice(-2)}`;
    }

    // Legacy free-text date parser — used only as fallback for tasks
    // that don't have an explicit [start → end] range.
    function parseLegacyDate(text) {
      if (!text) return null;
      const hay = text.toLowerCase();
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let m = hay.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) {
        const d = new Date(+m[1], +m[2] - 1, +m[3]);
        d.setHours(0, 0, 0, 0);
        if (!isNaN(d)) return d;
      }

      m = hay.match(/\b(\d{1,2})\.(\d{1,2})\.(\d{4})?/);
      if (m) {
        let y = m[3] ? +m[3] : today.getFullYear();
        const d = new Date(y, +m[2] - 1, +m[1]);
        d.setHours(0, 0, 0, 0);
        if (!m[3] && d < today && (today - d) > 30 * 86400000) {
          d.setFullYear(y + 1);
        }
        if (!isNaN(d)) return d;
      }

      return null;
    }

    // Returns {start, end, cleanNote, category, sourceLink, repeat} for a task's note.
    // - start/end are Date objects or null
    // - category is the first `BACKTICK_TAG` found in the note (or null)
    // - sourceLink is {label, url} for the first markdown link found (or null)
    // - repeat is 'monthly'|'quarterly'|'annual'|null — from `[↻ <cadence>]` marker
    // - cleanNote has range, category tag, source link, and repeat marker all stripped out
    function parseRangeFromNote(note) {
      let category = null;
      let sourceLink = null;
      let repeat = null;
      let cleanNote = note || '';

      // Pull out category tag (first backtick-quoted phrase)
      const catMatch = cleanNote.match(/`([^`]+)`/);
      if (catMatch) {
        category = catMatch[1].trim();
        cleanNote = cleanNote.replace(catMatch[0], '').replace(/\s{2,}/g, ' ').trim();
      }

      // Pull out the repeat marker. Accept the `↻` symbol or the ASCII "r:" alternative.
      const repMatch = cleanNote.match(/\[(?:↻|r:)\s*(monthly|quarterly|annual)\]/i);
      if (repMatch) {
        repeat = repMatch[1].toLowerCase();
        cleanNote = cleanNote.replace(repMatch[0], '').replace(/\s{2,}/g, ' ').trim();
      }

      // Pull out first markdown link [label](url)
      const linkMatch = cleanNote.match(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/);
      if (linkMatch) {
        sourceLink = { label: linkMatch[1].trim(), url: linkMatch[2].trim() };
        cleanNote = cleanNote.replace(linkMatch[0], '').replace(/\s{2,}/g, ' ').trim();
      }

      // Explicit range
      const m = cleanNote.match(RANGE_REGEX);
      if (m) {
        const start = parseIsoDate(m[1]);
        const end = parseIsoDate(m[2]);
        cleanNote = cleanNote.replace(RANGE_REGEX, '').replace(/\s+-\s+$/, '').replace(/^\s+-\s+/, '').replace(/\s{2,}/g, ' ').trim();
        return { start, end, cleanNote, category, sourceLink, repeat };
      }
      // Legacy single date → treat as end date
      const legacy = parseLegacyDate(cleanNote);
      if (legacy) {
        const start = dateAdd(legacy, -DEFAULT_DURATION_DAYS);
        return { start, end: legacy, cleanNote, category, sourceLink, repeat };
      }
      return { start: null, end: null, cleanNote, category, sourceLink, repeat };
    }

    // Build markdown serialization of a range. Always inject at start of the note
    // (after the leading dash) so the editable note text stays clean.
    function rangeForMarkdown(task) {
      if (!task.startDate || !task.endDate) return '';
      return `[${dateKey(task.startDate)} → ${dateKey(task.endDate)}]`;
    }

    function taskSectionId(name) {
      return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    }

    function parseTaskMarkdown(content) {
      const resultSections = [];
      const resultTasks = {};
      let currentSection = null;
      let currentSectionId = null;

      const lines = content.split('\n');
      let currentTask = null;

      for (const line of lines) {
        const headerMatch = line.match(/^## \*{0,2}(.+?)\*{0,2}$/);
        if (headerMatch) {
          if (currentTask && currentSectionId) {
            resultTasks[currentSectionId].push(currentTask);
            currentTask = null;
          }

          const sectionName = headerMatch[1].trim();
          currentSectionId = taskSectionId(sectionName);
          currentSection = sectionName;

          if (!resultTasks[currentSectionId]) {
            resultSections.push({ id: currentSectionId, name: sectionName });
            resultTasks[currentSectionId] = [];
          }
        } else if (currentSectionId && line.match(/^- \[[ xX]\]/)) {
          if (currentTask) {
            resultTasks[currentSectionId].push(currentTask);
          }
          const checked = line.match(/\[[xX]\]/) !== null;
          let text = line.replace(/^- \[[ xX]\]\s*/, '');
          let title = text;
          let note = '';

          const boldMatch = text.match(/^\*\*(.+?)\*\*(.*)$/);
          if (boldMatch) {
            title = boldMatch[1];
            note = boldMatch[2].replace(/^\s*-\s*/, '').trim();
          }

          const ranged = parseRangeFromNote(note);

          // Tasks in a "done" section are always considered checked, regardless of the raw markdown checkbox.
          const sectionIsDone = /^(valmiit|done|completed)$/i.test(currentSection);
          const effectiveChecked = checked || sectionIsDone;

          currentTask = {
            id: Date.now() + Math.random(),
            title,
            note: ranged.cleanNote,
            checked: effectiveChecked,
            subtasks: [],
            section: currentSectionId,
            startDate: ranged.start,
            endDate: ranged.end,
            category: ranged.category,
            sourceLink: ranged.sourceLink,
            repeat: ranged.repeat
          };
        } else if (currentTask && line.match(/^\s+- \[[ xX]\]/)) {
          const checked = line.match(/\[[xX]\]/) !== null;
          let text = line.replace(/^\s+- \[[ xX]\]\s*/, '');
          // Milestone date prefix: `[YYYY-MM-DD] label` → store as milestone, strip from text
          let milestone = null;
          const dm = text.match(/^\[(\d{4}-\d{2}-\d{2})\]\s*(.*)$/);
          if (dm) {
            milestone = parseIsoDate(dm[1]);
            text = dm[2];
          }
          currentTask.subtasks.push({ text, checked, milestone });
        }
      }

      if (currentTask && currentSectionId) {
        resultTasks[currentSectionId].push(currentTask);
      }

      return { sections: resultSections, tasks: resultTasks };
    }

    function toMarkdown() {
      let md = '# Tasks\n';

      sections.forEach((section, idx) => {
        md += `\n## ${section.name}\n`;
        const sectionIsDone = /^(valmiit|done|completed)$/i.test(section.name);
        const sectionTasks = tasks[section.id] || [];
        sectionTasks.forEach(t => {
          // Tasks in a Valmiit/Done section are always serialized with [x]
          const checkbox = (t.checked || sectionIsDone) ? '[x]' : '[ ]';
          const range = rangeForMarkdown(t);
          const cleanNote = (t.note || '').trim();
          const catTag = t.category ? `\`${t.category}\`` : '';
          const linkMd = (t.sourceLink && t.sourceLink.url)
            ? `[${t.sourceLink.label || 'link'}](${t.sourceLink.url})`
            : '';
          const repeatMd = t.repeat ? `[↻ ${t.repeat}]` : '';
          // Source link goes at the END (after the cleanNote) so the visible part stays brief
          const noteParts = [range, catTag, repeatMd, cleanNote, linkMd].filter(Boolean);
          const noteBlock = noteParts.length ? ` - ${noteParts.join(' ')}` : '';
          md += `- ${checkbox} **${t.title}**${noteBlock}\n`;
          t.subtasks.forEach(st => {
            const stCheckbox = st.checked ? '[x]' : '[ ]';
            const datePrefix = st.milestone ? `[${dateKey(st.milestone)}] ` : '';
            md += `  - ${stCheckbox} ${datePrefix}${st.text}\n`;
          });
        });
      });

      return md.trimEnd() + '\n' + vacationsBlockMarkdown();
    }

    function createCard(task) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.draggable = true;
      card.dataset.id = task.id;

      const srcIcon = (task.sourceLink && task.sourceLink.url)
        ? `<a class="card-source" href="${task.sourceLink.url.replace(/"/g,'%22')}" target="_blank" rel="noopener noreferrer" title="${escHtml(task.sourceLink.label || 'Open source link')}" onclick="event.stopPropagation()" style="font-size:13px; text-decoration:none; opacity:0.7; flex-shrink:0; margin-right:4px;">🔗</a>`
        : '';

      let html = `
        <div style="display: flex; align-items: flex-start; gap: 12px;">
          <button class="delete-btn" data-action="delete" title="Delete task">&times;</button>
          <span class="checkbox ${task.checked ? 'checked' : ''}" data-action="toggle"></span>
          <div class="card-title" data-action="edit-title" style="flex:1;">${task.title}</div>
          ${srcIcon}
        </div>
      `;

      if (task.note) {
        html += `<div class="card-note" data-action="edit-note" style="cursor: pointer; margin-left: 30px;">${task.note}</div>`;
      } else {
        html += `<div class="card-note add-on-hover" data-action="edit-note" style="cursor: pointer; margin-left: 30px; font-style: italic;">+ Add note</div>`;
      }

      if (task.subtasks.length > 0) {
        html += '<div class="card-subtasks" style="margin-left: 30px;">';
        task.subtasks.forEach((st, idx) => {
          html += `<div class="subtask">
            <span class="checkbox ${st.checked ? 'checked' : ''}" data-action="toggle-sub" data-idx="${idx}" style="width: 16px; height: 16px; min-width: 16px; min-height: 16px;"></span>
            <span data-action="edit-subtask" data-idx="${idx}" style="cursor: pointer;">${st.text}</span>
          </div>`;
        });
        html += `<div class="subtask add-on-hover" data-action="add-subtask" style="color: var(--text-muted); cursor: pointer; font-style: italic; padding-left: 24px;">+ Add subtask</div>`;
        html += '</div>';
      } else {
        html += `<div class="card-subtasks add-on-hover" style="margin-left: 30px;">
          <div class="subtask" data-action="add-subtask" style="color: var(--text-muted); cursor: pointer; font-style: italic;">+ Add subtask</div>
        </div>`;
      }

      card.innerHTML = html;

      card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        e.dataTransfer.setData('text/plain', task.id);
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
      });

      card.addEventListener('click', (e) => {
        const action = e.target.dataset.action;
        // Don't hijack clicks on the source-link icon (it has its own onclick)
        if (e.target.closest('.card-source')) return;

        if (action === 'toggle') {
          task.checked = !task.checked;
          // Mirror Valmiit binding: checking a non-Valmiit task moves to Valmiit; unchecking a Valmiit task moves out
          syncCheckedToSection(task);
          markChanged();
          renderTasks();
        } else if (action === 'toggle-sub') {
          const idx = parseInt(e.target.dataset.idx);
          task.subtasks[idx].checked = !task.subtasks[idx].checked;
          markChanged();
          renderTasks();
        } else if (action === 'edit-subtask') {
          const idx = parseInt(e.target.dataset.idx);
          startEditingSubtask(e.target, task, idx);
        } else if (action === 'add-subtask') {
          startAddingSubtask(e.target, task);
        } else if (action === 'delete') {
          deleteTask(task);
        } else {
          // edit-title, edit-note, or click anywhere else on the card → open full modal
          openTaskEditModal(itemForTask(task));
        }
      });

      return card;
    }

    function startEditingTitle(titleEl, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = task.title;
      input.style.cssText = 'width: 100%; background: var(--bg-card); border: 2px solid var(--accent); border-radius: 6px; padding: 6px 10px; color: var(--text-primary); font-size: 14px; font-family: inherit; outline: none;';

      titleEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      const saveEdit = () => {
        if (saved) return;
        saved = true;
        const newTitle = input.value.trim();
        if (newTitle && newTitle !== task.title) {
