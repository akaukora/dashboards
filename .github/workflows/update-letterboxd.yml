name: Update Letterboxd Data

on:
  schedule:
    - cron: '0 0 * * *'  # midnight UTC = 3:00 EEST (UTC+3 summer) / 2:00 EET (UTC+2 winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser
      - name: Run scraper
        run: python scrape_letterboxd.py
      - name: Commit and push updated films.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add films-watched/films.csv
          git commit -m "Update films.csv [$(date -u +%Y-%m-%d)]" || echo "No changes to commit"
          git push
