name: Update Letterboxd Data

on:
  schedule:
    - cron: '0 0 * * *'  # midnight UTC = 3:00 EEST (UTC+3 summer) / 2:00 EET (UTC+2 winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser
      - name: Run scraper
        run: python films-watched/scrape_letterboxd.py
      - name: Fetch film descriptions from TMDB (new films only)
        continue-on-error: true   # a TMDB hiccup must not block the films.csv commit
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python films-watched/fetch_descriptions.py
      - name: Commit and push updated films.csv and descriptions.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add films-watched/films.csv films-watched/descriptions.json
          git commit -m "Update films.csv [$(date -u +%Y-%m-%d)]" || echo "No changes to commit"
          # the branch may have moved while this job ran (an upload, another action): rebase our commit on top, then push
          git pull --rebase origin main
          git push
