# .github/workflows/update-lastfm.yml
# Pulls new Last.fm scrobbles into music/scrobbles.csv and rebuilds music/artists.csv.
# Runs every morning; can also be started by hand (Actions → Update Last.fm → Run workflow),
# with an optional full re-fetch of the whole history.
name: Update Last.fm

on:
  schedule:
    - cron: "17 3 * * *"          # 03:17 UTC daily (06:17 Helsinki in summer)
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch the whole history instead of only new scrobbles"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-lastfm
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120          # a first backfill of a long history takes ~5–10 min; daily runs take seconds
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch scrobbles
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: akaukora
        run: python music/fetch_lastfm.py ${{ inputs.full && '--full' || '' }}

      - name: Commit if anything changed
        if: always()                # also after a failed fetch: the checkpointed rows are kept and the next run continues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add music/scrobbles.csv music/artists.csv music/fetch_state.json 2>/dev/null || git add music/scrobbles.csv music/artists.csv
          if git diff --cached --quiet; then
            echo "No new scrobbles."
          else
            n=$(($(wc -l < music/scrobbles.csv) - 1))
            git commit -m "Last.fm: update scrobbles ($n rows)"
            # other commits may have landed while the fetch ran: rebase onto them, then push (a few tries)
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push attempt $i failed; retrying"; sleep 10
            done
          fi
