name: Update prediction markets dashboard

on:
  schedule:
    - cron: '17 5,17 * * *'   # 05:17 and 17:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests cryptography

      - name: Fetch positions
        env:
          POLYMARKET_WALLET: '0x7a373de589a0f6ac9f1fa9dde84296af2adbb10b'
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python prediction-markets/fetch_data.py

      - name: Commit if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- prediction-markets/data.json; then
            echo 'no change'
          else
            git add prediction-markets/data.json
            git commit -m "Update prediction markets data ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
          fi
